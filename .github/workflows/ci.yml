name: CI

# Runs on every pull request into `staging` or `main`, and is called (not triggered separately) by the two deploy
# workflows after a merge, so a merge is tested once and the deploy only runs when it passes.
on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:
  # Called by deploy-staging.yml and deploy-production.yml, and by the backend repo's CI (its `app-compat` job) to prove
  # a backend change does not break the app.
  workflow_call:
    inputs:
      backend_ref:
        description: Backend commit or branch to build against
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The app links @dyce/shared and @dyce/games from the sibling dyce-backend repo (ADR-011), so every job checks
# out both side by side. Configure in the repository settings (Settings > Secrets and variables > Actions):
#   variable BACKEND_REPO        owner/name of the backend repository   (default dyce-game/dyce-backend)
#   variable BACKEND_REF_STAGING     backend branch for staging and for pull requests into it   (default staging)
#   variable BACKEND_REF_PRODUCTION  backend TAG OR COMMIT for `main` (a production build is pinned, never a branch)
#   variable BACKEND_REF             one ref for both, if you do not need the two above
#   secret   BACKEND_REPO_TOKEN  read-only token, REQUIRED while the backend repository is private
env:
  BACKEND_REPO: ${{ vars.BACKEND_REPO || 'dyce-game/dyce-backend' }}
  # The app on `main` is tested against the pinned production backend; everything else against the staging backend.
  BACKEND_REF: ${{ inputs.backend_ref || ((github.base_ref || github.ref_name) == 'main' && (vars.BACKEND_REF_PRODUCTION || vars.BACKEND_REF || 'main') || (vars.BACKEND_REF_STAGING || vars.BACKEND_REF || 'staging')) }}

jobs:
  check:
    name: Lint, typecheck, format, unit tests, release config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Dyce
    steps:
      - uses: actions/checkout@v4
        with:
          path: Dyce
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ env.BACKEND_REF }}
          path: dyce-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Dyce/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Dyce/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # eas.json, the three app.config variants, and "no permission without the library that uses it".
      - run: pnpm release:check
      # The release scripts themselves (native-change detection decides whether a deploy starts a store build).
      - run: pnpm test:tools

  web-export:
    name: App bundles (web export) and the bundle is sane
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Dyce
    steps:
      - uses: actions/checkout@v4
        with:
          path: Dyce
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ env.BACKEND_REF }}
          path: dyce-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Dyce/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Dyce/pnpm-lock.yaml
      # Metro's transform cache: a warm cache cuts the export time a lot. Keyed on the lockfile and source.
      - uses: actions/cache@v4
        with:
          path: Dyce/node_modules/.cache
          key: metro-${{ runner.os }}-${{ hashFiles('Dyce/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            metro-${{ runner.os }}-${{ hashFiles('Dyce/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      # Built the way a production build is: the production variant, a real-looking API URL.
      - run: pnpm export:web
        env:
          APP_ENV: production
          EXPO_PUBLIC_API_URL: https://api.dyce.games
          EXPO_PUBLIC_GAME_SERVER_URL: wss://game.dyce.games
      # Boot smoke: the export is serveable, has a script entry, and points at the API it was told to.
      - run: node tools/release/check-web-export.mjs
        env:
          EXPECT_API_URL: https://api.dyce.games
