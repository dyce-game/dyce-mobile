name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The app links @dyce/shared and @dyce/games from the sibling dyce-backend repo (ADR-011), so every job checks
# out both side by side. Replace OWNER with the GitHub owner, add a BACKEND_REPO_TOKEN secret if the backend
# repo is private, and pin `ref` to the backend commit a release build was made against.
jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dyce
    steps:
      - uses: actions/checkout@v4
        with:
          path: Dyce
      - uses: actions/checkout@v4
        with:
          repository: OWNER/dyce-backend
          path: dyce-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Dyce/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Dyce/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  web-export:
    name: App bundles (web export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dyce
    steps:
      - uses: actions/checkout@v4
        with:
          path: Dyce
      - uses: actions/checkout@v4
        with:
          repository: OWNER/dyce-backend
          path: dyce-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Dyce/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Dyce/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm export:web
