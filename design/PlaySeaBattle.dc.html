<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Sea Battle in 3D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; color: #FFFFFF; background: linear-gradient(#0A1A33 0%, #10325C 40%, #0B2447 100%)">
  <span style="position: absolute; inset: 0; background: radial-gradient(ellipse 80% 30% at 50% 0%, rgba(255,170,90,.28), transparent 70%)" aria-hidden="true"></span>

  <div style="position: absolute; left: 35px; top: 176px; width: 320px; height: 320px; perspective: 1100px" role="img" aria-label="Tunde's waters: one sunk ship, two hits on another, five misses, crosshair on a new cell">
    <div style="position: absolute; inset: 0; transform: rotateX(56deg) rotateZ(-38deg); transform-style: preserve-3d">
      <span style="position: absolute; inset: -18px; border-radius: 20px; background: #06182F; box-shadow: 0 0 0 4px #1D4A80, 0 40px 60px rgba(0,0,0,.6)"></span>
      <span style="position: absolute; inset: 0; border-radius: 6px; background: radial-gradient(circle at 30% 30%, #2E7BC4, #17558F 60%, #0E3D6E)"></span>
      <span style="position: absolute; inset: 0; border-radius: 6px; background: repeating-radial-gradient(circle at 70% 80%, rgba(255,255,255,.07) 0 2px, transparent 2px 14px)"></span>
      <span style="position: absolute; inset: 0; background-image: linear-gradient(rgba(170,220,255,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(170,220,255,.35) 1px, transparent 1px); background-size: 40px 40px"></span>

      <span style="position: absolute; left: 82px; top: 46px; width: 116px; height: 28px; border-radius: 14px 40px 40px 14px; background: linear-gradient(#5E6670, #2E343B); box-shadow: 6px 8px 0 rgba(0,0,0,.35)"></span>
      <span style="position: absolute; left: 124px; top: 52px; width: 30px; height: 16px; border-radius: 4px; background: #7A828C"></span>

      <span style="position: absolute; left: 240px; top: 200px; width: 40px; height: 40px; border-radius: 6px; background: rgba(255,200,80,.25); box-shadow: inset 0 0 0 3px #E3A93B, 0 0 24px rgba(227,169,59,.8)"></span>

      <sc-for list="{{misses}}" as="m" hint-placeholder-count="5">
        <span style="position: absolute; left: {{m.x}}; top: {{m.y}}; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 3px solid rgba(255,255,255,.75); box-shadow: 0 0 0 5px rgba(255,255,255,.18)"></span>
      </sc-for>

      <sc-for list="{{fires}}" as="f" hint-placeholder-count="5">
        <div style="position: absolute; left: {{f.x}}; top: {{f.y}}; width: 34px; height: 54px; transform-origin: 50% 100%; transform: translate(-50%, -100%) rotateZ(38deg) rotateX(-56deg)">
          <span style="position: absolute; left: 3px; top: -26px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle, rgba(60,60,60,.7), transparent 70%); opacity: {{f.smoke}}"></span>
          <span style="position: absolute; left: 5px; bottom: 0; width: 24px; height: {{f.h}}; border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%; background: radial-gradient(ellipse at 50% 85%, #FFF3B0 0%, #FFB020 30%, #FF5A1F 60%, rgba(201,62,28,0) 85%)"></span>
        </div>
      </sc-for>
      <div style="position: absolute; left: 260px; top: 220px; width: 2px; height: 70px; transform-origin: 50% 100%; transform: translate(-50%, -100%) rotateZ(38deg) rotateX(-56deg); background: linear-gradient(rgba(227,169,59,0), #E3A93B)"></div>
    </div>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; top: 54px; display: flex; align-items: center; justify-content: space-between">
    <a href="Thread.dc.html" aria-label="Back to chat" style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>Chat</a>
    <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{modeBg}}; box-shadow: 0 2px 0 rgba(0,0,0,.35); font-size: 12px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: center">{{modeLabel}}</span>
    <a href="GameMenu.dc.html" aria-label="Game menu" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </a>
  </div>
  <div style="position: absolute; left: 50%; top: 108px; transform: translateX(-50%); height: 46px; padding: 0 14px 0 4px; border-radius: 23px; background: rgba(0,0,0,.35); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; gap: 8px; white-space: nowrap">
    <dc-import name="Avatar" size="38" skin="#5C3A21" hair="#111111" hair-style="waves" bg="#8FD3FF" shirt="#1F2937" hint-size="38px,38px"></dc-import>
    <span style="font-size: 13px; font-weight: 800">Tunde's waters</span><span style="font-size: 12px; opacity: .8">· 2 of 4 ships left</span>
  </div>

  <div style="position: absolute; left: 14px; right: 14px; bottom: 30px; display: flex; gap: 12px; align-items: stretch">
    <div style="flex: 1; padding: 12px; border-radius: 22px; background: rgba(0,0,0,.35); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.12); display: flex; gap: 12px; align-items: center">
      <div style="width: 92px; height: 92px; perspective: 500px; flex-shrink: 0" aria-label="Your fleet: 3 of 4 ships afloat" role="img">
        <div style="position: absolute; width: 92px; height: 92px; transform: rotateX(52deg) rotateZ(-38deg); background: #17558F; background-image: linear-gradient(rgba(170,220,255,.3) 1px, transparent 1px), linear-gradient(90deg, rgba(170,220,255,.3) 1px, transparent 1px); background-size: 11.5px 11.5px; border-radius: 4px">
          <span style="position: absolute; left: 12px; top: 12px; width: 46px; height: 9px; border-radius: 5px; background: #8C949E; box-shadow: 2px 3px 0 rgba(0,0,0,.35)"></span>
          <span style="position: absolute; left: 66px; top: 30px; width: 9px; height: 46px; border-radius: 5px; background: #8C949E; box-shadow: 2px 3px 0 rgba(0,0,0,.35)"></span>
          <span style="position: absolute; left: 14px; top: 58px; width: 34px; height: 9px; border-radius: 5px; background: #8C949E; box-shadow: 2px 3px 0 rgba(0,0,0,.35)"></span>
          <span style="position: absolute; left: 24px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: #FF5A1F; box-shadow: 0 0 8px #FFB020"></span>
          <span style="position: absolute; left: 67px; top: 52px; width: 8px; height: 8px; border-radius: 50%; background: #FF5A1F; box-shadow: 0 0 8px #FFB020"></span>
        </div>
      </div>
      <div><div style="font-size: 11px; font-weight: 800; letter-spacing: 0.5px; opacity: .8">YOUR FLEET</div><div style="font-size: 15px; font-weight: 800">3 of 4 afloat</div><div style="font-size: 12px; opacity: .8">One more hit sinks his cruiser</div></div>
    </div>
    <button style="width: 92px; border-radius: 22px; border: none; background: #C93E1C; box-shadow: 0 4px 0 #8A2410, inset 0 2px 0 rgba(255,255,255,.25); color: #fff; font: 800 17px Figtree, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>Fire</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["free","pool"],"default":"pool"},"$preview":{"width":390,"height":844}}'>
const C = (col, row) => ({ x: (col * 40 + 20) + 'px', y: (row * 40 + 20) + 'px' });
class Component extends DCLogic {
  renderVals() {
    const pool = this.props.mode !== 'free';
    return {
      modeLabel: pool ? 'POOL · ₦2,000 POT' : 'FREE · +25 XP', modeBg: pool ? '#C93E1C' : '#17834F',
      misses: [C(0,0), C(6,0), C(3,6), C(1,4), C(7,7)],
      fires: [Object.assign(C(2,1), { h: '26px', smoke: '1' }), Object.assign(C(3,1), { h: '20px', smoke: '1' }), Object.assign(C(4,1), { h: '24px', smoke: '1' }), Object.assign(C(5,3), { h: '38px', smoke: '0.5' }), Object.assign(C(5,4), { h: '44px', smoke: '0.5' })]
    };
  }
}
</script>
</body>
</html>
