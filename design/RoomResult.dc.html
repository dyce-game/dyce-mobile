<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Space results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 0 34px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{bg}}; color: #FFFFFF; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px">
    <a href="GroupChat.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; color: #fff">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <span style="height: 28px; padding: 0 12px; border-radius: 14px; background: rgba(0,0,0,.25); font-size: 12px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: center">{{badge}}</span>
    <span style="width: 44px"></span>
  </div>
  <div style="text-align: center; margin-top: 8px">
    <div style="font-size: 14px; font-weight: 700; opacity: .85">Office Doodles · 3 rounds</div>
    <div style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.6px">Tunde takes it</div>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: center; gap: 10px; padding: 18px 16px 0">
    <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
      <div style="width: 108px; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <dc-import name="Avatar" size="{{p.size}}" skin="{{p.skin}}" hair="{{p.hair}}" hair-style="{{p.hs}}" bg="{{p.bg}}" shirt="{{p.shirt}}" hint-size="64px,64px"></dc-import>
        <span style="font-size: 14px; font-weight: 700">{{p.name}}</span>
        <span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #FFFFFF; color: {{p.prizeFg}}; font-size: 13px; font-weight: 800; display: flex; align-items: center">{{p.prize}}</span>
        <div style="width: 100%; height: {{p.h}}; border-radius: 14px 14px 0 0; background: {{p.block}}; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 28px; font-weight: 800; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; box-sizing: border-box">{{p.rank}}</div>
      </div>
    </sc-for>
  </div>

  <div style="margin: 0 16px; border-radius: 0 0 20px 20px; background: rgba(0,0,0,.24); padding: 4px 14px">
    <sc-for list="{{rest}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px; height: 46px; border-bottom: 1px solid rgba(255,255,255,.12)">
        <span style="width: 18px; font-weight: 800; opacity: .7">{{r.rank}}</span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">{{r.name}}</span>
        <span style="font-size: 13px; opacity: .8">{{r.pts}} pts</span>
        <span style="width: 64px; text-align: right; font-size: 13px; font-weight: 700">{{r.prize}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin: 12px 16px 0; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.12); font-size: 13px; line-height: 1.5">{{summary}}</div>

  <div style="margin-top: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <a href="Lobby.dc.html" style="height: 54px; border-radius: 16px; background: #FFFFFF; color: #5A1A0C; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Play again · same seats</a>
    <a href="GroupChat.dc.html" style="height: 48px; border-radius: 14px; background: rgba(255,255,255,.16); color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Back to the group</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["pool","free"],"default":"pool"},"$preview":{"width":390,"height":844}}'>
const ROWS=[
 ['Tunde',{skin:'#5C3A21',hair:'#111111',hs:'waves',bg:'#8FD3FF',shirt:'#1F2937'},1180],
 ['You',{skin:'#8D5524',hair:'#1C1714',hs:'afro',bg:'#C9B8FF',shirt:'#C93E1C'},940],
 ['Ngozi',{skin:'#A0662F',hair:'#3B2219',hs:'long',bg:'#FFB4C6',shirt:'#FFB020'},910],
 ['Bayo',{skin:'#F1C27D',hair:'#1C1714',hs:'waves',bg:'#FFC857',shirt:'#1F2937'},620],
 ['Zee',{skin:'#C68642',hair:'#2A1A12',hs:'bun',bg:'#B8F2C8',shirt:'#C93E1C'},480],
 ['Femi',{skin:'#8D5524',hair:'#B7412E',hs:'short',bg:'#ECE4D8',shirt:'#0E9F6E'},300]
];
class Component extends DCLogic {
  renderVals() {
    const pool = this.props.mode !== 'free';
    const prizes = pool ? ['₦1,200','₦720','₦480'] : ['+60 XP','+30 XP','+15 XP'];
    const list = ROWS.map(([name, a, pts], i) => Object.assign({ name, pts: String(pts), rank: String(i + 1), prize: i < 3 ? prizes[i] : (pool ? '−₦400' : '+5 XP') }, a));
    const order = [1, 0, 2], H = ['70px', '96px', '56px'], S = ['60', '74', '56'], BL = ['#7C8597', '#B37A00', '#A0582E'];
    return {
      bg: pool ? 'radial-gradient(circle at 50% 18%, #F07A4A 0%, #B5381A 45%, #5A1A0C 100%)' : 'radial-gradient(circle at 50% 18%, #3DDC84 0%, #13985A 45%, #06502E 100%)',
      badge: pool ? 'DOODLE GUESS · POOL ₦2,400' : 'DOODLE GUESS · FREE SPACE',
      podium: order.map((i, k) => Object.assign({}, list[i], { h: H[k], size: S[k], block: BL[k], prizeFg: pool ? '#0E7C47' : '#13774A' })),
      rest: list.slice(3),
      summary: pool ? 'Pot of ₦2,400 split 50 / 30 / 20. You put in ₦400 and took home ₦720, net +₦320. Paid out instantly.' : 'Free space. Everyone earns at least 5 XP for finishing. You moved up to #2 among friends this week.'
    };
  }
}
</script>
</body>
</html>
