<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Delete account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 20px 34px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden">
  <div style="display: flex; align-items: center; height: 44px">
    <a href="EditProfile.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; color: {{c.brandText}}; font-size: 17px; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back</a>
  </div>
  <h1 style="margin: 12px 0 6px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.4px">Delete your account</h1>
  <p style="margin: 0; font-size: 15px; line-height: 1.45; color: {{c.sub}}">You have 30 days to change your mind. Log back in before then and everything comes back.</p>

  <div style="margin-top: 18px; border-radius: 18px; background: {{c.bg2}}; padding: 4px 14px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid {{c.line}}">
        <span style="width: 26px; height: 26px; border-radius: 8px; background: {{r.bg}}; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.i}}</span>
        <div><div style="font-size: 14px; font-weight: 700">{{r.t}}</div><div style="font-size: 12px; color: {{c.sub}}; line-height: 1.4">{{r.d}}</div></div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: {{c.warnSoft}}; font-size: 13px; line-height: 1.45">
    <b>1 open pool.</b> Your ₦500 Word Hunt stake vs Zainab is refunded before we close the account.
  </div>

  <label for="confirm" style="font-size: 13px; font-weight: 600; color: {{c.sub}}; margin: 18px 0 8px">Type your username to confirm</label>
  <input id="confirm" placeholder="kemdi.plays" style="height: 54px; padding: 0 16px; border-radius: 16px; border: 2px solid {{c.line}}; background: {{c.bg}}; color: {{c.text}}; font: 600 17px Figtree, sans-serif; box-sizing: border-box">

  <button style="margin-top: auto; height: 54px; border-radius: 16px; border: none; background: {{c.danger}}; color: #fff; font: 700 17px Figtree, sans-serif; opacity: .45" disabled>Delete account</button>
  <a href="Help.dc.html" style="height: 46px; display: flex; align-items: center; justify-content: center; color: {{c.brandText}}; font-size: 15px; font-weight: 600; text-decoration: none">Talk to us first</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F2ECE3',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',brandText:'#B33416',danger:'#C4314B',warnSoft:'#FFF1E0'},
dark:{bg:'#0F0D0B',bg2:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',brandText:'#FF8F6B',danger:'#E0455E',warnSoft:'#3A2410'}};
class Component extends DCLogic {
  renderVals() {
    return {
      c: T[this.props.theme === 'dark' ? 'dark' : 'light'],
      rows: [
        { i: '@', bg: '#B33416', t: 'Your @username is released', d: 'After 30 days someone else can claim @kemdi.plays.' },
        { i: '₦', bg: '#0E7C47', t: 'Dyce Cash is cleared', d: '₦200k balance goes to zero. It was virtual, so nothing is paid out.' },
        { i: '✕', bg: '#C2410C', t: 'Chats, games and stats are erased', d: 'Friends keep their own copies of messages you sent them.' },
        { i: '↓', bg: '#2457D6', t: 'Want a copy first?', d: 'Download your data from Settings › Account.' }
      ]
    };
  }
}
</script>
</body>
</html>
