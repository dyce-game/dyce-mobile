<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Welcome bonus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 24px 34px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: radial-gradient(circle at 50% 30%, #F07A4A 0%, #B5381A 40%, #3D1208 100%); color: #FFFFFF">
  <sc-for list="{{confetti}}" as="p" hint-placeholder-count="14">
    <span style="position: absolute; left: {{p.x}}; top: {{p.y}}; width: {{p.w}}; height: {{p.h}}; border-radius: 3px; background: {{p.c}}; transform: rotate({{p.r}})" aria-hidden="true"></span>
  </sc-for>

  <div style="position: relative; height: 330px; margin-top: 20px" aria-hidden="true">
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
      <div style="position: absolute; left: {{n.x}}; top: {{n.y}}; width: 200px; height: 100px; border-radius: 16px; background: linear-gradient(135deg, #9DF2BE, #2BB673 60%, #13774A); transform: rotate({{n.r}}); box-shadow: 0 14px 30px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; box-sizing: border-box; color: #08402A">
        <span style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 34px; font-weight: 800">₦</span>
        <span style="width: 56px; height: 56px; border-radius: 50%; border: 3px solid rgba(8,64,42,.35)"></span>
        <span style="font-size: 13px; font-weight: 800; letter-spacing: 1px">DYCE</span>
      </div>
    </sc-for>
    <div style="position: absolute; left: 50%; top: 168px; margin-left: -70px; border-radius: 50%; box-shadow: 0 0 0 8px rgba(255,255,255,.18)">
      <dc-import name="Avatar" size="140" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#FFC857" shirt="#C93E1C" hint-size="140px,140px"></dc-import>
    </div>
  </div>

  <div style="text-align: center; position: relative; margin-top: 18px">
    <div style="font-size: 15px; font-weight: 700; opacity: .9">Welcome to Dyce, Kemdi</div>
    <div style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 64px; font-weight: 800; letter-spacing: -2px; line-height: 1.05; margin-top: 4px">₦200k</div>
    <div style="font-size: 16px; opacity: .92">is in your wallet. Go win some more.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 22px; position: relative">
    <sc-for list="{{tips}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.12)">
        <span style="width: 28px; height: 28px; border-radius: 8px; background: {{t.bg}}; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{t.m}}</span>
        <span style="font-size: 14px; line-height: 1.35">{{t.text}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; position: relative; display: flex; flex-direction: column; gap: 8px">
    <a href="NotifPermission.dc.html" style="height: 56px; border-radius: 16px; background: #FFFFFF; color: #5A1A0C; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Start playing</a>
    <div style="font-size: 12px; text-align: center; opacity: .8">Virtual cash for play only. It can't be withdrawn.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const CONF=[[20,90,10,18,'#FFC857',20],[60,160,8,14,'#9DF2BE',-30],[330,80,10,18,'#FF8FA3',40],[356,180,8,14,'#FFC857',-15],[24,420,8,14,'#8FD3FF',60],[346,400,10,16,'#9DF2BE',25],[140,60,8,12,'#FF8FA3',-50],[250,110,8,12,'#8FD3FF',35],[12,300,10,16,'#FFFFFF',10],[368,300,8,12,'#FFFFFF',-25],[100,480,6,10,'#FFC857',70],[300,500,6,10,'#9DF2BE',-60],[200,40,8,12,'#FFFFFF',15],[60,560,6,10,'#FF8FA3',-20]];
class Component extends DCLogic {
  renderVals() {
    return {
      confetti: CONF.map(([x,y,w,h,c,r]) => ({ x: x + 'px', y: y + 'px', w: w + 'px', h: h + 'px', c, r: r + 'deg' })),
      notes: [[20,40,'-16deg'],[150,20,'12deg'],[40,110,'6deg'],[140,96,'-8deg']].map(([x,y,r]) => ({ x: x + 'px', y: y + 'px', r })),
      tips: [
        { m: '₦', bg: '#C93E1C', text: 'Stake it in a pool. Winner takes the pot.' },
        { m: '→', bg: '#C2410C', text: 'Send some to a friend straight from the chat.' },
        { m: '0', bg: '#0E7C47', text: 'Free games never touch it. Play as much as you like.' }
      ]
    };
  }
}
</script>
</body>
</html>
