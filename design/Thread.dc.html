<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Chat with Amaka</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; position: relative; overflow: hidden">
  <header style="display: flex; align-items: flex-start; justify-content: space-between; padding: 0 8px 8px; border-bottom: 1px solid {{c.line}}; background: {{c.bg2}}">
    <a href="Chats.dc.html" aria-label="Back to chats" style="height: 44px; min-width: 64px; display: flex; align-items: center; gap: 2px; color: {{c.brandText}}; text-decoration: none; font-size: 17px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span style="min-width: 22px; height: 22px; border-radius: 11px; background: #C93E1C; color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">2</span>
    </a>
    <a href="ChatInfo.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: {{c.text}}; text-decoration: none">
      <dc-import name="Avatar" size="46" skin="#8D5524" hair="#1C1714" hair-style="bun" bg="#FFC857" shirt="#E0453A" hint-size="46px,46px"></dc-import>
      <div style="font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 2px">Amaka <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></div>
      <div style="font-size: 11px; color: {{c.money}}; font-weight: 600">Active now</div>
    </a>
    <a href="SendMoney.dc.html" aria-label="Send Dyce Cash" style="width: 64px; height: 44px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; box-sizing: border-box; color: {{c.brandText}}; text-decoration: none; font-size: 20px; font-weight: 700">₦</a>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 12px 14px 10px; overflow: hidden">
    <div style="text-align: center; font-size: 12px; color: {{c.sub}}; margin-bottom: 4px"><b>Today</b> 4:30 PM</div>

    <div style="align-self: flex-start; max-width: 260px; padding: 9px 14px; border-radius: 20px; border-bottom-left-radius: 6px; background: {{c.recv}}; font-size: 16px; line-height: 1.35">you've been dodging me all week</div>
    <div style="align-self: flex-end; max-width: 260px; padding: 9px 14px; border-radius: 20px; border-bottom-right-radius: 6px; background: #C93E1C; color: #FFFFFF; font-size: 16px; line-height: 1.35">dodging? I was warming up</div>

    <div style="align-self: flex-end; width: 236px; border-radius: 20px; overflow: hidden; border: 1px solid {{c.line}}; background: {{c.card}}; margin-top: 4px">
      <div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 12px">
        <div style="width: 42px; height: 42px; border-radius: 12px; background: #FFB020; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 6px; box-sizing: border-box" aria-hidden="true">
          <span style="background: #fff; border-radius: 3px; font-size: 10px; font-weight: 800; color: #7A4A00; display: flex; align-items: center; justify-content: center">W</span><span style="background: #fff; border-radius: 3px; font-size: 10px; font-weight: 800; color: #7A4A00; display: flex; align-items: center; justify-content: center">O</span><span style="background: #fff; border-radius: 3px; font-size: 10px; font-weight: 800; color: #7A4A00; display: flex; align-items: center; justify-content: center">R</span><span style="background: #fff; border-radius: 3px; font-size: 10px; font-weight: 800; color: #7A4A00; display: flex; align-items: center; justify-content: center">D</span>
        </div>
        <div style="flex: 1">
          <div style="font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px">Word Hunt <span style="padding: 1px 6px; border-radius: 5px; background: #C93E1C; color: #fff; font-size: 10px; font-weight: 800">POOL</span></div>
          <div style="font-size: 13px; color: {{c.sub}}">You won 41 – 33</div>
        </div>
        <div style="font-size: 15px; font-weight: 800; color: {{c.money}}">+₦1,500</div>
      </div>
    </div>

    <div style="align-self: flex-start; width: 248px; border-radius: 22px; overflow: hidden; background: {{c.recv}}; margin-top: 4px">
      <div style="height: 150px; position: relative; background: radial-gradient(circle at 50% 45%, #22A066, #0D5235)">
        <div style="position: absolute; inset: 10px; border-radius: 14px; border: 6px solid #6B3E1F; box-sizing: border-box"></div>
        <div style="position: absolute; left: 60px; top: 52px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #F5C518 45%, #B38A00)"></div>
        <div style="position: absolute; left: 88px; top: 70px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #E0453A 45%, #9C1F17)"></div>
        <div style="position: absolute; left: 116px; top: 50px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #2457D6 45%, #12307A)"></div>
        <div style="position: absolute; left: 140px; top: 78px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #888, #111 55%)"></div>
        <div style="position: absolute; left: 186px; top: 96px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #EDEDED 50%, #A8A8A8)"></div>
        <div style="position: absolute; left: 150px; top: 120px; width: 120px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #F3E1C0, #8A5A2B); transform: rotate(-32deg); transform-origin: left center"></div>
        <span style="position: absolute; left: 12px; top: 12px; padding: 4px 9px; border-radius: 999px; background: #0E7C47; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 0.3px">FREE · +25 XP</span>
      </div>
      <div style="padding: 10px 14px 12px; display: flex; align-items: center; gap: 10px">
        <div style="flex: 1">
          <div style="font-size: 15px; font-weight: 700">8 Ball</div>
          <div style="font-size: 13px; color: {{c.sub}}">Amaka sank 2 · Your move</div>
        </div>
        <a href="FreeResult.dc.html" style="height: 36px; padding: 0 16px; border-radius: 999px; background: #C93E1C; color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; text-decoration: none">Play</a>
      </div>
    </div>
    <div style="align-self: flex-start; max-width: 260px; padding: 9px 14px; border-radius: 20px; border-bottom-left-radius: 6px; background: {{c.recv}}; font-size: 16px; line-height: 1.35">your move oga</div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px 34px">
    <button aria-label="Add photo" style="width: 36px; height: 36px; border-radius: 50%; border: none; background: {{c.field}}; color: {{c.sub}}; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a href="Games.dc.html" aria-label="Open games" style="width: 36px; height: 36px; border-radius: 11px; background: #C93E1C; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 7px; box-sizing: border-box; gap: 1px; flex-shrink: 0">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #fff"></span><span></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #fff; justify-self: end"></span>
      <span></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #fff; justify-self: center"></span><span></span>
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #fff"></span><span></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #fff; justify-self: end"></span>
    </a>
    <div style="flex: 1; height: 38px; border-radius: 19px; border: 1px solid {{c.line}}; display: flex; align-items: center; padding: 0 6px 0 14px">
      <label for="msg" style="position: absolute; left: -9999px">Message</label>
      <input id="msg" placeholder="Dyce message" style="flex: 1; min-width: 0; border: none; background: none; font: 400 16px Figtree, sans-serif; color: {{c.text}}; outline: none">
      <button aria-label="Voice note" style="width: 30px; height: 30px; border: none; background: none; color: {{c.sub}}; padding: 0; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F6F1EA',card:'#FFFFFF',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',recv:'#ECE4D8',field:'#EEE7DC',brand:'#C93E1C',brandText:'#B33416',brandSoft:'#FBE7DF',sms:'#0067D6',money:'#0E7C47',moneySoft:'#E3F6EA',danger:'#C4314B',ink:'#1B140F',inkText:'#FFFFFF'},
dark:{bg:'#0F0D0B',bg2:'#15120F',card:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',recv:'#2A2420',field:'#1D1916',brand:'#C93E1C',brandText:'#FF8F6B',brandSoft:'#3A170C',sms:'#0067D6',money:'#3DDC84',moneySoft:'#11301F',danger:'#FF6B81',ink:'#F7F1E8',inkText:'#1B140F'}};
class Component extends DCLogic {
  renderVals() { return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] }; }
}
</script>
</body>
</html>
