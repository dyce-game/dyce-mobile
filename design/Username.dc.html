<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Username</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 24px 34px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="Phone.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; color: {{c.text}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="display: flex; gap: 6px" aria-label="Step 2 of 3">
      <span style="width: 6px; height: 6px; border-radius: 3px; background: #C93E1C"></span>
      <span style="width: 22px; height: 6px; border-radius: 3px; background: #C93E1C"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: {{c.line}}"></span>
    </div>
    <span style="width: 44px"></span>
  </div>

  <h1 style="margin: 24px 0 8px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.5px">Claim your @name</h1>
  <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.45; color: {{c.sub}}">This is how people find and challenge you in Space.</p>

  <label for="nm" style="font-size: 13px; font-weight: 600; color: {{c.sub}}; margin-bottom: 8px">Display name</label>
  <input id="nm" value="Kemdi" style="height: 56px; padding: 0 16px; border-radius: 16px; border: none; background: {{c.field}}; color: {{c.text}}; font: 500 17px Figtree, sans-serif; box-sizing: border-box">

  <label for="un" style="font-size: 13px; font-weight: 600; color: {{c.sub}}; margin: 20px 0 8px">Username</label>
  <div style="position: relative">
    <input id="un" value="@kemdi.plays" style="width: 100%; height: 56px; padding: 0 48px 0 16px; border-radius: 16px; border: 2px solid #C93E1C; background: {{c.bg}}; color: {{c.text}}; font: 600 17px Figtree, sans-serif; box-sizing: border-box">
    <div style="position: absolute; right: 14px; top: 16px; width: 24px; height: 24px; border-radius: 50%; background: {{c.money}}; display: flex; align-items: center; justify-content: center" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
  </div>
  <div style="margin-top: 8px; font-size: 14px; font-weight: 600; color: {{c.money}}">@kemdi.plays is yours</div>

  <div style="margin-top: 20px; font-size: 13px; font-weight: 600; color: {{c.sub}}">Or grab one of these</div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">
    <sc-for list="{{ideas}}" as="i" hint-placeholder-count="4">
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.line}}; background: {{c.bg}}; color: {{c.text}}; font: 500 15px Figtree, sans-serif">{{i}}</button>
    </sc-for>
  </div>

  <a href="Contacts.dc.html" style="margin-top: auto; height: 54px; border-radius: 16px; background: #C93E1C; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F2ECE3',card:'#FFFFFF',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',recv:'#ECE4D8',field:'#EEE7DC',brand:'#C93E1C',brandText:'#B33416',brandSoft:'#FBE7DF',sms:'#0067D6',money:'#0E7C47',moneySoft:'#E3F6EA',danger:'#C4314B',ink:'#1B140F',inkText:'#FFFFFF'},
dark:{bg:'#0F0D0B',bg2:'#15120F',card:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',recv:'#2A2420',field:'#1D1916',brand:'#C93E1C',brandText:'#FF8F6B',brandSoft:'#3A170C',sms:'#0067D6',money:'#3DDC84',moneySoft:'#11301F',danger:'#FF6B81',ink:'#F7F1E8',inkText:'#1B140F'}};
class Component extends DCLogic {
  renderVals() { return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'], ideas: ['@kemdi', '@kemdi_9ja', '@kd.rolls', '@kemdinachi'] }; }
}
</script>
</body>
</html>
