<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 362px; height: 68px; display: flex; gap: 10px; align-items: center; font-family: Figtree, -apple-system, system-ui, sans-serif">
  <nav aria-label="Main" style="flex: 1; height: 68px; box-sizing: border-box; padding: 5px; border-radius: 34px; background: {{c.glass}}; backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border: 1px solid {{c.edge}}; box-shadow: 0 12px 32px {{c.shadow}}, inset 0 1px 0 {{c.hi}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <a href="{{t.href}}" aria-label="{{t.label}}" aria-current="{{t.cur}}" style="position: relative; border-radius: 29px; background: {{t.bg}}; box-shadow: {{t.sh}}; color: {{t.fg}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
        <sc-if value="{{t.isChat}}" hint-placeholder-val="{{true}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2c-5 0-9 3.4-9 7.7 0 2.3 1.1 4.3 2.9 5.7-.2 1.4-.9 2.7-2 3.7 2 .1 3.9-.6 5.3-1.6.9.2 1.8.3 2.8.3 5 0 9-3.4 9-7.8S17 3.2 12 3.2z"/><circle cx="8" cy="11" r="1.3" fill="{{t.dot}}"/><circle cx="12" cy="11" r="1.3" fill="{{t.dot}}"/><circle cx="16" cy="11" r="1.3" fill="{{t.dot}}"/></svg></sc-if>
        <sc-if value="{{t.isSpaces}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5.6" fill="currentColor"/><ellipse cx="12" cy="12" rx="10.4" ry="3.6" transform="rotate(-24 12 12)" fill="none" stroke="currentColor" stroke-width="2"/></svg></sc-if>
        <sc-if value="{{t.isWallet}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="14" rx="4" fill="currentColor"/><path d="M5 5.5l9.5-2.6c1.2-.3 2.3.5 2.4 1.7v.9" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14.5" y="10.3" width="7" height="4.4" rx="2.2" fill="{{t.dot}}"/></svg></sc-if>
        <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.1px">{{t.label}}</span>
        <sc-if value="{{t.badge}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 4px; left: 50%; margin-left: 8px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #C93E1C; border: 2px solid {{c.ring}}; color: #fff; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center">{{t.badge}}</span></sc-if>
      </a>
    </sc-for>
  </nav>
  <a href="{{search}}" aria-label="Search" style="width: 68px; height: 68px; flex-shrink: 0; border-radius: 50%; background: {{c.glass}}; backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border: 1px solid {{c.edge}}; box-shadow: 0 12px 32px {{c.shadow}}, inset 0 1px 0 {{c.hi}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["chat","spaces","wallet"],"default":"chat"},"search":{"editor":"text","default":"SearchRecent.dc.html"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":362,"height":68}}'>
const T={
 light:{glass:'rgba(255,255,255,.72)',edge:'rgba(255,255,255,.95)',shadow:'rgba(90,40,10,.16)',hi:'rgba(255,255,255,.9)',text:'#1B140F',idle:'#1B140F',pill:'rgba(27,20,15,.07)',pillSh:'inset 0 0 0 1px rgba(27,20,15,.04)',on:'#C93E1C',ring:'#FFFFFF',dotIdle:'#FBF8F3',dotOn:'#FBE7DF'},
 dark:{glass:'rgba(34,29,26,.72)',edge:'rgba(255,255,255,.10)',shadow:'rgba(0,0,0,.55)',hi:'rgba(255,255,255,.06)',text:'#F7F1E8',idle:'#F7F1E8',pill:'rgba(255,255,255,.12)',pillSh:'inset 0 1px 0 rgba(255,255,255,.08)',on:'#FF8F6B',ring:'#1D1916',dotIdle:'#1D1916',dotOn:'#3A2018'}
};
class Component extends DCLogic {
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const a = this.props.active || 'chat';
    const tabs = [['chat','Chat','Chats.dc.html','3'],['spaces','Spaces','Space.dc.html',false],['wallet','Wallet','Wallet.dc.html',false]].map(([id,label,href,badge]) => {
      const on = a === id;
      return { label, href, badge, cur: on ? 'page' : 'false', isChat: id === 'chat', isSpaces: id === 'spaces', isWallet: id === 'wallet', bg: on ? c.pill : 'transparent', sh: on ? c.pillSh : 'none', fg: on ? c.on : c.idle, dot: on ? c.dotOn : c.dotIdle };
    });
    return { c, tabs, search: this.props.search || 'SearchRecent.dc.html' };
  }
}
</script>
</body>
</html>
