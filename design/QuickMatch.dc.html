<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Quick match</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 20px 34px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: radial-gradient(circle at 50% 38%, #3A1A10 0%, #1A0C07 55%, #0A0503 100%); color: #FFFFFF; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="Space.dc.html" style="height: 44px; display: flex; align-items: center; color: #FFD2BF; font-size: 17px; text-decoration: none">Cancel</a>
    <span style="font-size: 15px; font-weight: 700">Quick match</span>
    <span style="width: 54px"></span>
  </div>

  <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px">
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 700; display: flex; align-items: center">Sea Battle</span>
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: {{modeBg}}; font-size: 13px; font-weight: 800; display: flex; align-items: center">{{modeLabel}}</span>
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 700; display: flex; align-items: center">Similar skill</span>
  </div>

  <div style="position: relative; height: 340px; margin-top: 20px" aria-hidden="true">
    <span style="position: absolute; left: 50%; top: 50%; width: 320px; height: 320px; margin: -160px 0 0 -160px; border-radius: 50%; border: 1px solid rgba(201,190,255,.18)"></span>
    <span style="position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; border: 1px solid rgba(201,190,255,.28)"></span>
    <span style="position: absolute; left: 50%; top: 50%; width: 320px; height: 320px; margin: -160px 0 0 -160px; border-radius: 50%; background: conic-gradient(from 20deg, rgba(201,62,28,.45), transparent 22%)"></span>
    <div style="position: absolute; left: 50%; top: 50%; margin: -56px 0 0 -56px; border-radius: 50%; box-shadow: 0 0 0 8px rgba(201,62,28,.35)">
      <dc-import name="Avatar" size="112" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#C9B8FF" shirt="#C93E1C" hint-size="112px,112px"></dc-import>
    </div>
    <sc-for list="{{ghosts}}" as="g" hint-placeholder-count="4">
      <div style="position: absolute; left: {{g.x}}; top: {{g.y}}; opacity: {{g.op}}">
        <dc-import name="Avatar" size="{{g.s}}" skin="{{g.skin}}" hair="{{g.hair}}" hair-style="{{g.hs}}" bg="{{g.bg}}" shirt="{{g.shirt}}" hint-size="44px,44px"></dc-import>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{searching}}" hint-placeholder-val="{{true}}">
    <div style="text-align: center">
      <div style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 28px; font-weight: 800">Finding a captain…</div>
      <div style="font-size: 14px; color: #FFD2BF; margin-top: 6px">382 people looking · usually under 10s</div>
    </div>
    <div style="margin-top: auto; border-radius: 18px; background: rgba(255,255,255,.08); padding: 14px; font-size: 13px; line-height: 1.5; color: #FFE3D6">Matches go to people near your level first, then widen after 15 seconds. Strangers can't see your number or contacts.</div>
  </sc-if>

  <sc-if value="{{found}}" hint-placeholder-val="{{false}}">
    <div style="margin-top: auto; border-radius: 24px; background: {{k.card}}; color: {{k.text}}; padding: 16px">
      <div style="display: flex; align-items: center; gap: 12px">
        <dc-import name="Avatar" size="56" skin="#5C3A21" hair="#111111" hair-style="short" bg="#8FD3FF" shirt="#0E9F6E" hint-size="56px,56px"></dc-import>
        <div style="flex: 1">
          <div style="font-size: 12px; font-weight: 800; color: {{k.money}}; letter-spacing: 0.4px">MATCH FOUND</div>
          <div style="font-size: 18px; font-weight: 800">@lagos_shark</div>
          <div style="font-size: 13px; color: {{k.sub2}}">Level 14 · 62% wins · Lagos</div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px">
        <button style="height: 50px; border-radius: 14px; border: none; background: {{k.field}}; color: {{k.text}}; font: 700 15px Figtree, sans-serif">Skip</button>
        <button style="height: 50px; border-radius: 14px; border: none; background: #C93E1C; color: #fff; font: 800 15px Figtree, sans-serif">Accept · 0:09</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"state":{"editor":"enum","options":["searching","found"],"default":"searching"},"mode":{"editor":"enum","options":["free","pool"],"default":"pool"},"$preview":{"width":390,"height":844}}'>
const KT={light:{name:'light',card:'#FFFFFF',text:'#1B140F',sub:'#62584E',sub2:'#6F655B',bg2:'#F2ECE3',field:'#EEE7DC',notif:'rgba(245,245,250,.88)',body:'#2A2A30',sec:'#E3E3EA',money:'#0E7C47'},dark:{name:'dark',card:'#1D1916',text:'#F7F1E8',sub:'#ABA196',sub2:'#ABA196',bg2:'#2A2420',field:'#2A2420',notif:'rgba(30,26,34,.82)',body:'#D9D2C8',sec:'#3A343C',money:'#3DDC84'}};
class Component extends DCLogic {
  renderVals() { const k = KT[this.props.theme === 'dark' ? 'dark' : 'light']; this.k = k; return Object.assign({ k }, this.rv()); }
  rv() {
    const found = this.props.state === 'found';
    const pool = this.props.mode !== 'free';
    const G = (x, y, s, op, a) => Object.assign({ x: x + 'px', y: y + 'px', s: String(s), op: String(op) }, a);
    return {
      searching: !found, found,
      modeLabel: pool ? 'POOL ₦500 EACH' : 'FREE',
      modeBg: pool ? '#C93E1C' : '#0E7C47',
      ghosts: [
        G(20, 30, 44, 0.55, { skin: '#A0662F', hair: '#3B2219', hs: 'long', bg: '#FFB4C6', shirt: '#FFB020' }),
        G(270, 50, 40, 0.4, { skin: '#F1C27D', hair: '#1C1714', hs: 'waves', bg: '#FFC857', shirt: '#1F2937' }),
        G(290, 240, 48, found ? 1 : 0.6, { skin: '#5C3A21', hair: '#111111', hs: 'short', bg: '#8FD3FF', shirt: '#0E9F6E' }),
        G(30, 260, 38, 0.35, { skin: '#C68642', hair: '#2A1A12', hs: 'bun', bg: '#B8F2C8', shirt: '#C93E1C' })
      ]
    };
  }
}
</script>
</body>
</html>
