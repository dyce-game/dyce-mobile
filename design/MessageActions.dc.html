<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Message actions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden; position: relative">
  <header style="display: flex; align-items: center; gap: 10px; padding: 0 12px 8px; border-bottom: 1px solid {{c.line}}; background: {{c.bg2}}">
    <a href="Chats.dc.html" aria-label="Back" style="width: 36px; height: 44px; display: flex; align-items: center; color: {{c.brandText}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <a href="ChatInfo.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: {{c.text}}">
      <dc-import name="Avatar" size="38" skin="#8D5524" hair="#1C1714" hair-style="bun" bg="#FFC857" shirt="#E0453A" hint-size="38px,38px"></dc-import>
      <span><span style="display: block; font-size: 15px; font-weight: 700">Amaka</span><span style="display: block; font-size: 12px; color: {{c.money}}; font-weight: 600">{{status}}</span></span>
    </a>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 12px 14px 10px; overflow: hidden">
    <div style="align-self: flex-start; max-width: 260px; padding: 9px 14px; border-radius: 20px; border-bottom-left-radius: 6px; background: {{c.recv}}; font-size: 16px">you've been dodging me all week</div>
    <div style="align-self: flex-end; position: relative; margin-top: 8px">
      <div style="max-width: 260px; padding: 9px 14px; border-radius: 20px; border-bottom-right-radius: 6px; background: #C93E1C; color: #fff; font-size: 16px">dodging? I was warming up</div>
      <sc-if value="{{reacted}}" hint-placeholder-val="{{true}}">
        <span style="position: absolute; left: -12px; top: -14px; height: 26px; min-width: 26px; padding: 0 6px; box-sizing: border-box; border-radius: 13px; background: {{c.recv}}; border: 2px solid {{c.bg}}; display: flex; align-items: center; justify-content: center; color: {{c.text}}; font-size: 11px; font-weight: 800">{{reaction}}</span>
      </sc-if>
    </div>

    <div style="align-self: flex-start; width: 236px; padding: 10px 12px; border-radius: 20px; border-bottom-left-radius: 6px; background: {{c.recv}}; display: flex; align-items: center; gap: 10px; margin-top: 6px">
      <button aria-label="Play voice note" style="width: 34px; height: 34px; border-radius: 50%; border: none; background: {{c.text}}; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="{{c.bg}}" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      </button>
      <div style="flex: 1; height: 28px; display: flex; align-items: center; gap: 2px" aria-hidden="true">
        <sc-for list="{{wave}}" as="w" hint-placeholder-count="30">
          <span style="flex: 1; height: {{w.h}}; border-radius: 2px; background: {{w.c}}"></span>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: {{c.sub}}; font-weight: 600">0:09</span>
    </div>

    <div style="align-self: flex-start; display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 14px; border-radius: 18px; background: {{c.recv}}; margin-top: 2px" aria-label="Amaka is typing">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.sub}}; opacity: .5"></span>
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.sub}}; opacity: .75"></span>
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.sub}}"></span>
    </div>
  </div>

  <div style="border-top: 1px solid {{c.line}}; padding: 8px 10px 34px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 8px; border-radius: 12px; background: {{c.bg2}}; border-left: 3px solid #C93E1C">
      <div style="flex: 1; min-width: 0"><div style="font-size: 12px; font-weight: 700; color: {{c.brandText}}">Replying to Amaka</div><div style="font-size: 13px; color: {{c.sub}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">you've been dodging me all week</div></div>
      <button aria-label="Cancel reply" style="width: 28px; height: 28px; border-radius: 50%; border: none; background: {{c.line}}; color: {{c.text}}; font: 700 14px Figtree, sans-serif; padding: 0">×</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="flex: 1; height: 42px; border-radius: 21px; background: {{c.dangerSoft}}; display: flex; align-items: center; gap: 10px; padding: 0 14px">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #E0453A"></span>
        <span style="font-size: 15px; font-weight: 700; color: {{c.danger}}">0:04</span>
        <span style="flex: 1; font-size: 13px; color: {{c.sub}}">Slide left to cancel</span>
      </div>
      <button aria-label="Send voice note" style="width: 42px; height: 42px; border-radius: 50%; border: none; background: #C93E1C; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>

  <sc-if value="{{isPress}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: {{c.scrim}}"></div>
    <div style="position: absolute; right: 14px; top: 300px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px">
      <div style="display: flex; gap: 4px; padding: 6px; border-radius: 26px; background: {{c.menu}}; box-shadow: 0 10px 30px rgba(0,0,0,.25)">
        <sc-for list="{{reacts}}" as="r" hint-placeholder-count="6">
          <button onClick="{{r.pick}}" aria-label="{{r.aria}}" style="width: 42px; height: 42px; border-radius: 50%; border: none; background: {{r.bgc}}; color: {{r.fg}}; font: 800 14px Figtree, sans-serif; padding: 0; display: flex; align-items: center; justify-content: center">{{r.l}}</button>
        </sc-for>
      </div>
      <div style="max-width: 260px; padding: 9px 14px; border-radius: 20px; border-bottom-right-radius: 6px; background: #C93E1C; color: #fff; font-size: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.3)">dodging? I was warming up</div>
      <div style="width: 230px; border-radius: 16px; background: {{c.menu}}; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.25)">
        <sc-for list="{{menu}}" as="m" hint-placeholder-count="5">
          <button style="width: 100%; height: 46px; border: none; border-bottom: 1px solid {{c.line}}; background: none; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font: 500 15px Figtree, sans-serif; color: {{m.fg}}">{{m.t}}<span style="font-size: 13px; color: {{c.sub}}">{{m.hint}}</span></button>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["composer","longpress"],"default":"composer"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F6F1EA',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',recv:'#ECE4D8',brandText:'#B33416',money:'#0E7C47',danger:'#C4314B',dangerSoft:'#FDE8EC',menu:'#FFFFFF',scrim:'rgba(255,255,255,.55)'},
dark:{bg:'#0F0D0B',bg2:'#15120F',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',recv:'#2A2420',brandText:'#FF8F6B',money:'#3DDC84',danger:'#FF6B81',dangerSoft:'#3A1119',menu:'#2E2823',scrim:'rgba(0,0,0,.6)'}};
const R=[['GG','Good game'],['HA','Ha ha'],['!!','Wow'],['?','Question'],['L','Took the L'],['+','More reactions']];
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { r: 'GG' }; }
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const press = this.props.variant === 'longpress';
    const H = [6,12,18,10,22,26,14,8,20,24,16,10,6,14,22,18,12,8,16,20,26,14,10,6,12,18,10,8,6,4];
    return {
      c, isPress: press,
      status: press ? 'Active now' : 'typing…',
      reacted: !!this.state.r, reaction: this.state.r || '',
      wave: H.map((h, i) => ({ h: h + 'px', c: i < 11 ? c.text : c.sub })),
      reacts: R.map(([l, aria]) => ({ l, aria, bgc: this.state.r === l ? '#C93E1C' : 'transparent', fg: this.state.r === l ? '#FFFFFF' : c.text, pick: () => this.setState({ r: l === '+' ? this.state.r : l }) })),
      menu: [
        { t: 'Reply', hint: 'swipe right', fg: c.text },
        { t: 'Copy', hint: '', fg: c.text },
        { t: 'Forward', hint: '', fg: c.text },
        { t: 'Turn into a challenge', hint: 'new', fg: c.brandText },
        { t: 'Delete for me', hint: '', fg: c.danger }
      ]
    };
  }
}
</script>
</body>
</html>
