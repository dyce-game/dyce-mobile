<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Turn on notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 24px 34px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden">
  <div style="position: relative; height: 340px; margin-top: 30px; border-radius: 32px; background: {{c.brandSoft}}; overflow: hidden" aria-hidden="true">
    <sc-for list="{{cards}}" as="n" hint-placeholder-count="3">
      <div style="position: absolute; left: {{n.x}}; right: {{n.x}}; top: {{n.y}}; transform: scale({{n.s}}); opacity: {{n.op}}; border-radius: 20px; background: {{c.card}}; box-shadow: 0 10px 30px rgba(90,30,10,.14); padding: 12px; display: flex; gap: 10px; align-items: center">
        <span style="width: 38px; height: 38px; border-radius: 10px; background: #C93E1C; flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 7px; box-sizing: border-box; gap: 1px">
          <span style="width: 5px; height: 5px; border-radius: 50%; background: #fff"></span><span></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #fff; justify-self: end"></span>
          <span></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #fff; justify-self: center"></span><span></span>
          <span style="width: 5px; height: 5px; border-radius: 50%; background: #fff"></span><span></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #fff; justify-self: end"></span>
        </span>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; justify-content: space-between"><b style="font-size: 14px">{{n.t}}</b><span style="font-size: 11px; color: {{c.sub}}">{{n.time}}</span></div>
          <div style="font-size: 13px; color: {{c.sub}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.d}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <h1 style="margin: 28px 0 8px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.5px">Know the second it's your turn</h1>
  <p style="margin: 0; font-size: 16px; line-height: 1.45; color: {{c.sub}}">Turns, pool matches and refunds. Games time out after 24 hours, so a nudge keeps you from forfeiting.</p>
  <div style="margin-top: 14px; font-size: 13px; color: {{c.sub}}; line-height: 1.45">You choose which ones later in Settings. We never send promos at night.</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="EmptyChats.dc.html" style="height: 54px; border-radius: 16px; background: #C93E1C; color: #fff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Turn on notifications</a>
    <a href="EmptyChats.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; color: {{c.sub}}; font-size: 16px; font-weight: 600; text-decoration: none">Not now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',card:'#FFFFFF',text:'#1B140F',sub:'#6F655B',brandSoft:'#FBE7DF'},dark:{bg:'#0F0D0B',card:'#1D1916',text:'#F7F1E8',sub:'#ABA196',brandSoft:'#3A170C'}};
class Component extends DCLogic {
  renderVals() {
    return {
      c: T[this.props.theme === 'dark' ? 'dark' : 'light'],
      cards: [
        { x: '30px', y: '64px', s: '0.9', op: '0.55', t: 'Refund', d: '₦500 is back in your wallet', time: '1h' },
        { x: '22px', y: '134px', s: '0.95', op: '0.8', t: 'Tunde matched ₦1,000', d: 'Sea Battle pot is ₦2,000. Game on.', time: '5m' },
        { x: '16px', y: '208px', s: '1', op: '1', t: 'Your move, Kemdi', d: 'Amaka sank two in 8 Ball', time: 'now' }
      ]
    };
  }
}
</script>
</body>
</html>
