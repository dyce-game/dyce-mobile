<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Chat info</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg2}}; color: {{c.text}}; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px">
    <a href="Thread.dc.html" style="height: 44px; display: flex; align-items: center; color: {{c.brandText}}; font-size: 17px; font-weight: 600; text-decoration: none">Done</a>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
    <dc-import name="Avatar" size="92" skin="#8D5524" hair="#1C1714" hair-style="bun" bg="#FFC857" shirt="#E0453A" hint-size="92px,92px"></dc-import>
    <div style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 24px; font-weight: 800; margin-top: 4px">Amaka Obi</div>
    <div style="font-size: 13px; color: {{c.sub}}">@amaka.o · friends since Nov 13 · Android</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 14px 16px 0">
    <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
      <a href="{{q.href}}" style="height: 62px; border-radius: 16px; background: {{c.card}}; color: {{c.brandText}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 12px; font-weight: 700">
        <span style="font-size: 17px; font-weight: 800">{{q.m}}</span>{{q.l}}</a>
    </sc-for>
  </div>

  <div style="margin: 12px 16px 0; border-radius: 18px; background: {{c.card}}; padding: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><b style="font-size: 15px">Head to head</b><span style="font-size: 13px; color: {{c.sub}}">26 games</span></div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px">
      <span style="font-size: 26px; font-weight: 800; width: 34px">14</span>
      <div style="flex: 1; height: 10px; border-radius: 5px; overflow: hidden; display: flex"><span style="width: 54%; background: #C93E1C"></span><span style="flex: 1; background: #FF7A1A"></span></div>
      <span style="font-size: 26px; font-weight: 800; width: 34px; text-align: right">12</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: {{c.sub}}; margin-top: 4px"><span>You</span><span>Pool net: you +₦2,500</span><span>Amaka</span></div>
  </div>

  <div style="font-size: 13px; font-weight: 600; color: {{c.sub}}; padding: 14px 20px 6px">Games together</div>
  <div style="margin: 0 16px; border-radius: 18px; background: {{c.card}}; overflow: hidden">
    <sc-for list="{{games}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 14px; border-bottom: 1px solid {{c.line}}">
        <span style="width: 32px; height: 32px; border-radius: 9px; background: {{g.bg}}"></span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">{{g.n}}</span>
        <span style="font-size: 13px; font-weight: 700; color: {{c.sub}}">{{g.rec}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin: 12px 16px 0; border-radius: 18px; background: {{c.card}}; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; height: 50px; padding: 0 14px; border-bottom: 1px solid {{c.line}}">
        <span style="flex: 1; font-size: 15px; color: {{r.fg}}; font-weight: {{r.w}}">{{r.t}}</span>
        <span style="font-size: 14px; color: {{c.sub}}">{{r.v}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg2:'#F2ECE3',card:'#FFFFFF',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',brandText:'#B33416',danger:'#C4314B'},dark:{bg2:'#0F0D0B',card:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',brandText:'#FF8F6B',danger:'#FF6B81'}};
class Component extends DCLogic {
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    return {
      c,
      quick: [{ m: '▶', l: 'Game', href: 'Games.dc.html' }, { m: '₦', l: 'Send', href: 'SendMoney.dc.html' }, { m: '↓', l: 'Request', href: 'RequestMoney.dc.html' }, { m: '★', l: 'Profile', href: 'UserProfile.dc.html' }],
      games: [{ n: '8 Ball', bg: '#13774A', rec: '7 – 5' }, { n: 'Word Hunt', bg: '#FFB020', rec: '4 – 4' }, { n: 'Crazy Cards', bg: '#C2410C', rec: '3 – 3' }],
      rows: [
        { t: 'Mute chat', v: 'Off', fg: c.text, w: '500' },
        { t: 'Mute game invites', v: 'Off', fg: c.text, w: '500' },
        { t: 'Search messages', v: '', fg: c.text, w: '500' },
        { t: 'Clear chat', v: '', fg: c.danger, w: '600' }
      ]
    };
  }
}
</script>
</body>
</html>
