<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce avatar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; font-size: {{em}}; position: relative; overflow: hidden; border-radius: 50%; background: {{bgGrad}}; flex-shrink: 0; font-family: Figtree, sans-serif; color: #000" role="img" aria-label="Avatar">
  <sc-if value="{{useImg}}" hint-placeholder-val="{{false}}">
    <img src="{{img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; border-radius: 50%">
  </sc-if>
  <sc-if value="{{useCss}}" hint-placeholder-val="{{true}}">
  <sc-if value="{{isLong}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 1.75em; top: 2.3em; width: 6.5em; height: 7.2em; border-radius: 3.25em 3.25em 1.6em 1.6em; background: {{hairGrad}}"></div>
  </sc-if>
  <div style="position: absolute; left: 0.9em; top: 8.25em; width: 8.2em; height: 3.6em; border-radius: 4em 4em 0 0; background: {{shirtGrad}}"></div>
  <div style="position: absolute; left: 4.05em; top: 7.2em; width: 1.9em; height: 1.6em; border-radius: 0 0 0.95em 0.95em; background: {{skinDark}}"></div>
  <div style="position: absolute; left: 2.05em; top: 4.85em; width: 1em; height: 1.4em; border-radius: 50%; background: {{skinGrad}}"></div>
  <div style="position: absolute; left: 6.95em; top: 4.85em; width: 1em; height: 1.4em; border-radius: 50%; background: {{skinGrad}}"></div>
  <sc-if value="{{isAfro}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 1.3em; top: 0.75em; width: 7.4em; height: 5.5em; border-radius: 50%; background: {{hairGrad}}"></div>
  </sc-if>
  <div style="position: absolute; left: 2.45em; top: 2.6em; width: 5.1em; height: 5.6em; border-radius: 2.55em 2.55em 2.35em 2.35em; background: {{skinGrad}}; box-shadow: inset -0.25em -0.35em 0.6em rgba(0,0,0,.16)"></div>
  <sc-if value="{{isAfro}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 2.3em; top: 2.15em; width: 5.4em; height: 1.85em; border-radius: 2.7em 2.7em 0.9em 0.9em; background: {{hairGrad}}"></div>
  </sc-if>
  <sc-if value="{{isShort}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 2.25em; top: 2.05em; width: 5.5em; height: 2.15em; border-radius: 2.75em 2.75em 1.1em 0.7em; background: {{hairGrad}}"></div>
  </sc-if>
  <sc-if value="{{isWaves}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 2.4em; top: 2.4em; width: 5.2em; height: 1.55em; border-radius: 2.6em 2.6em 0.8em 0.8em; background: {{wavesGrad}}"></div>
  </sc-if>
  <sc-if value="{{isBun}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 3.95em; top: 0.75em; width: 2.1em; height: 1.9em; border-radius: 50%; background: {{hairGrad}}"></div>
    <div style="position: absolute; left: 2.3em; top: 2.2em; width: 5.4em; height: 1.9em; border-radius: 2.7em 2.7em 0.9em 0.9em; background: {{hairGrad}}"></div>
  </sc-if>
  <sc-if value="{{isLong}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 2.2em; top: 2.1em; width: 5.6em; height: 2.3em; border-radius: 2.8em 2.8em 0.5em 2.4em; background: {{hairGrad}}"></div>
  </sc-if>
  <div style="position: absolute; left: 3.55em; top: 4.5em; width: 1.05em; height: 0.22em; border-radius: 0.2em; background: {{browColor}}; transform: rotate(-6deg)"></div>
  <div style="position: absolute; left: 5.4em; top: 4.5em; width: 1.05em; height: 0.22em; border-radius: 0.2em; background: {{browColor}}; transform: rotate(6deg)"></div>
  <div style="position: absolute; left: 3.82em; top: 5em; width: 0.64em; height: 0.8em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF 0 16%, #17131A 22%)"></div>
  <div style="position: absolute; left: 5.54em; top: 5em; width: 0.64em; height: 0.8em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFFFFF 0 16%, #17131A 22%)"></div>
  <div style="position: absolute; left: 4.7em; top: 5.85em; width: 0.6em; height: 0.55em; border-radius: 50%; background: {{noseGrad}}"></div>
  <div style="position: absolute; left: 3.25em; top: 6.1em; width: 0.85em; height: 0.5em; border-radius: 50%; background: rgba(255,96,110,.22)"></div>
  <div style="position: absolute; left: 5.9em; top: 6.1em; width: 0.85em; height: 0.5em; border-radius: 50%; background: rgba(255,96,110,.22)"></div>
  <div style="position: absolute; left: 4.35em; top: 6.55em; width: 1.3em; height: 0.66em; border-radius: 0.1em 0.1em 0.7em 0.7em; background: linear-gradient(#FFFFFF 0 32%, #5A1A24 32%)"></div>
  <sc-if value="{{glasses}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 3.45em; top: 4.78em; width: 1.35em; height: 1.15em; border-radius: 40%; border: 0.14em solid #17131A; box-sizing: border-box; background: rgba(255,255,255,.12)"></div>
    <div style="position: absolute; left: 5.2em; top: 4.78em; width: 1.35em; height: 1.15em; border-radius: 40%; border: 0.14em solid #17131A; box-sizing: border-box; background: rgba(255,255,255,.12)"></div>
    <div style="position: absolute; left: 4.78em; top: 5.2em; width: 0.44em; height: 0.14em; background: #17131A"></div>
  </sc-if>
  </sc-if>
</div>
</x-dc>

function hx(h){h=String(h||'#000000').replace('#','');if(h.length===3)h=h.split('').map(function(x){return x+x;}).join('');var n=parseInt(h,16)||0;return [(n>>16)&255,(n>>8)&255,n&255];}
