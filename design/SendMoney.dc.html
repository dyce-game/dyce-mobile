<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Send Dyce Cash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}">
  <div style="position: absolute; left: 0; right: 0; top: 0; padding-top: 54px" aria-hidden="true">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid {{c.line}}; background: {{c.bg2}}">
      <dc-import name="Avatar" size="46" skin="#8D5524" hair="#1C1714" hair-style="bun" bg="#FFC857" shirt="#E0453A" hint-size="46px,46px"></dc-import>
      <div style="font-size: 12px; font-weight: 600">Amaka</div>
    </div>
  </div>
  <a href="Thread.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(0,0,0,.32)"></a>

  <section aria-label="Send Dyce Cash" style="position: absolute; left: 0; right: 0; bottom: 0; height: 690px; border-radius: 26px 26px 0 0; background: {{c.bg}}; display: flex; flex-direction: column; padding: 8px 16px 34px; box-sizing: border-box">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: {{c.line}}; align-self: center"></div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 14px">
      <dc-import name="Avatar" size="40" skin="#8D5524" hair="#1C1714" hair-style="bun" bg="#FFC857" shirt="#E0453A" hint-size="40px,40px"></dc-import>
      <div style="flex: 1">
        <div style="font-size: 13px; color: {{c.sub}}">Send to</div>
        <div style="font-size: 16px; font-weight: 700">Amaka · @amaka.o</div>
      </div>
      <span style="font-size: 13px; color: {{c.sub}}">Bal ₦200k</span>
    </div>

    <div style="text-align: center; margin-top: 18px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 56px; font-weight: 800; letter-spacing: -1.5px; color: {{amtColor}}">{{display}}</div>
    <div style="display: flex; justify-content: center; gap: 8px; margin-top: 8px">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
        <button onClick="{{q.pick}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: {{c.field}}; color: {{c.text}}; font: 600 14px Figtree, sans-serif">{{q.label}}</button>
      </sc-for>
    </div>

    <label for="note" style="position: absolute; left: -9999px">Note</label>
    <input id="note" value="for the rematch suya" style="margin-top: 14px; height: 46px; border-radius: 14px; border: none; background: {{c.field}}; color: {{c.text}}; padding: 0 14px; font: 400 16px Figtree, sans-serif; box-sizing: border-box">

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <button onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 54px; border-radius: 14px; border: none; background: transparent; color: {{c.text}}; font: 600 26px Figtree, sans-serif">{{k.label}}</button>
      </sc-for>
    </div>

    <a href="Thread.dc.html" style="margin-top: auto; height: 54px; border-radius: 16px; background: #C93E1C; color: #fff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Send {{display}}</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F6F1EA',card:'#FFFFFF',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',recv:'#ECE4D8',field:'#EEE7DC',brandText:'#B33416',money:'#0E7C47'},
dark:{bg:'#0F0D0B',bg2:'#15120F',card:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',recv:'#2A2420',field:'#1D1916',brandText:'#FF8F6B',money:'#3DDC84'}};
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { amt: '5000' }; }
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const n = parseInt(this.state.amt || '0', 10);
    const set = (v) => this.setState({ amt: String(Math.min(200000, v)) });
    const keys = ['1','2','3','4','5','6','7','8','9','00','0','del'].map((k) => ({
      label: k === 'del' ? '⌫' : k,
      aria: k === 'del' ? 'Delete' : k,
      press: () => {
        const a = this.state.amt === '0' ? '' : this.state.amt;
        if (k === 'del') return this.setState({ amt: a.slice(0, -1) || '0' });
        const next = (a + k).replace(/^0+/, '') || '0';
        set(parseInt(next, 10));
      }
    }));
    return {
      c, keys,
      display: '₦' + n.toLocaleString('en-NG'),
      amtColor: n > 0 ? c.text : c.sub,
      quick: [500, 1000, 5000].map((v) => ({ label: '₦' + v.toLocaleString('en-NG'), pick: () => set(v) }))
    };
  }
}
</script>
</body>
</html>
