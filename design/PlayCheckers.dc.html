<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Checkers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; color: #FFFFFF; background: radial-gradient(ellipse at 50% 30%, #2A1A14, #0C0705 75%)">
  <span style="position: absolute; inset: 0; background: radial-gradient(ellipse 80% 45% at 50% 45%, rgba(255,180,140,.18), transparent 70%)" aria-hidden="true"></span>
  <div style="position: absolute; left: 25px; top: 210px; width: 340px; height: 340px; perspective: 1000px" role="img" aria-label="Checkers board. A double jump is highlighted for your red piece.">
    <div style="position: absolute; inset: 0; transform: rotateX(0deg); transform-style: preserve-3d">
      <span style="position: absolute; inset: -16px; border-radius: 12px; background: linear-gradient(135deg, #2A1A12, #5A3A24 50%, #2A1A12); box-shadow: 0 34px 44px rgba(0,0,0,.65)"></span>
      <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr))">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="64">
          <div style="position: relative; aspect-ratio: 1; background: {{c.bg}}">
            <span style="position: absolute; left: 50%; top: 50%; width: {{c.mark}}; height: {{c.mark}}; transform: translate(-50%, -50%); border-radius: 50%; border: 3px dashed #E3A93B; box-sizing: border-box"></span>
            <span style="position: absolute; left: 12%; top: 8%; width: 76%; height: 76%; border-radius: 50%; display: {{c.show}}; background: {{c.disc}}; box-shadow: 0 6px 0 {{c.edge}}, 0 11px 10px rgba(0,0,0,.45), inset 0 0 0 5px rgba(255,255,255,.12), inset 0 0 0 8px rgba(0,0,0,.12)"></span>
            <svg style="position: absolute; left: 30%; top: 26%; width: 40%; height: 40%; display: {{c.king}}" viewBox="0 0 40 26" aria-hidden="true"><path d="M3 24 L6 6 L14 15 L20 2 L26 15 L34 6 L37 24 Z" fill="#FFD27A" stroke="#A86F12" stroke-width="2"/></svg>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 54px; display: flex; align-items: center; justify-content: space-between">
    <a href="Thread.dc.html" aria-label="Back to chat" style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>Chat</a>
    <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{modeBg}}; box-shadow: 0 2px 0 rgba(0,0,0,.35); font-size: 12px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: center">{{modeLabel}}</span>
    <a href="GameMenu.dc.html" aria-label="Game menu" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </a>
  </div>
  <div style="position: absolute; left: 50%; top: 106px; transform: translateX(-50%); height: 46px; padding: 0 16px 0 12px; border-radius: 23px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; gap: 8px; white-space: nowrap"><div style="display: flex"><div style="margin-left: -8px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.4)"><dc-import name="Avatar" size="34" skin="#F1C27D" hair="#7A4A2A" hair-style="short" bg="#C9B8FF" shirt="#FFB020" hint-size="34px,34px"></dc-import></div></div><span style="font-size: 13px; font-weight: 800">Dayo · black · 8 pieces</span></div>
  <div style="position: absolute; left: 14px; right: 14px; bottom: 30px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 30px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14)">
    <div style="position: relative; flex-shrink: 0"><dc-import name="Avatar" size="42" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#C9B8FF" shirt="#6E4BFF" hint-size="42px,42px"></dc-import><span style="position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #E3A93B; border-right-color: transparent"></span></div>
    <div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 800">Your turn · double jump available</div><div style="font-size: 12px; opacity: .82">Jumps are forced · tap the ring</div></div>
    <button style="height: 50px; padding: 0 18px; border-radius: 25px; border: none; background: #C93E1C; box-shadow: 0 4px 0 #8A2410, inset 0 2px 0 rgba(255,255,255,.25); color: #FFFFFF; font: 900 15px Figtree, sans-serif; flex-shrink: 0">Jump</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["pool","free"],"default":"pool"},"$preview":{"width":390,"height":844}}'>
const POT='₦1,000', MULTI=false;
function poly(pts){ return 'polygon(' + pts.map(function(p){ return p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px'; }).join(', ') + ')'; }
function rnd(seed){ var x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

const ROWS=['.b.b.b.b','b.b.b...','.b...b.b','..b.....','.r.r....','r...r.r.','.r.R.r.r','r.r.r.r.'];
function scene(){
  const path={'3,2':1,'1,4':1};
  const cells=[];
  ROWS.forEach(function(row,y){ row.split('').forEach(function(ch,x){
    const dark=(x+y)%2===1, has=ch!=='.', red=ch.toLowerCase()==='r', sel=(y===4&&x===1);
    cells.push({bg: dark?(sel?'#3A5A2A':'#2F2A26'):'#E9D9B6', show: has?'block':'none',
      disc: red?'radial-gradient(circle at 40% 35%, #FF7A5E, #C93E1C 55%, #7A1E0C)':'radial-gradient(circle at 40% 35%, #5A5450, #1E1A17 60%, #0A0807)',
      edge: red?'#7A1E0C':'#000000', king: ch==='R'?'block':'none', mark: path[y+','+x]?'70%':'0'});
  }); });
  return {cells:cells};
}
class Component extends DCLogic {
  renderVals() {
    const pool = this.props.mode !== 'free';
    return Object.assign({ modeLabel: pool ? (MULTI ? 'SPACE POOL · ' : 'POOL · ') + POT + ' POT' : (MULTI ? 'FREE SPACE · XP' : 'FREE · +25 XP'), modeBg: pool ? '#C93E1C' : '#17834F' }, scene(this.props, this));
  }
}
</script>
</body>
</html>
