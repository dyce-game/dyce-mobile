<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Word Hunt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; color: #FFFFFF; background: radial-gradient(ellipse at 50% 30%, #3A2400, #120A00 75%)">
  <span style="position: absolute; inset: 0; background: radial-gradient(ellipse 80% 40% at 50% 50%, rgba(255,210,120,.25), transparent 70%)" aria-hidden="true"></span>
  <div style="position: absolute; left: 0; right: 0; top: 176px; text-align: center"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: 4px; color: #FFD27A; text-shadow: 0 3px 0 #A86F12">SUYA</div><div style="font-size: 13px; font-weight: 800; opacity: .85">+400 · keep dragging</div></div>
  <div style="position: absolute; left: 35px; top: 270px; width: 320px; height: 320px; perspective: 900px" role="img" aria-label="Word Hunt 4 by 4 letter blocks, S U Y A traced along the top row">
    <div style="position: absolute; inset: 0; transform: rotateX(0deg); transform-style: preserve-3d">
      <span style="position: absolute; inset: -14px; border-radius: 26px; background: linear-gradient(135deg, #C98500, #FFC23D 50%, #C98500); box-shadow: 0 14px 0 #7A4A00, 0 40px 50px rgba(0,0,0,.55)"></span>
      <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="16">
          <span style="aspect-ratio: 1; border-radius: 16px; background: {{t.bg}}; box-shadow: 0 9px 0 {{t.edge}}, 0 14px 12px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6); color: {{t.fg}}; font-family: 'Bricolage Grotesque', sans-serif; font-size: 38px; font-weight: 800; display: flex; align-items: center; justify-content: center; transform: translateY({{t.lift}})">{{t.ch}}</span>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; top: 630px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center">
    <sc-for list="{{found}}" as="f" hint-placeholder-count="5"><span style="height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(255,255,255,.14); font-size: 12px; font-weight: 800; display: flex; align-items: center">{{f}}</span></sc-for>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 54px; display: flex; align-items: center; justify-content: space-between">
    <a href="Thread.dc.html" aria-label="Back to chat" style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>Chat</a>
    <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{modeBg}}; box-shadow: 0 2px 0 rgba(0,0,0,.35); font-size: 12px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: center">{{modeLabel}}</span>
    <a href="GameMenu.dc.html" aria-label="Game menu" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </a>
  </div>
  <div style="position: absolute; left: 50%; top: 106px; transform: translateX(-50%); height: 46px; padding: 0 16px 0 12px; border-radius: 23px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; gap: 8px; white-space: nowrap"><div style="display: flex"><div style="margin-left: -8px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.4)"><dc-import name="Avatar" size="34" skin="#C68642" hair="#2A1A12" hair-style="long" bg="#B8F2C8" shirt="#6E4BFF" hint-size="34px,34px"></dc-import></div></div><span style="font-size: 13px; font-weight: 800">Zainab · played · 41 pts</span></div>
  <div style="position: absolute; left: 14px; right: 14px; bottom: 30px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 30px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14)">
    <div style="position: relative; flex-shrink: 0"><dc-import name="Avatar" size="42" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#C9B8FF" shirt="#6E4BFF" hint-size="42px,42px"></dc-import><span style="position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #E3A93B; border-right-color: transparent"></span></div>
    <div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 800">Your round · 38 pts</div><div style="font-size: 12px; opacity: .82">0:41 left · beat 41</div></div>
    <button style="height: 50px; padding: 0 18px; border-radius: 25px; border: none; background: #F6EBD6; box-shadow: 0 4px 0 #B9A57E, inset 0 2px 0 rgba(255,255,255,.25); color: #1B140F; font: 900 15px Figtree, sans-serif; flex-shrink: 0">Done</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["pool","free"],"default":"pool"},"$preview":{"width":390,"height":844}}'>
const POT='₦3,000', MULTI=false;
function poly(pts){ return 'polygon(' + pts.map(function(p){ return p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px'; }).join(', ') + ')'; }
function rnd(seed){ var x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

function scene(){
  const L='SUYAJOLFMEDIRTNK'.split(''), path=[0,1,2,3];
  return { tiles: L.map(function(ch,i){ const on=path.indexOf(i)>=0; return {ch:ch, bg:on?'linear-gradient(160deg, #F07A4A, #C93E1C)':'linear-gradient(160deg, #FFFFFF, #F3E6CC)', edge:on?'#8A2410':'#B9A57E', fg:on?'#FFFFFF':'#5A3600', lift:on?'-6px':'0px'}; }),
    found:['JOLLOF','MEAT','FIRE','DIRT','LOAF'] };
}
class Component extends DCLogic {
  renderVals() {
    const pool = this.props.mode !== 'free';
    return Object.assign({ modeLabel: pool ? (MULTI ? 'SPACE POOL · ' : 'POOL · ') + POT + ' POT' : (MULTI ? 'FREE SPACE · XP' : 'FREE · +25 XP'), modeBg: pool ? '#C93E1C' : '#17834F' }, scene(this.props, this));
  }
}
</script>
</body>
</html>
