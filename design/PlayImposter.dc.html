<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["pool","free"],"default":"pool"},"variant":{"editor":"enum","options":["word","imposter"],"default":"word"},"$preview":{"width":390,"height":844}}'>
const POT='₦1,800', MULTI=true;
function poly(pts){ return 'polygon(' + pts.map(function(p){ return p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px'; }).join(', ') + ')'; }
function rnd(seed){ var x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

function scene(props){
  const imp=props.variant==='imposter';
  return {card: imp?{bg:'linear-gradient(160deg, #3A332E, #15120F)',fg:'#FF8F6B',k:'ONLY YOU DON\u2019T KNOW',w:'Imposter',s:'Blend in. Guess the word to steal the round.'}:{bg:'linear-gradient(160deg, #FFFBF2, #F2E6CE)',fg:'#1B140F',k:'YOUR SECRET WORD',w:'SUYA',s:'Give a clue that\u2019s close, not obvious'}};
}
class Component extends DCLogic {
  renderVals() {
    const pool = this.props.mode !== 'free';
    return Object.assign({ modeLabel: pool ? (MULTI ? 'SPACE POOL · ' : 'POOL · ') + POT + ' POT' : (MULTI ? 'FREE SPACE · XP' : 'FREE · +25 XP'), modeBg: pool ? '#C93E1C' : '#17834F' }, scene(this.props, this));
  }
}
</script>
