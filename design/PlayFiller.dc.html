<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Filler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; color: #FFFFFF; background: radial-gradient(ellipse at 50% 30%, #2A2420, #0F0D0B 75%)">
  <div style="position: absolute; left: 35px; top: 190px; width: 320px; height: 280px; perspective: 1000px" role="img" aria-label="Filler board : your red territory grows from the bottom left, Amaka's blue from the top right">
    <div style="position: absolute; inset: 0; transform: rotateX(0deg) rotateZ(0deg); transform-style: preserve-3d">
      <span style="position: absolute; inset: -10px; border-radius: 12px; background: #15120F; box-shadow: 0 30px 40px rgba(0,0,0,.6)"></span>
      <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="56">
          <span style="aspect-ratio: 1; border-radius: 6px; background: {{c.bg}}; box-shadow: {{c.sh}}; transform: translate({{c.up}}, {{c.up}})"></span>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 540px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 800"><span style="color: #FF8F6B">You · 22 squares</span><span style="color: #8FB8FF">Amaka · 19</span></div>
  <div style="position: absolute; left: 0; right: 0; top: 588px; display: flex; justify-content: center; gap: 12px" role="group" aria-label="Pick a colour">
    <sc-for list="{{chips}}" as="k" hint-placeholder-count="6">
      <button aria-label="{{k.name}}" style="width: 44px; height: 44px; border-radius: 50%; border: none; padding: 0; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.45), {{k.c}} 55%); box-shadow: 0 5px 0 {{k.edge}}, 0 8px 10px rgba(0,0,0,.4); opacity: {{k.op}}; outline: {{k.ring}}; outline-offset: 3px"></button>
    </sc-for>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 54px; display: flex; align-items: center; justify-content: space-between">
    <a href="Thread.dc.html" aria-label="Back to chat" style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>Chat</a>
    <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{modeBg}}; box-shadow: 0 2px 0 rgba(0,0,0,.35); font-size: 12px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: center">{{modeLabel}}</span>
    <a href="GameMenu.dc.html" aria-label="Game menu" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </a>
  </div>
  <div style="position: absolute; left: 50%; top: 106px; transform: translateX(-50%); height: 46px; padding: 0 16px 0 12px; border-radius: 23px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; gap: 8px; white-space: nowrap"><div style="display: flex"><div style="margin-left: -8px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.4)"><dc-import name="Avatar" size="34" skin="#8D5524" hair="#1C1714" hair-style="bun" bg="#FFC857" shirt="#E0453A" hint-size="34px,34px"></dc-import></div></div><span style="font-size: 13px; font-weight: 800">Amaka · picked blue</span></div>
  <div style="position: absolute; left: 14px; right: 14px; bottom: 30px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 30px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14)">
    <div style="position: relative; flex-shrink: 0"><dc-import name="Avatar" size="42" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#C9B8FF" shirt="#6E4BFF" hint-size="42px,42px"></dc-import><span style="position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #E3A93B; border-right-color: transparent"></span></div>
    <div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 800">Your pick · green grabs 5 squares</div><div style="font-size: 12px; opacity: .82">Grow from the bottom-left corner</div></div>
    <button style="height: 50px; padding: 0 18px; border-radius: 25px; border: none; background: #2BB673; box-shadow: 0 4px 0 #17734A, inset 0 2px 0 rgba(255,255,255,.25); color: #FFFFFF; font: 900 15px Figtree, sans-serif; flex-shrink: 0">Pick</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["pool","free"],"default":"free"},"$preview":{"width":390,"height":844}}'>
const POT='₦1,000', MULTI=false;
function poly(pts){ return 'polygon(' + pts.map(function(p){ return p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px'; }).join(', ') + ')'; }
function rnd(seed){ var x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

const C=[['#E0453A','#8E1E16','Red'],['#F2B90F','#A87A00','Yellow'],['#2BB673','#17734A','Green'],['#2457D6','#12307A','Blue'],['#7A4FCF','#4A2A8A','Purple'],['#3A332E','#15120F','Charcoal']];
function scene(){
  const cells=[];
  for(let r=0;r<7;r++) for(let c=0;c<8;c++){
    let k=Math.floor(rnd(r*8+c+3)*6);
    const mine=(r>=4&&c<=3&&!(r===4&&c===3))||(r===3&&c===0), theirs=(r<=2&&c>=5)||(r===3&&c===7);
    if(mine) k=0; if(theirs) k=3;
    const own=mine||theirs;
    cells.push({bg:'linear-gradient(135deg, rgba(255,255,255,.28), rgba(255,255,255,0) 50%), '+C[k][0], sh: own?('5px 5px 0 '+C[k][1]+', 9px 9px 8px rgba(0,0,0,.4)'):('2px 2px 0 '+C[k][1]), up: own?'-3px':'0px'});
  }
  return {cells:cells, chips:C.map(function(x,i){ const off=i===0||i===3; return {c:x[0],edge:x[1],name:x[2]+(off?' (taken)':''),op:off?'0.3':'1',ring:i===2?'3px solid #FFFFFF':'none'}; })};
}
class Component extends DCLogic {
  renderVals() {
    const pool = this.props.mode !== 'free';
    return Object.assign({ modeLabel: pool ? (MULTI ? 'SPACE POOL · ' : 'POOL · ') + POT + ' POT' : (MULTI ? 'FREE SPACE · XP' : 'FREE · +25 XP'), modeBg: pool ? '#C93E1C' : '#17834F' }, scene(this.props, this));
  }
}
</script>
</body>
</html>
