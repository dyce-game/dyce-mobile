<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Pool challenge received</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden">
  <header style="display: flex; align-items: flex-start; justify-content: space-between; padding: 0 8px 8px; border-bottom: 1px solid {{c.line}}; background: {{c.bg2}}">
    <a href="Chats.dc.html" aria-label="Back to chats" style="height: 44px; width: 64px; display: flex; align-items: center; color: {{c.brandText}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
      <dc-import name="Avatar" size="46" skin="#5C3A21" hair="#111111" hair-style="waves" bg="#8FD3FF" shirt="#1F2937" hint-size="46px,46px"></dc-import>
      <div style="font-size: 12px; font-weight: 600">Tunde</div>
      <div style="font-size: 11px; color: {{c.money}}; font-weight: 600">Active now</div>
    </div>
    <span style="width: 64px"></span>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 12px 14px 10px; overflow: hidden">
    <div style="align-self: center; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: {{c.bg2}}; font-size: 13px">
      <span style="padding: 2px 7px; border-radius: 6px; background: #C93E1C; color: #fff; font-size: 10px; font-weight: 800; letter-spacing: 0.4px">POOL</span>
      Word Hunt · you won the ₦3,000 pot
    </div>
    <div style="align-self: flex-start; max-width: 270px; padding: 9px 14px; border-radius: 20px; border-bottom-left-radius: 6px; background: {{c.recv}}; font-size: 16px; line-height: 1.35; margin-top: 6px">rematch. different game, same energy</div>

    <div style="align-self: flex-start; width: 284px; border-radius: 22px; overflow: hidden; background: {{c.recv}}; margin-top: 2px">
      <div style="height: 128px; position: relative; background: repeating-linear-gradient(0deg, rgba(255,255,255,.14) 0 1px, transparent 1px 18px), repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 1px, transparent 1px 18px), #0B2A55">
        <span style="position: absolute; left: 40px; top: 46px; width: 90px; height: 18px; border-radius: 9px; background: #9AA7B8"></span>
        <span style="position: absolute; left: 180px; top: 26px; width: 18px; height: 60px; border-radius: 9px; background: #9AA7B8"></span>
        <span style="position: absolute; left: 60px; top: 46px; width: 18px; height: 18px; border-radius: 50%; background: #E0453A"></span>
        <span style="position: absolute; left: 10px; top: 10px; height: 24px; padding: 0 10px; border-radius: 12px; background: #C93E1C; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 5px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>POOL {{potLabel}}</span>
      </div>
      <div style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px">
        <div>
          <div style="font-size: 16px; font-weight: 800">Sea Battle</div>
          <div style="font-size: 13px; color: {{c.sub}}; line-height: 1.4">{{headline}}</div>
        </div>

        <sc-if value="{{st.open}}" hint-placeholder-val="{{true}}">
          <button onClick="{{match}}" style="height: 46px; border-radius: 14px; border: none; background: #C93E1C; color: #fff; font: 700 16px Figtree, sans-serif">Match ₦1,000</button>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <button onClick="{{openCounter}}" style="height: 42px; border-radius: 12px; border: none; background: {{c.bg}}; color: {{c.text}}; font: 600 14px Figtree, sans-serif">Counter</button>
            <button onClick="{{goFree}}" style="height: 42px; border-radius: 12px; border: none; background: {{c.bg}}; color: {{c.money}}; font: 600 14px Figtree, sans-serif">Play free instead</button>
          </div>
        </sc-if>

        <sc-if value="{{st.countering}}" hint-placeholder-val="{{false}}">
          <div style="font-size: 13px; font-weight: 600; color: {{c.sub}}">Suggest a stake each</div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{counters}}" as="k" hint-placeholder-count="3">
              <button onClick="{{k.pick}}" style="height: 42px; border-radius: 12px; border: none; background: {{c.bg}}; color: {{c.text}}; font: 700 14px Figtree, sans-serif">{{k.label}}</button>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{st.matched}}" hint-placeholder-val="{{false}}">
          <a href="PoolResult.dc.html" style="height: 46px; border-radius: 14px; background: #C93E1C; color: #fff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Play · your move first</a>
        </sc-if>

        <sc-if value="{{st.sent}}" hint-placeholder-val="{{false}}">
          <div style="height: 42px; border-radius: 12px; background: {{c.bg}}; color: {{c.sub}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center">Waiting for Tunde…</div>
        </sc-if>

        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{c.sub}}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          {{footer}}
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px 34px">
    <a href="Games.dc.html" aria-label="Open games" style="width: 36px; height: 36px; border-radius: 11px; background: #C93E1C; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 7px; box-sizing: border-box; gap: 1px; flex-shrink: 0">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #fff"></span><span></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #fff; justify-self: end"></span>
      <span></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #fff; justify-self: center"></span><span></span>
      <span style="width: 5px; height: 5px; border-radius: 50%; background: #fff"></span><span></span><span style="width: 5px; height: 5px; border-radius: 50%; background: #fff; justify-self: end"></span>
    </a>
    <div style="flex: 1; height: 38px; border-radius: 19px; border: 1px solid {{c.line}}; display: flex; align-items: center; padding: 0 14px">
      <label for="m2" style="position: absolute; left: -9999px">Message</label>
      <input id="m2" placeholder="Dyce message" style="flex: 1; min-width: 0; border: none; background: none; font: 400 16px Figtree, sans-serif; color: {{c.text}}; outline: none">
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F6F1EA',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',recv:'#ECE4D8',brandText:'#B33416',money:'#0E7C47'},
dark:{bg:'#0F0D0B',bg2:'#15120F',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',recv:'#2A2420',brandText:'#FF8F6B',money:'#3DDC84'}};
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { phase: 'open', counter: null }; }
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const ph = this.state.phase;
    const k = this.state.counter;
    const copy = {
      open: ['Tunde locked ₦1,000. Match it and you play for ₦2,000.', 'Expires in 23:41 · nothing leaves your wallet until you match'],
      countering: ['Tunde locked ₦1,000. Offer a smaller stake?', 'Tunde gets your offer as a message'],
      matched: ['Both stakes locked. Winner takes ₦2,000.', 'Leaving mid-game for 60s counts as a forfeit'],
      sent: [k === 0 ? 'You asked to play this one free.' : 'You offered ₦' + (k || 0).toLocaleString('en-NG') + ' each.', 'If Tunde says no, his ₦1,000 goes back to him']
    }[ph];
    return {
      c,
      st: { open: ph === 'open', countering: ph === 'countering', matched: ph === 'matched', sent: ph === 'sent' },
      potLabel: ph === 'sent' && k === 0 ? 'FREE?' : '₦2,000',
      headline: copy[0], footer: copy[1],
      match: () => this.setState({ phase: 'matched' }),
      openCounter: () => this.setState({ phase: 'countering' }),
      goFree: () => this.setState({ phase: 'sent', counter: 0 }),
      counters: [500, 200, 0].map((v) => ({ label: v === 0 ? 'Free' : '₦' + v, pick: () => this.setState({ phase: 'sent', counter: v }) }))
    };
  }
}
</script>
</body>
</html>
