<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Guest game in the browser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; background: #170C1C">
  <dc-import name="PlayCupPong" guest="true" mode="free" hint-size="390px,844px"></dc-import>
  <sc-if value="{{isEnd}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(6,10,30,.7)"></div>
    <section aria-label="Game over" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: {{k.card}}; color: {{k.text}}; padding: 22px 20px 34px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; font-weight: 800; color: {{k.money}}; letter-spacing: 0.4px">YOU BEAT KEMDI · 6 – 4</div>
      <div style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1">Not bad for a first game, Tolu</div>
      <div style="font-size: 15px; color: {{k.sub}}; line-height: 1.45">Get Dyce to keep this win on your record and claim the ₦200k everyone starts with.</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
        <div style="border-radius: 14px; background: {{k.bg2}}; padding: 10px; text-align: center"><div style="font-size: 17px; font-weight: 800">+25</div><div style="font-size: 11px; color: {{k.sub}}">XP saved 7 days</div></div>
        <div style="border-radius: 14px; background: {{k.bg2}}; padding: 10px; text-align: center"><div style="font-size: 17px; font-weight: 800">1–0</div><div style="font-size: 11px; color: {{k.sub}}">vs Kemdi</div></div>
        <div style="border-radius: 14px; background: {{k.soft}}; padding: 10px; text-align: center"><div style="font-size: 17px; font-weight: 800; color: {{k.accent}}">₦200k</div><div style="font-size: 11px; color: {{k.sub}}">waiting</div></div>
      </div>
      <a href="DeepLinkOnboard.dc.html" style="margin-top: 8px; height: 54px; border-radius: 16px; background: #C93E1C; color: #fff; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Get Dyce, keep the win</a>
      <button style="height: 46px; border-radius: 14px; border: none; background: {{k.field}}; color: {{k.text}}; font: 600 15px Figtree, sans-serif">Rematch in browser</button>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["play","end"],"default":"play"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const KT={light:{card:'#FFFFFF',text:'#1B140F',sub:'#62584E',bg2:'#F2ECE3',soft:'#FBE7DF',accent:'#B33416',field:'#EEE7DC',money:'#0E7C47'},dark:{card:'#1D1916',text:'#F7F1E8',sub:'#ABA196',bg2:'#2A2420',soft:'#3A170C',accent:'#FF8F6B',field:'#2A2420',money:'#3DDC84'}};
class Component extends DCLogic {
  renderVals() {
    return { isEnd: this.props.variant === 'end', k: KT[this.props.theme === 'dark' ? 'dark' : 'light'] };
  }
}
</script>
</body>
</html>
