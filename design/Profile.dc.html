<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — My profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px">
    <a href="Chats.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; color: {{c.text}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="display: flex; gap: 4px">
      <button aria-label="Share profile" style="width: 44px; height: 44px; border: none; background: none; color: {{c.text}}; padding: 0; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      </button>
      <a href="Activity.dc.html" aria-label="Notifications, 2 new" style="width: 44px; height: 44px; color: {{c.text}}; display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span style="position: absolute; right: 6px; top: 6px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #C93E1C; border: 2px solid {{c.bg}}; color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span>
      </a>
      <a href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 16px 0">
    <div style="position: relative">
      <dc-import name="Avatar" size="120" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#C9B8FF" shirt="#C93E1C" hint-size="120px,120px"></dc-import>
      <a href="AvatarBuilder.dc.html" aria-label="Edit avatar" style="position: absolute; right: 0; bottom: 4px; width: 36px; height: 36px; border-radius: 50%; background: #C93E1C; border: 3px solid {{c.bg}}; display: flex; align-items: center; justify-content: center; color: #fff">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </a>
    </div>
    <div style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 26px; font-weight: 800">Kemdi</div>
    <div style="font-size: 14px; color: {{c.sub}}">@kemdi.plays · Lagos · <a href="Friends.dc.html" style="color: {{c.brandText}}; font-weight: 700; text-decoration: none">24 friends</a></div>
    <div style="width: 100%; margin-top: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700"><span>Level 8</span><span style="color: {{c.sub}}">30 / 600 XP</span></div>
      <div style="height: 8px; border-radius: 4px; background: {{c.field}}; margin-top: 6px; overflow: hidden"><div style="width: 5%; height: 100%; background: #2BB673"></div></div>
    </div>
  </div>

  <a href="Activity.dc.html" style="margin: 14px 16px 0; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: {{c.bg2}}; color: {{c.text}}; text-decoration: none">
    <span style="width: 36px; height: 36px; border-radius: 12px; background: #C93E1C; box-shadow: 0 2px 0 #8A2410; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
    </span>
    <span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 700">Notifications</span><span style="display: block; font-size: 12px; color: {{c.sub}}">Your turn in 8 Ball · Tunde matched ₦1,000</span></span>
    <span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #C93E1C; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span>
  </a>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 10px 16px 0">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
      <div style="border-radius: 16px; padding: 10px 8px; background: {{c.bg2}}; text-align: center">
        <div style="font-size: 17px; font-weight: 800; color: {{s.color}}">{{s.v}}</div>
        <div style="font-size: 11px; color: {{c.sub}}; margin-top: 2px">{{s.k}}</div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: baseline; margin: 18px 16px 8px">
    <h2 style="margin: 0; font-size: 17px; font-weight: 700">Badges</h2><a href="Badges.dc.html" style="font-size: 13px; color: {{c.brandText}}; font-weight: 700; text-decoration: none">See all 40</a>
  </div>
  <div style="display: flex; gap: 10px; padding: 0 16px; overflow: hidden">
    <sc-for list="{{badges}}" as="b" hint-placeholder-count="5">
      <div style="width: 64px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: {{b.op}}">
        <span style="width: 54px; height: 54px; border-radius: 16px; background: {{b.bg}}; color: #fff; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; transform: rotate(-4deg)">{{b.m}}</span>
        <span style="font-size: 11px; font-weight: 600; text-align: center; line-height: 1.2">{{b.n}}</span>
      </div>
    </sc-for>
  </div>

  <h2 style="margin: 18px 16px 4px; font-size: 17px; font-weight: 700">Recent games</h2>
  <div style="flex: 1; overflow: hidden; padding: 0 16px">
    <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; height: 54px; border-bottom: 1px solid {{c.line}}">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span>
        <div style="flex: 1"><div style="font-size: 15px; font-weight: 600">{{r.g}} <span style="font-weight: 500; color: {{c.sub}}">vs {{r.vs}}</span></div><div style="font-size: 12px; color: {{c.sub}}">{{r.mode}}</div></div>
        <span style="font-size: 14px; font-weight: 700; color: {{r.color}}">{{r.res}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F2ECE3',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',field:'#EEE7DC',brandText:'#B33416',money:'#0E7C47',loss:'#C4314B'},
dark:{bg:'#0F0D0B',bg2:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',field:'#1D1916',brandText:'#FF8F6B',money:'#3DDC84',loss:'#FF6B81'}};
class Component extends DCLogic {
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const W = { dot: '#2BB673', color: c.money }, L = { dot: '#E0453A', color: c.loss };
    return {
      c,
      stats: [{ k: 'Games', v: '86', color: c.text }, { k: 'Win rate', v: '62%', color: c.text }, { k: 'Pool net', v: '+₦9k', color: c.money }, { k: 'Best pot', v: '₦3k', color: c.text }],
      badges: [
        { n: 'Clean Sweep', m: 'CS', bg: '#2BB673', op: '1' }, { n: 'Hill Holder', m: '♛', bg: '#B37A00', op: '1' },
        { n: 'First Pool', m: '₦', bg: '#C93E1C', op: '1' }, { n: 'Party Host', m: '4+', bg: '#C2410C', op: '1' },
        { n: 'Wordsmith', m: 'Aa', bg: '#9AA0AE', op: '0.45' }
      ],
      recent: [
        Object.assign({ g: '8 Ball', vs: 'Amaka', mode: 'Free · +25 XP', res: 'Won' }, W),
        Object.assign({ g: 'Word Hunt', vs: 'Tunde', mode: 'Pool · ₦3,000 pot', res: '+₦1,500' }, W),
        Object.assign({ g: 'Sea Battle', vs: '@lagos_shark', mode: 'Pool · ₦2,000 pot', res: '−₦1,000' }, L),
        Object.assign({ g: 'Crazy Cards', vs: 'space of 4', mode: 'Free space · 2nd place', res: '+30 XP' }, W)
      ]
    };
  }
}
</script>
</body>
</html>
