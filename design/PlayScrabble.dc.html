<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Scrabble</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; color: #FFFFFF; background: linear-gradient(#1A2A22, #0C1712)">
  <div style="position: absolute; left: 30px; top: 175px; width: 330px; height: 330px; perspective: 1000px" role="img" aria-label="Scrabble board with JOLLOF across and LAGOS down">
    <div style="position: absolute; inset: 0; transform: rotateX(0deg); transform-style: preserve-3d">
      <span style="position: absolute; inset: -12px; border-radius: 10px; background: linear-gradient(135deg, #1F4A3A, #2E6A52 50%, #1F4A3A); box-shadow: 0 30px 40px rgba(0,0,0,.55)"></span>
      <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 1px; background: #CFC6AE">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="225">
          <div style="position: relative; aspect-ratio: 1; background: {{c.bg}}; font-size: 6px; font-weight: 900; color: rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center">{{c.lab}}
            <span style="position: absolute; inset: 1px; border-radius: 2px; display: {{c.tile}}; background: linear-gradient(160deg, #FFF0CC, #EBCF95); box-shadow: 0 3px 0 #A57A3C, 0 5px 4px rgba(0,0,0,.35); color: #3A2A14; font-size: 13px; font-weight: 900; align-items: center; justify-content: center">{{c.ch}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 14px; right: 14px; top: 600px; height: 74px; perspective: 600px" aria-label="Your rack: E, K, W, A, R, I, N" role="img">
    <div style="position: absolute; inset: 0; transform: rotateX(0deg); transform-style: preserve-3d">
      <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 22px; border-radius: 6px; background: linear-gradient(#8A5A30, #5A3418); box-shadow: 0 8px 14px rgba(0,0,0,.5)"></span>
      <div style="position: absolute; left: 10px; right: 10px; bottom: 14px; display: flex; gap: 6px; justify-content: center">
        <sc-for list="{{rack}}" as="t" hint-placeholder-count="7">
          <span style="position: relative; width: 42px; height: 46px; border-radius: 6px; background: linear-gradient(160deg, #FFF3D6, #E8C988); box-shadow: 0 5px 0 #A57A3C, 0 8px 8px rgba(0,0,0,.4), inset 0 1px 0 #fff; color: #3A2A14; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; transform: translateY({{t.lift}})">{{t.ch}}<span style="position: absolute; right: 4px; bottom: 2px; font-size: 9px; font-weight: 900">{{t.v}}</span></span>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 548px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 800"><span>You 148</span><span style="color: #FFD27A">JOLLOF · 24 pts</span><span>Zainab 131</span></div>
  <div style="position: absolute; left: 12px; right: 12px; top: 54px; display: flex; align-items: center; justify-content: space-between">
    <a href="Thread.dc.html" aria-label="Back to chat" style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>Chat</a>
    <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{modeBg}}; box-shadow: 0 2px 0 rgba(0,0,0,.35); font-size: 12px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: center">{{modeLabel}}</span>
    <a href="GameMenu.dc.html" aria-label="Game menu" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </a>
  </div>
  <div style="position: absolute; left: 50%; top: 106px; transform: translateX(-50%); height: 46px; padding: 0 16px 0 12px; border-radius: 23px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; gap: 8px; white-space: nowrap"><div style="display: flex"><div style="margin-left: -8px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.4)"><dc-import name="Avatar" size="34" skin="#C68642" hair="#2A1A12" hair-style="long" bg="#B8F2C8" shirt="#6E4BFF" hint-size="34px,34px"></dc-import></div></div><span style="font-size: 13px; font-weight: 800">Zainab · played EKE · 14 pts</span></div>
  <div style="position: absolute; left: 14px; right: 14px; bottom: 30px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 30px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14)">
    <div style="position: relative; flex-shrink: 0"><dc-import name="Avatar" size="42" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#C9B8FF" shirt="#6E4BFF" hint-size="42px,42px"></dc-import><span style="position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #E3A93B; border-right-color: transparent"></span></div>
    <div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 800">Your turn · 7 tiles</div><div style="font-size: 12px; opacity: .82">Drag tiles to the board · K is lifted</div></div>
    <button style="height: 50px; padding: 0 18px; border-radius: 25px; border: none; background: #C93E1C; box-shadow: 0 4px 0 #8A2410, inset 0 2px 0 rgba(255,255,255,.25); color: #FFFFFF; font: 900 15px Figtree, sans-serif; flex-shrink: 0">Play</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["pool","free"],"default":"pool"},"$preview":{"width":390,"height":844}}'>
const POT='₦1,500', MULTI=false;
function poly(pts){ return 'polygon(' + pts.map(function(p){ return p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px'; }).join(', ') + ')'; }
function rnd(seed){ var x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

const TW=[[0,0],[0,7],[0,14],[7,0],[7,14],[14,0],[14,7],[14,14]], TL=[[1,5],[1,9],[5,1],[5,5],[5,9],[5,13],[9,1],[9,5],[9,9],[9,13],[13,5],[13,9]];
const DL=[[0,3],[0,11],[2,6],[2,8],[3,0],[3,7],[3,14],[6,2],[6,6],[6,8],[6,12],[7,3],[7,11],[8,2],[8,6],[8,8],[8,12],[11,0],[11,7],[11,14],[12,6],[12,8],[14,3],[14,11]];
function has(list,r,c){ return list.some(function(p){ return p[0]===r&&p[1]===c; }); }
function scene(){
  const tiles={'7,4':'J','7,5':'O','7,6':'L','7,7':'L','7,8':'O','7,9':'F','8,6':'A','9,6':'G','10,6':'O','11,6':'S','4,9':'K','5,9':'E','6,9':'E'};
  const cells=[];
  for(let r=0;r<15;r++) for(let c=0;c<15;c++){
    const dw=(r===c||r+c===14)&&(r<5||r>9||(r===7&&c===7)) && !(r===0||r===14);
    let bg='#EFE7D2', lab='';
    if(has(TW,r,c)){bg='#C93E1C';lab='3W';} else if(has(TL,r,c)){bg='#2457D6';lab='3L';} else if(dw){bg='#E58A7A';lab=(r===7&&c===7)?'★':'2W';} else if(has(DL,r,c)){bg='#8DBDE8';lab='2L';}
    const t=tiles[r+','+c];
    cells.push({bg:bg,lab:t?'':lab,tile:t?'flex':'none',ch:t||''});
  }
  const R=[['E',1],['K',5],['W',4],['A',1],['R',1],['I',1],['N',1]];
  return {cells:cells, rack:R.map(function(x,i){ return {ch:x[0],v:String(x[1]),lift:i===1?'-10px':'0px'}; })};
}
class Component extends DCLogic {
  renderVals() {
    const pool = this.props.mode !== 'free';
    return Object.assign({ modeLabel: pool ? (MULTI ? 'SPACE POOL · ' : 'POOL · ') + POT + ' POT' : (MULTI ? 'FREE SPACE · XP' : 'FREE · +25 XP'), modeBg: pool ? '#C93E1C' : '#17834F' }, scene(this.props, this));
  }
}
</script>
</body>
</html>
