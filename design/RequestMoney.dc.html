<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Request and receive cash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden; position: relative">
  <header style="display: flex; align-items: center; gap: 10px; padding: 0 12px 8px; border-bottom: 1px solid {{c.line}}; background: {{c.bg2}}">
    <a href="Chats.dc.html" aria-label="Back" style="width: 36px; height: 44px; display: flex; align-items: center; color: {{c.brandText}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <dc-import name="Avatar" size="38" skin="#C68642" hair="#2A1A12" hair-style="long" bg="#B8F2C8" shirt="#C93E1C" hint-size="38px,38px"></dc-import>
    <span style="font-size: 15px; font-weight: 700">Zainab</span>
  </header>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 12px 14px 44px; overflow: hidden">
    <div style="align-self: flex-start; width: 250px; border-radius: 22px; overflow: hidden; background: {{giftBg}}; color: #fff">
      <div style="padding: 16px; position: relative">
        <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.4px; opacity: .9">ZAINAB SENT YOU</div>
        <div style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 38px; font-weight: 800; letter-spacing: -1px">₦5,000</div>
        <div style="font-size: 14px; opacity: .95">"for the rematch"</div>
      </div>
      <button onClick="{{open}}" style="width: 100%; height: 44px; border: none; background: rgba(0,0,0,.22); color: #fff; font: 700 14px Figtree, sans-serif">{{giftCta}}</button>
    </div>

    <div style="align-self: flex-end; width: 260px; border-radius: 22px; background: {{c.card}}; border: 1px solid {{c.line}}; padding: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.4px; color: {{c.brandText}}">YOU REQUESTED</span>
        <span style="font-size: 12px; color: {{c.sub}}">Pending</span>
      </div>
      <div style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 30px; font-weight: 800; margin-top: 2px">₦2,000</div>
      <div style="font-size: 14px; color: {{c.sub}}">"the suya you lost on Sunday"</div>
      <button style="margin-top: 10px; width: 100%; height: 38px; border-radius: 12px; border: none; background: {{c.field}}; color: {{c.text}}; font: 600 14px Figtree, sans-serif">Cancel request</button>
    </div>
  </div>

  <sc-if value="{{isCompose}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,.35)"></div>
    <section aria-label="Request Dyce Cash" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 26px 26px 0 0; background: {{c.bg}}; padding: 8px 16px 34px">
      <div style="width: 40px; height: 5px; border-radius: 3px; background: {{c.line}}; margin: 0 auto"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px">
        <span style="font-size: 18px; font-weight: 800">Request from Zainab</span>
        <span style="font-size: 13px; color: {{c.sub}}">She has to tap Pay</span>
      </div>
      <div style="text-align: center; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 54px; font-weight: 800; letter-spacing: -1.5px; margin-top: 16px">{{amt}}</div>
      <div style="display: flex; justify-content: center; gap: 8px; margin-top: 8px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
          <button onClick="{{q.pick}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 2px solid {{q.ring}}; background: {{c.field}}; color: {{c.text}}; font: 700 14px Figtree, sans-serif">{{q.l}}</button>
        </sc-for>
      </div>
      <div style="font-size: 13px; font-weight: 600; color: {{c.sub}}; margin: 16px 0 8px">What's it for?</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{reasons}}" as="r" hint-placeholder-count="4">
          <button onClick="{{r.pick}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: {{r.bgc}}; color: {{r.fg}}; font: 600 13px Figtree, sans-serif">{{r.l}}</button>
        </sc-for>
      </div>
      <button style="margin-top: 18px; width: 100%; height: 54px; border-radius: 16px; border: none; background: #C93E1C; color: #fff; font: 700 17px Figtree, sans-serif">Request {{amt}}</button>
      <div style="font-size: 12px; color: {{c.sub}}; text-align: center; margin-top: 8px">Strangers can't request from you. Only Dyce friends.</div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["compose","chat"],"default":"compose"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F6F1EA',card:'#FFFFFF',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',field:'#EEE7DC',brandText:'#B33416',brandSoft:'#FBE7DF',ink:'#1B140F',inkText:'#FFFFFF'},
dark:{bg:'#0F0D0B',bg2:'#15120F',card:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',field:'#1D1916',brandText:'#FF8F6B',brandSoft:'#3A170C',ink:'#F7F1E8',inkText:'#1B140F'}};
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { amt: 2000, why: 'Suya debt', opened: false }; }
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const s = this.state;
    const fmt = (n) => '₦' + n.toLocaleString('en-NG');
    return {
      c, isCompose: this.props.variant !== 'chat',
      amt: fmt(s.amt),
      quick: [1000, 2000, 5000].map((v) => ({ l: fmt(v), ring: v === s.amt ? '#C93E1C' : 'transparent', pick: () => this.setState({ amt: v }) })),
      reasons: ['Suya debt', 'Rematch stake', 'Split the space fee', 'Just because'].map((l) => ({ l, bgc: s.why === l ? c.ink : c.field, fg: s.why === l ? c.inkText : c.text, pick: () => this.setState({ why: l }) })),
      giftBg: s.opened ? 'linear-gradient(135deg, #2BB673, #13774A)' : 'linear-gradient(135deg, #F07A4A, #A8321A)',
      giftCta: s.opened ? 'Added to your wallet' : 'Tap to add to wallet',
      open: () => this.setState({ opened: true })
    };
  }
}
</script>
</body>
</html>
