<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Pool result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 20px 34px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{r.bg}}; color: #FFFFFF">
  <sc-for list="{{confetti}}" as="p" hint-placeholder-count="12">
    <span style="position: absolute; left: {{p.x}}; top: {{p.y}}; width: {{p.w}}; height: {{p.h}}; border-radius: 3px; background: {{p.c}}; transform: rotate({{p.r}})" aria-hidden="true"></span>
  </sc-for>

  <div style="display: flex; justify-content: space-between; align-items: center; height: 44px; position: relative">
    <a href="PoolInvite.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; color: #fff">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <span style="height: 28px; padding: 0 12px; border-radius: 14px; background: rgba(0,0,0,.25); font-size: 12px; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center">SEA BATTLE · POOL</span>
    <span style="width: 44px"></span>
  </div>

  <div style="display: flex; justify-content: center; align-items: flex-end; gap: 18px; margin-top: 28px; position: relative">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: {{r.meOp}}">
      <div style="height: 28px; display: flex; align-items: flex-end">
        <sc-if value="{{r.meCrown}}" hint-placeholder-val="{{true}}">
          <svg width="40" height="26" viewBox="0 0 40 26" aria-hidden="true"><path d="M3 24 L6 6 L14 15 L20 2 L26 15 L34 6 L37 24 Z" fill="#FFC857" stroke="#B37A00" stroke-width="2" stroke-linejoin="round"/></svg>
        </sc-if>
      </div>
      <dc-import name="Avatar" size="{{r.meSize}}" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#C9B8FF" shirt="#C93E1C" hint-size="120px,120px"></dc-import>
      <span style="font-size: 15px; font-weight: 700">You</span>
      <span style="font-size: 28px; font-weight: 800; font-family: 'Bricolage Grotesque', Figtree, sans-serif">{{r.myScore}}</span>
    </div>
    <div style="font-size: 16px; font-weight: 700; opacity: .8; padding-bottom: 40px">vs</div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: {{r.themOp}}">
      <div style="height: 28px; display: flex; align-items: flex-end">
        <sc-if value="{{r.themCrown}}" hint-placeholder-val="{{false}}">
          <svg width="40" height="26" viewBox="0 0 40 26" aria-hidden="true"><path d="M3 24 L6 6 L14 15 L20 2 L26 15 L34 6 L37 24 Z" fill="#FFC857" stroke="#B37A00" stroke-width="2" stroke-linejoin="round"/></svg>
        </sc-if>
      </div>
      <dc-import name="Avatar" size="{{r.themSize}}" skin="#5C3A21" hair="#111111" hair-style="waves" bg="#8FD3FF" shirt="#1F2937" hint-size="88px,88px"></dc-import>
      <span style="font-size: 15px; font-weight: 700">Tunde</span>
      <span style="font-size: 28px; font-weight: 800; font-family: 'Bricolage Grotesque', Figtree, sans-serif">{{r.theirScore}}</span>
    </div>
  </div>

  <div style="text-align: center; margin-top: 18px; position: relative">
    <div style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -0.6px">{{r.title}}</div>
    <div style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 52px; font-weight: 800; letter-spacing: -1.5px; color: {{r.amtColor}}">{{r.amount}}</div>
  </div>

  <div style="margin-top: 14px; border-radius: 20px; background: rgba(0,0,0,.24); padding: 4px 16px; position: relative">
    <sc-for list="{{r.lines}}" as="l" hint-placeholder-count="4">
      <div style="display: flex; justify-content: space-between; height: 40px; align-items: center; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,.14)">
        <span style="opacity: .9">{{l.k}}</span><span style="font-weight: 700">{{l.v}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; position: relative">
    <button style="height: 56px; border-radius: 16px; border: none; background: #FFFFFF; color: #5A1A0C; font: 800 17px Figtree, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px">{{r.primary}}<span style="font-size: 12px; font-weight: 600; color: #7A3A28">{{r.primarySub}}</span></button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 48px; border-radius: 14px; border: none; background: rgba(255,255,255,.18); color: #fff; font: 700 15px Figtree, sans-serif">{{r.secondary}}</button>
      <a href="Thread.dc.html" style="height: 48px; border-radius: 14px; background: rgba(255,255,255,.18); color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Back to chat</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"outcome":{"editor":"enum","options":["win","lose","draw"],"default":"win"},"$preview":{"width":390,"height":844}}'>
const CONF=[[24,120,10,18,'#FFC857',20],[70,180,8,14,'#9DF2BE',-30],[312,110,10,18,'#FF8FA3',40],[350,200,8,14,'#FFC857',-15],[40,330,8,14,'#8FD3FF',60],[338,320,10,16,'#9DF2BE',25],[150,96,8,12,'#FF8FA3',-50],[250,150,8,12,'#8FD3FF',35],[16,250,10,16,'#FFFFFF',10],[364,260,8,12,'#FFFFFF',-25],[110,300,6,10,'#FFC857',70],[290,92,6,10,'#9DF2BE',-60]];
const OUT={
  win:{bg:'radial-gradient(circle at 50% 18%, #F07A4A 0%, #B5381A 45%, #5A1A0C 100%)',title:'You won the pool',amount:'+₦2,000',amtColor:'#9DF2BE',myScore:'17',theirScore:'12',meCrown:true,themCrown:false,meSize:'120',themSize:'88',meOp:'1',themOp:'0.75',
    lines:[{k:'Your stake back',v:'₦1,000'},{k:'Tunde\'s stake',v:'₦1,000'},{k:'Dyce fee',v:'₦0'},{k:'New balance',v:'₦201,000'}],
    primary:'Run it back · ₦2,000 each',primarySub:'Double or nothing · Tunde must accept',secondary:'Same stake'},
  lose:{bg:'radial-gradient(circle at 50% 18%, #3A3A46 0%, #23232C 50%, #121216 100%)',title:'Tunde took the pool',amount:'−₦1,000',amtColor:'#FFB4C0',myScore:'12',theirScore:'17',meCrown:false,themCrown:true,meSize:'88',meOp:'0.75',themSize:'120',themOp:'1',
    lines:[{k:'Your stake',v:'₦1,000'},{k:'Paid to Tunde',v:'₦2,000 pot'},{k:'Hits landed',v:'12 of 17'},{k:'New balance',v:'₦199,000'}],
    primary:'Ask for a run-back',primarySub:'Double or nothing · ₦2,000 each',secondary:'Rematch free'},
  draw:{bg:'radial-gradient(circle at 50% 18%, #2F7DD1 0%, #1C4F94 50%, #0E2B57 100%)',title:'Dead even',amount:'Pot split',amtColor:'#FFFFFF',myScore:'15',theirScore:'15',meCrown:false,themCrown:false,meSize:'104',themSize:'104',meOp:'1',themOp:'1',
    lines:[{k:'Back to you',v:'₦1,000'},{k:'Back to Tunde',v:'₦1,000'},{k:'Draws this month',v:'2'},{k:'Balance',v:'₦200k'}],
    primary:'Sudden-death decider',primarySub:'One more round, same ₦2,000 pot',secondary:'Call it a draw'}
};
class Component extends DCLogic {
  renderVals() {
    const o = OUT[this.props.outcome] ? this.props.outcome : 'win';
    return {
      r: OUT[o],
      confetti: o === 'win' ? CONF.map(([x,y,w,h,c,r]) => ({ x: x + 'px', y: y + 'px', w: w + 'px', h: h + 'px', c, r: r + 'deg' })) : []
    };
  }
}
</script>
</body>
</html>
