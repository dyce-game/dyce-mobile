<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Phone number</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 54px 24px 34px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; color: {{c.text}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="display: flex; gap: 6px" aria-label="Step 1 of 3">
      <span style="width: 22px; height: 6px; border-radius: 3px; background: #C93E1C"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: {{c.line}}"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: {{c.line}}"></span>
    </div>
    <span style="width: 44px"></span>
  </div>

  <h1 style="margin: 24px 0 8px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.5px">What's your number?</h1>
  <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.45; color: {{c.sub}}">We'll text a code. It fills itself in. No passwords, ever.</p>

  <label for="ph" style="font-size: 13px; font-weight: 600; color: {{c.sub}}; margin-bottom: 8px">Phone</label>
  <div style="display: flex; gap: 8px">
    <button style="height: 56px; padding: 0 14px; border-radius: 16px; border: none; background: {{c.field}}; color: {{c.text}}; font: 600 17px Figtree, sans-serif; display: flex; align-items: center; gap: 6px">NG +234
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <input id="ph" value="803 412 7781" style="flex: 1; min-width: 0; height: 56px; padding: 0 16px; border-radius: 16px; border: 2px solid #C93E1C; background: {{c.bg}}; color: {{c.text}}; font: 600 19px Figtree, sans-serif; letter-spacing: 0.5px; box-sizing: border-box">
  </div>

  <div style="margin-top: 28px; display: flex; align-items: center; justify-content: space-between">
    <div style="font-size: 13px; font-weight: 600; color: {{c.sub}}">Code sent to +234 803 412 7781</div>
    <button style="border: none; background: none; padding: 0; height: 44px; color: {{c.brandText}}; font: 600 14px Figtree, sans-serif">Resend in 0:24</button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
    <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
      <div style="height: 58px; border-radius: 14px; background: {{c.field}}; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700">{{d}}</div>
    </sc-for>
  </div>
  <div style="margin-top: 14px; display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 14px; background: {{c.moneySoft}}; color: {{c.money}}; font-size: 14px; font-weight: 600">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    Code filled from your messages
  </div>

  <a href="Username.dc.html" style="margin-top: auto; height: 54px; border-radius: 16px; background: #C93E1C; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
  <p style="margin: 12px 0 0; font-size: 12px; line-height: 1.5; color: {{c.sub}}; text-align: center">Same screen logs you back in. Your number stays private; friends find you by @username.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F2ECE3',card:'#FFFFFF',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',recv:'#ECE4D8',field:'#EEE7DC',brand:'#C93E1C',brandText:'#B33416',brandSoft:'#FBE7DF',sms:'#0067D6',money:'#0E7C47',moneySoft:'#E3F6EA',danger:'#C4314B',ink:'#1B140F',inkText:'#FFFFFF'},
dark:{bg:'#0F0D0B',bg2:'#15120F',card:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',recv:'#2A2420',field:'#1D1916',brand:'#C93E1C',brandText:'#FF8F6B',brandSoft:'#3A170C',sms:'#0067D6',money:'#3DDC84',moneySoft:'#11301F',danger:'#FF6B81',ink:'#F7F1E8',inkText:'#1B140F'}};
class Component extends DCLogic {
  renderVals() { return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'], digits: ['4','8','2','9','1','6'] }; }
}
</script>
</body>
</html>
