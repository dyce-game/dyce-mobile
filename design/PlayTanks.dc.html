<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Tanks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; color: #FFFFFF; background: linear-gradient(#1E1638 0%, #5A2A55 38%, #E2704A 66%, #FFB27A 76%)">
  <span style="position: absolute; left: 230px; top: 380px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #FFE3A0, #FFB27A 50%, transparent 72%)" aria-hidden="true"></span>
  <span style="position: absolute; inset: 0; clip-path: polygon(0 470px, 60px 420px, 130px 450px, 210px 390px, 290px 440px, 390px 400px, 390px 844px, 0 844px); background: #5A3A6A; opacity: .75" aria-hidden="true"></span>
  <span style="position: absolute; inset: 0; clip-path: polygon(0 520px, 80px 480px, 170px 510px, 250px 470px, 330px 500px, 390px 480px, 390px 844px, 0 844px); background: #3E2A50" aria-hidden="true"></span>
  <div role="img" aria-label="Tanks on hilly terrain at sunset. Your red tank on the left aims at the blue tank on the right." style="position: absolute; inset: 0">
    <span style="position: absolute; inset: 0; clip-path: polygon(0 620px, 40px 600px, 90px 606px, 140px 640px, 190px 660px, 230px 640px, 270px 590px, 320px 575px, 360px 585px, 390px 600px, 390px 844px, 0 844px); background: linear-gradient(#6FA34A, #4A7A30 12%, #5A3A22 40%, #3A2414)"></span>
    <span style="position: absolute; inset: 0; clip-path: polygon(0 620px, 40px 600px, 90px 606px, 140px 640px, 190px 660px, 230px 640px, 270px 590px, 320px 575px, 360px 585px, 390px 600px, 390px 606px, 360px 591px, 320px 581px, 270px 596px, 230px 646px, 190px 666px, 140px 646px, 90px 612px, 40px 606px, 0 626px); background: #A6D46E"></span>
    <span style="position: absolute; left: 180px; top: 652px; width: 34px; height: 12px; border-radius: 50%; background: rgba(30,15,5,.7)"></span>
    <sc-for list="{{arc}}" as="a" hint-placeholder-count="14">
      <span style="position: absolute; left: {{a.x}}; top: {{a.y}}; width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,{{a.o}})"></span>
    </sc-for>
    <sc-for list="{{tanks}}" as="t" hint-placeholder-count="2">
      <div style="position: absolute; left: {{t.x}}; top: {{t.y}}; width: 70px; height: 44px; transform: scaleX({{t.flip}}) rotate({{t.tilt}})">
        <span style="position: absolute; left: 26px; top: 6px; width: 40px; height: 6px; border-radius: 3px; background: linear-gradient(#555, #222); transform-origin: 0 50%; transform: rotate({{t.ang}})"></span>
        <span style="position: absolute; left: 18px; top: 2px; width: 26px; height: 16px; border-radius: 13px 13px 3px 3px; background: {{t.turret}}"></span>
        <span style="position: absolute; left: 4px; top: 14px; width: 62px; height: 16px; clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%); background: {{t.body}}"></span>
        <span style="position: absolute; left: 0; top: 28px; width: 70px; height: 14px; border-radius: 7px; background: radial-gradient(circle at 7px 7px, #777 0 4px, transparent 4.5px) 0 0 / 14px 14px, #1E1A17"></span>
      </div>
      <span style="position: absolute; left: {{t.hx}}; top: {{t.hy}}; width: 56px; height: 7px; border-radius: 4px; background: rgba(0,0,0,.4); overflow: hidden"><span style="display: block; width: {{t.hp}}; height: 100%; background: {{t.hpc}}"></span></span>
    </sc-for>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 168px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 800">
    <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(0,0,0,.35); display: flex; align-items: center">Wind ← 12</span>
    <span style="height: 28px; padding: 0 10px; border-radius: 14px; background: #E3A93B; color: #3A2400; box-shadow: 0 2px 0 #A86F12; display: flex; align-items: center">Big shot · 2 left</span>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 54px; display: flex; align-items: center; justify-content: space-between">
    <a href="Thread.dc.html" aria-label="Back to chat" style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>Chat</a>
    <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{modeBg}}; box-shadow: 0 2px 0 rgba(0,0,0,.35); font-size: 12px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: center">{{modeLabel}}</span>
    <a href="GameMenu.dc.html" aria-label="Game menu" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </a>
  </div>
  <div style="position: absolute; left: 50%; top: 106px; transform: translateX(-50%); height: 46px; padding: 0 16px 0 12px; border-radius: 23px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; gap: 8px; white-space: nowrap"><div style="display: flex"><div style="margin-left: -8px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.4)"><dc-import name="Avatar" size="34" skin="#F1C27D" hair="#1C1714" hair-style="waves" bg="#FFC857" shirt="#1F2937" hint-size="34px,34px"></dc-import></div></div><span style="font-size: 13px; font-weight: 800">Bayo · 45% armour</span></div>
  <div style="position: absolute; left: 14px; right: 14px; bottom: 30px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 30px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14)">
    <div style="position: relative; flex-shrink: 0"><dc-import name="Avatar" size="42" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#C9B8FF" shirt="#6E4BFF" hint-size="42px,42px"></dc-import><span style="position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #E3A93B; border-right-color: transparent"></span></div>
    <div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 800">Angle 42° · power 68%</div><div style="font-size: 12px; opacity: .82">Drag to aim · wind pushes left</div></div>
    <button style="height: 50px; padding: 0 18px; border-radius: 25px; border: none; background: #C93E1C; box-shadow: 0 4px 0 #8A2410, inset 0 2px 0 rgba(255,255,255,.25); color: #FFFFFF; font: 900 15px Figtree, sans-serif; flex-shrink: 0">Fire</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["pool","free"],"default":"pool"},"$preview":{"width":390,"height":844}}'>
const POT='₦1,000', MULTI=false;
function poly(pts){ return 'polygon(' + pts.map(function(p){ return p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px'; }).join(', ') + ')'; }
function rnd(seed){ var x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

function scene(){
  const arc=[], p0=[100,592], p1=[200,330], p2=[300,560];
  for(let i=1;i<=14;i++){ const t=i/15, x=(1-t)*(1-t)*p0[0]+2*(1-t)*t*p1[0]+t*t*p2[0], y=(1-t)*(1-t)*p0[1]+2*(1-t)*t*p1[1]+t*t*p2[1]; arc.push({x:(x-3)+'px',y:(y-3)+'px',o:(0.9-t*0.5).toFixed(2)}); }
  return {arc:arc, tanks:[
    {x:'40px',y:'566px',flip:'1',tilt:'-6deg',ang:'-42deg',turret:'linear-gradient(#F07A4A, #C93E1C)',body:'linear-gradient(#E0582E, #8A2410)',hx:'47px',hy:'548px',hp:'80%',hpc:'#2BB673'},
    {x:'282px',y:'540px',flip:'-1',tilt:'4deg',ang:'-30deg',turret:'linear-gradient(#6FA8F5, #2457D6)',body:'linear-gradient(#3D7BE0, #1B3F8F)',hx:'289px',hy:'522px',hp:'45%',hpc:'#E3A93B'}]};
}
class Component extends DCLogic {
  renderVals() {
    const pool = this.props.mode !== 'free';
    return Object.assign({ modeLabel: pool ? (MULTI ? 'SPACE POOL · ' : 'POOL · ') + POT + ' POT' : (MULTI ? 'FREE SPACE · XP' : 'FREE · +25 XP'), modeBg: pool ? '#C93E1C' : '#17834F' }, scene(this.props, this));
  }
}
</script>
</body>
</html>
