<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Hills and bounties</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px">
    <a href="Space.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; color: {{c.brandText}}; font-size: 17px; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Space</a>
    <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #C93E1C; color: #fff; font: 700 14px Figtree, sans-serif">Claim a hill</button>
  </div>
  <h1 style="margin: 4px 16px 2px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.6px">King of the Hill</h1>
  <p style="margin: 0 16px; font-size: 14px; line-height: 1.45; color: {{c.sub}}">Someone holds the hill. Beat them and you take their place{{suffix}}</p>

  <div style="margin: 12px 16px 0; padding: 3px; border-radius: 12px; background: {{c.field}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">
    <button onClick="{{toPool}}" style="height: 36px; border-radius: 9px; border: none; font: 600 14px Figtree, sans-serif; background: {{poolBg}}; color: {{c.text}}">Pool hills</button>
    <button onClick="{{toFree}}" style="height: 36px; border-radius: 9px; border: none; font: 600 14px Figtree, sans-serif; background: {{freeBg}}; color: {{c.text}}">Free hills</button>
  </div>

  <div style="margin: 14px 16px 0; border-radius: 26px; padding: 16px; background: {{hero.bg}}; color: #fff; position: relative; overflow: hidden">
    <div style="position: absolute; right: -30px; bottom: -40px; width: 180px; height: 120px; border-radius: 50% 50% 0 0; background: rgba(255,255,255,.10)" aria-hidden="true"></div>
    <div style="display: flex; align-items: center; gap: 12px; position: relative">
      <div style="position: relative">
        <dc-import name="Avatar" size="64" skin="#5C3A21" hair="#111111" hair-style="short" bg="#8FD3FF" shirt="#0E9F6E" hint-size="64px,64px"></dc-import>
        <svg width="30" height="20" viewBox="0 0 40 26" style="position: absolute; left: 17px; top: -14px" aria-hidden="true"><path d="M3 24 L6 6 L14 15 L20 2 L26 15 L34 6 L37 24 Z" fill="#FFC857" stroke="#B37A00" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div style="flex: 1">
        <div style="font-size: 12px; font-weight: 700; opacity: .85">SEA BATTLE · HELD 2 DAYS</div>
        <div style="font-size: 18px; font-weight: 800">@lagos_shark</div>
        <div style="font-size: 13px; opacity: .9">{{hero.record}}</div>
      </div>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-top: 16px; position: relative">
      <div>
        <div style="font-size: 12px; font-weight: 700; opacity: .85">{{hero.label}}</div>
        <div style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -1px; line-height: 1">{{hero.value}}</div>
      </div>
      <button style="height: 46px; padding: 0 18px; border-radius: 14px; border: none; background: #fff; color: #3A150A; font: 800 15px Figtree, sans-serif">{{hero.cta}}</button>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 8px 16px 0">
    <sc-for list="{{hills}}" as="h" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; height: 70px; border-bottom: 1px solid {{c.line}}">
        <dc-import name="Avatar" size="46" skin="{{h.skin}}" hair="{{h.hair}}" hair-style="{{h.hs}}" bg="{{h.bg}}" shirt="{{h.shirt}}" hint-size="46px,46px"></dc-import>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 700">{{h.game}} <span style="font-weight: 500; color: {{c.sub}}">· {{h.handle}}</span></div>
          <div style="font-size: 13px; color: {{c.sub}}">{{h.meta}}</div>
        </div>
        <div style="text-align: right">
          <div style="font-size: 15px; font-weight: 800; color: {{h.valColor}}">{{h.value}}</div>
          <div style="font-size: 11px; color: {{c.sub}}">{{h.entry}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin: 0 16px 34px; padding: 12px 14px; border-radius: 16px; background: {{c.bg2}}; font-size: 12px; line-height: 1.5; color: {{c.sub}}">{{rule}}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F2ECE3',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',field:'#EEE7DC',card:'#FFFFFF',brandText:'#B33416',money:'#0E7C47',free:'#0E7C47'},
dark:{bg:'#0F0D0B',bg2:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',field:'#1D1916',card:'#2E2823',brandText:'#FF8F6B',money:'#3DDC84',free:'#3DDC84'}};
const A=[
 {skin:'#A0662F',hair:'#3B2219',hs:'long',bg:'#FFB4C6',shirt:'#FFB020'},
 {skin:'#F1C27D',hair:'#1C1714',hs:'waves',bg:'#FFC857',shirt:'#1F2937'},
 {skin:'#8D5524',hair:'#B7412E',hs:'afro',bg:'#B8F2C8',shirt:'#E0453A'},
 {skin:'#C68642',hair:'#2A1A12',hs:'bun',bg:'#C9B8FF',shirt:'#C93E1C'}
];
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { mode: 'pool' }; }
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const pool = this.state.mode === 'pool';
    const mk = (a, game, handle, poolMeta, poolVal, entry, freeMeta, freeVal) => Object.assign({ game, handle, meta: pool ? poolMeta : freeMeta, value: pool ? poolVal : freeVal, entry: pool ? entry : 'free to try', valColor: pool ? c.money : c.text }, a);
    return {
      c,
      suffix: pool ? '. Every try adds your stake to the pot.' : '. No money, just the crown and the bragging rights.',
      poolBg: pool ? c.card : 'transparent', freeBg: pool ? 'transparent' : c.card,
      toPool: () => this.setState({ mode: 'pool' }), toFree: () => this.setState({ mode: 'free' }),
      hero: pool
        ? { bg: 'radial-gradient(circle at 85% 10%, #F07A4A, #A8321A 55%, #4A150A)', record: '17 tried · nobody has beaten them yet', label: 'POT RIGHT NOW', value: '₦18,500', cta: 'Try · ₦1,000' }
        : { bg: 'radial-gradient(circle at 85% 10%, #3DDC84, #13985A 55%, #06502E)', record: '41 tried · held the crown 2 days', label: 'DEFENCES', value: '41 wins', cta: 'Try free' },
      hills: [
        mk(A[0], 'Doodle Guess', '@ngozi.k', '9 tries · 3h left', '₦4,800', '₦300 a try', '22 defences', '22 wins'),
        mk(A[1], 'Word Hunt', '@bayo_spins', '31 tries · 1 day left', '₦31,000', '₦1,000 a try', '8 defences', '8 wins'),
        mk(A[2], '8 Ball', '@redhead.ade', '4 tries · new today', '₦2,400', '₦500 a try', '3 defences', '3 wins'),
        mk(A[3], 'Cup Pong', '@zee', '12 tries · 6h left', '₦7,200', '₦500 a try', '60 defences', '60 wins')
      ],
      rule: pool
        ? 'The holder stakes once to claim the hill. Each challenger stakes to try; a loss adds their stake to the pot. Win and you take the whole pot plus the hill. Hills close after 3 days and the holder keeps the pot.'
        : 'Free hills never touch your cash. Beat the holder to take the crown; the longest reign each week earns a profile badge and 500 XP.'
    };
  }
}
</script>
</body>
</html>
