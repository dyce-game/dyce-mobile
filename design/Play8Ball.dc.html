<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — 8 Ball in 3D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; color: #FFFFFF; background: radial-gradient(ellipse 90% 45% at 50% 38%, #3A2A1A 0%, #1A120C 55%, #0B0806 100%)">
  <div role="img" aria-label="Pool table from behind the cue ball. Amaka on solids, you on stripes." style="position: absolute; inset: 0">
    <span style="position: absolute; inset: 0; clip-path: {{t.shadow}}; background: rgba(0,0,0,.55); filter: blur(10px)"></span>
    <span style="position: absolute; inset: 0; clip-path: {{t.rail}}; background: linear-gradient(#3B2111, #6B3A1C 40%, #4A2814)"></span>
    <span style="position: absolute; inset: 0; clip-path: {{t.rail}}; background: repeating-linear-gradient(100deg, rgba(255,255,255,.03) 0 3px, transparent 3px 9px)"></span>
    <span style="position: absolute; inset: 0; clip-path: {{t.cushion}}; background: #0C5A38"></span>
    <span style="position: absolute; inset: 0; clip-path: {{t.felt}}; background: #13824F"></span>
    <span style="position: absolute; inset: 0; clip-path: {{t.felt}}; background: radial-gradient(ellipse 55% 38% at 50% 52%, rgba(255,240,200,.32), transparent 72%), repeating-radial-gradient(circle at 30% 40%, rgba(0,0,0,.025) 0 1px, transparent 1px 3px)"></span>
    <span style="position: absolute; inset: 0; clip-path: {{t.head}}; background: rgba(255,255,255,.35)"></span>
    <sc-for list="{{diamonds}}" as="m" hint-placeholder-count="8">
      <span style="position: absolute; left: {{m.x}}; top: {{m.y}}; width: {{m.s}}; height: {{m.s}}; transform: rotate(45deg); background: #F3E3C0; border-radius: 1px"></span>
    </sc-for>
    <sc-for list="{{pockets}}" as="p" hint-placeholder-count="6">
      <span style="position: absolute; left: {{p.x}}; top: {{p.y}}; width: {{p.w}}; height: {{p.h}}; border-radius: 50%; background: radial-gradient(ellipse at 50% 35%, #000 55%, #2A1A10 100%); box-shadow: 0 0 0 3px #2A1A10"></span>
    </sc-for>

    <span style="position: absolute; inset: 0; clip-path: {{aim.line}}; background: rgba(255,255,255,.75)"></span>
    <span style="position: absolute; inset: 0; clip-path: {{aim.pred}}; background: rgba(255,255,255,.4)"></span>
    <span style="position: absolute; left: {{aim.gx}}; top: {{aim.gy}}; width: {{aim.gs}}; height: {{aim.gs}}; border-radius: 50%; border: 2px dashed rgba(255,255,255,.85); box-sizing: border-box"></span>

    <sc-for list="{{balls}}" as="b" hint-placeholder-count="12">
      <span style="position: absolute; left: {{b.shx}}; top: {{b.shy}}; width: {{b.shw}}; height: {{b.shh}}; border-radius: 50%; background: rgba(0,0,0,.45); filter: blur(2px)"></span>
      <span style="position: absolute; left: {{b.x}}; top: {{b.y}}; width: {{b.s}}; height: {{b.s}}; border-radius: 50%; background: {{b.base}}; overflow: hidden">
        <span style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.95) 0 9%, rgba(255,255,255,.25) 22%, transparent 45%), radial-gradient(circle at 60% 70%, transparent 40%, rgba(0,0,0,.5) 100%)"></span>
      </span>
    </sc-for>

    <div style="position: absolute; left: {{cue.x}}; top: {{cue.y}}; width: 16px; height: 470px; transform-origin: 50% 0; transform: translateX(-50%) rotate({{cue.a}})">
      <span style="position: absolute; left: 0; right: 0; top: 18px; bottom: 0; clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); background: linear-gradient(#2F6BEA 0 1.2%, #F4ECDC 1.2% 4%, #E9C98F 4% 58%, #2A1408 58% 62%, #7A1E12 62% 64%, #3B1C0C 64% 100%)"></span>
      <span style="position: absolute; left: 0; right: 0; top: 18px; bottom: 0; clip-path: polygon(38% 0, 50% 0, 50% 100%, 0 100%); background: rgba(255,255,255,.18)"></span>
    </div>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; top: 54px; display: flex; align-items: center; justify-content: space-between">
    <a href="Thread.dc.html" aria-label="Back to chat" style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>Chat</a>
    <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{modeBg}}; box-shadow: 0 2px 0 rgba(0,0,0,.35); font-size: 12px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: center">{{modeLabel}}</span>
    <a href="GameMenu.dc.html" aria-label="Game menu" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </a>
  </div>
  <div style="position: absolute; left: 50%; top: 106px; transform: translateX(-50%); height: 46px; padding: 0 14px 0 4px; border-radius: 23px; background: rgba(0,0,0,.4); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; gap: 8px; white-space: nowrap">
    <dc-import name="Avatar" size="38" skin="#8D5524" hair="#1C1714" hair-style="bun" bg="#FFC857" shirt="#E0453A" hint-size="38px,38px"></dc-import>
    <span style="font-size: 13px; font-weight: 800">Amaka</span>
    <span style="display: flex; gap: 3px"><sc-for list="{{solidsLeft}}" as="c" hint-placeholder-count="5"><span style="width: 11px; height: 11px; border-radius: 50%; background: {{c}}"></span></sc-for></span>
  </div>

  <div style="position: absolute; left: 14px; right: 14px; bottom: 30px; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 26px; background: rgba(0,0,0,.42); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.12)">
    <div style="position: relative; flex-shrink: 0">
      <dc-import name="Avatar" size="42" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#C9B8FF" shirt="#6E4BFF" hint-size="42px,42px"></dc-import>
      <span style="position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #E3A93B; border-right-color: transparent"></span>
    </div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 14px; font-weight: 800">Your shot · stripes</div>
      <div style="height: 10px; border-radius: 5px; background: rgba(255,255,255,.14); margin-top: 6px; overflow: hidden"><div style="width: 62%; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #2BB673, #E3A93B 70%, #C93E1C)"></div></div>
      <div style="font-size: 11px; opacity: .8; margin-top: 4px">Pull back for power · 0:24</div>
    </div>
    <button aria-label="Spin" style="width: 48px; height: 48px; border-radius: 50%; border: none; padding: 0; background: radial-gradient(circle at 35% 30%, #fff, #E6E1D8 60%, #A8A196); box-shadow: 0 3px 0 rgba(0,0,0,.4); position: relative">
      <span style="position: absolute; left: 28px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: #C93E1C"></span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["free","pool"],"default":"free"},"$preview":{"width":390,"height":844}}'>
const CX = 195;
function S(d){ return 1 / (1.6 - 0.6 * d); }
function Y(d){ return -777 + 1547 * S(d); }
function W(d){ return 400 * S(d); }
function X(d, u){ return CX + u * W(d); }
function P(d, u){ return [X(d, u), Y(d)]; }
function poly(pts){ return 'polygon(' + pts.map((p) => p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px').join(', ') + ')'; }
function quad(u0, u1, d0, d1){ return poly([P(d0,u0), P(d0,u1), P(d1,u1), P(d1,u0)]); }
function seg(a, b, w){ const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx, dy), nx = -dy / L * w / 2, ny = dx / L * w / 2; return poly([[a[0]+nx,a[1]+ny],[b[0]+nx,b[1]+ny],[b[0]-nx,b[1]-ny],[a[0]-nx,a[1]-ny]]); }
const solid = (c) => 'radial-gradient(circle at 50% 50%, ' + c + ', ' + c + ')';
const stripe = (c) => 'linear-gradient(#F6F2EA 0 28%, ' + c + ' 28% 72%, #F6F2EA 72%)';
class Component extends DCLogic {
  renderVals() {
    const pool = this.props.mode === 'pool';
    const BALLS = [
      [-0.06, 0.18, solid('#F5C518')], [0.02, 0.15, stripe('#2457D6')], [0.1, 0.2, solid('#6B2FB3')],
      [-0.18, 0.3, stripe('#E0453A')], [0.04, 0.26, solid('#111111')], [0.3, 0.12, stripe('#1E8E5A')],
      [-0.08, 0.45, solid('#E0453A')], [0.28, 0.5, stripe('#FF7A1A')], [-0.36, 0.62, solid('#1E8E5A')],
      [0.38, 0.7, stripe('#8A2B2B')], [-0.3, 0.86, stripe('#6B2FB3')], [0.05, 0.82, solid('#F6F2EA')]
    ];
    const balls = BALLS.map(([u, d, base]) => {
      const r = 0.032 * W(d), [x, y] = P(d, u);
      return { x: (x - r) + 'px', y: (y - 2 * r) + 'px', s: (2 * r) + 'px', base, shx: (x - r * 1.05) + 'px', shy: (y - r * 0.35) + 'px', shw: (r * 2.3) + 'px', shh: (r * 0.8) + 'px' };
    });
    const cue = P(0.82, 0.05), rc = 0.032 * W(0.82); cue[1] -= rc;
    const obj = P(0.45, -0.08), ro = 0.032 * W(0.45); obj[1] -= ro;
    const pocket = P(0, -0.5);
    const vx = obj[0] - pocket[0], vy = obj[1] - pocket[1], vl = Math.hypot(vx, vy);
    const ghost = [obj[0] + vx / vl * ro * 1.9, obj[1] + vy / vl * ro * 1.9];
    const deg = Math.atan2(-(cue[0] - ghost[0]), cue[1] - ghost[1]) * 180 / Math.PI;
    const pk = [[0,-0.5],[0,0.5],[0.5,-0.52],[0.5,0.52],[1,-0.5],[1,0.5]].map(([d,u]) => { const [x,y] = P(d,u), w = 0.1 * W(d), h = w * 0.55; return { x: (x - w/2) + 'px', y: (y - h/2) + 'px', w: w + 'px', h: h + 'px' }; });
    const dm = [];
    [0.25, 0.75].forEach((d) => { [-0.535, 0.535].forEach((u) => { const [x,y] = P(d,u), s = 5 * S(d); dm.push({ x: (x - s/2) + 'px', y: (y - s/2) + 'px', s: s + 'px' }); }); });
    [-0.25, 0, 0.25].forEach((u) => { [[-0.03],[1.03]].forEach(([d]) => { const [x,y] = P(d,u), s = 5 * S(Math.max(0, Math.min(1, d))); dm.push({ x: (x - s/2) + 'px', y: (y - s/2) + 'px', s: s + 'px' }); }); });
    return {
      modeLabel: pool ? 'POOL · ₦2,000 POT' : 'FREE · +25 XP', modeBg: pool ? '#C93E1C' : '#17834F',
      t: { rail: quad(-0.6, 0.6, -0.07, 1.06), cushion: quad(-0.53, 0.53, -0.03, 1.03), felt: quad(-0.5, 0.5, 0, 1), head: quad(-0.5, 0.5, 0.749, 0.753), shadow: quad(-0.64, 0.64, -0.02, 1.12) },
      pockets: pk, diamonds: dm, balls,
      aim: { line: seg(cue, ghost, 2), pred: seg(obj, [obj[0] - vx / vl * 90, obj[1] - vy / vl * 90], 2), gx: (ghost[0] - ro) + 'px', gy: (ghost[1] - ro) + 'px', gs: (2 * ro) + 'px' },
      cue: { x: cue[0] + 'px', y: (cue[1] + rc * 0.2) + 'px', a: deg + 'deg' },
      solidsLeft: ['#F5C518', '#6B2FB3', '#111111', '#E0453A', '#1E8E5A']
    };
  }
}
</script>
</body>
</html>
