<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Friends</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px">
    <a href="Profile.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; color: {{c.brandText}}; font-size: 17px; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Profile</a>
    <a href="NewChat.dc.html" style="height: 36px; padding: 0 14px; border-radius: 999px; background: #C93E1C; color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; text-decoration: none">Add friends</a>
  </div>
  <h1 style="margin: 2px 16px 10px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.6px">Friends</h1>
  <div style="margin: 0 16px; padding: 3px; border-radius: 12px; background: {{c.field}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">
    <a href="Friends.dc.html" style="height: 34px; border-radius: 9px; background: {{listBg}}; color: {{c.text}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">All · 24</a>
    <a href="FriendRequests.dc.html" style="height: 34px; border-radius: 9px; background: {{reqBg}}; color: {{c.text}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">Requests <span style="min-width: 20px; height: 20px; border-radius: 10px; background: #C93E1C; color: #fff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center">2</span></a>
  </div>

  <sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
    <div style="flex: 1; overflow: hidden; padding: 8px 16px 0">
      <sc-for list="{{friends}}" as="f" hint-placeholder-count="6">
        <div style="position: relative; height: 66px; border-bottom: 1px solid {{c.line}}; overflow: hidden">
          <sc-if value="{{f.swiped}}" hint-placeholder-val="{{false}}">
            <div style="position: absolute; right: 0; top: 0; bottom: 0; display: flex">
              <button style="width: 80px; border: none; background: #8E8E96; color: #fff; font: 700 13px Figtree, sans-serif">Mute</button>
              <button style="width: 80px; border: none; background: #C4314B; color: #fff; font: 700 13px Figtree, sans-serif">Remove</button>
            </div>
          </sc-if>
          <div style="position: absolute; left: {{f.shift}}; top: 0; width: 100%; height: 100%; display: flex; align-items: center; gap: 12px; background: {{c.bg}}">
            <div style="position: relative">
              <dc-import name="Avatar" size="46" skin="{{f.skin}}" hair="{{f.hair}}" hair-style="{{f.hs}}" bg="{{f.bg}}" shirt="{{f.shirt}}" hint-size="46px,46px"></dc-import>
              <sc-if value="{{f.online}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; border-radius: 50%; background: #2BB673; border: 3px solid {{c.bg}}"></span></sc-if>
            </div>
            <div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 600">{{f.name}}</div><div style="font-size: 12px; color: {{c.sub}}">{{f.meta}}</div></div>
            <span style="font-size: 13px; font-weight: 700; color: {{c.sub}}">{{f.rec}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isReq}}" hint-placeholder-val="{{false}}">
    <div style="padding: 14px 16px 4px; font-size: 13px; font-weight: 700; color: {{c.sub}}">Want to be friends</div>
    <div style="padding: 0 16px">
      <sc-for list="{{incoming}}" as="r" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid {{c.line}}">
          <dc-import name="Avatar" size="50" skin="{{r.skin}}" hair="{{r.hair}}" hair-style="{{r.hs}}" bg="{{r.bg}}" shirt="{{r.shirt}}" hint-size="50px,50px"></dc-import>
          <div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 700">{{r.h}}</div><div style="font-size: 12px; color: {{c.sub}}">{{r.meta}}</div></div>
          <div style="display: flex; gap: 6px">
            <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: none; background: #C93E1C; color: #fff; font: 700 13px Figtree, sans-serif">Accept</button>
            <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: none; background: {{c.field}}; color: {{c.text}}; font: 600 13px Figtree, sans-serif">Ignore</button>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="padding: 18px 16px 4px; font-size: 13px; font-weight: 700; color: {{c.sub}}">You asked</div>
    <div style="padding: 0 16px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid {{c.line}}">
        <dc-import name="Avatar" size="50" skin="#F1C27D" hair="#1C1714" hair-style="waves" bg="#FFC857" shirt="#1F2937" hint-size="50px,50px"></dc-import>
        <div style="flex: 1"><div style="font-size: 15px; font-weight: 700">@bayo_spins</div><div style="font-size: 12px; color: {{c.sub}}">Sent 2 days ago</div></div>
        <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: none; background: {{c.field}}; color: {{c.text}}; font: 600 13px Figtree, sans-serif">Cancel</button>
      </div>
    </div>
    <div style="margin: 16px; padding: 12px 14px; border-radius: 16px; background: {{c.bg2}}; font-size: 13px; line-height: 1.45; color: {{c.sub}}">Friends can send you games directly to Chats, request Dyce Cash and see when you're active. Everyone else goes to Requests.</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["list","requests"],"default":"list"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F2ECE3',card:'#FFFFFF',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',field:'#EEE7DC',brandText:'#B33416'},dark:{bg:'#0F0D0B',bg2:'#1D1916',card:'#2E2823',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',field:'#1D1916',brandText:'#FF8F6B'}};
const F=[
 ['Amaka Obi','Playing 8 Ball with you','7 – 5',true,{skin:'#8D5524',hair:'#1C1714',hs:'bun',bg:'#FFC857',shirt:'#E0453A'}],
 ['Tunde Bakare','Active now','4 – 6',true,{skin:'#5C3A21',hair:'#111111',hs:'waves',bg:'#8FD3FF',shirt:'#1F2937'}],
 ['Zainab M.','3h ago','5 – 3',false,{skin:'#C68642',hair:'#2A1A12',hs:'long',bg:'#B8F2C8',shirt:'#C93E1C'}],
 ['Ifeoma N.','Hosting a space','2 – 2',true,{skin:'#A0662F',hair:'#3B2219',hs:'afro',bg:'#FFB4C6',shirt:'#0E9F6E'}],
 ['Dayo','Yesterday','1 – 4',false,{skin:'#F1C27D',hair:'#7A4A2A',hs:'short',bg:'#C9B8FF',shirt:'#FFB020'}],
 ['Femi O.','Last week','0 – 0',false,{skin:'#8D5524',hair:'#B7412E',hs:'short',bg:'#ECE4D8',shirt:'#0E9F6E'}]
];
class Component extends DCLogic {
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const req = this.props.variant === 'requests';
    return {
      c, isList: !req, isReq: req,
      listBg: req ? 'transparent' : c.card, reqBg: req ? c.card : 'transparent',
      friends: F.map(([name, meta, rec, online, a], i) => Object.assign({ name, meta, rec, online, swiped: i === 4, shift: i === 4 ? '-160px' : '0' }, a)),
      incoming: [
        { h: '@ngozi.k', meta: 'Played Doodle Guess with you · 2 mutual', skin: '#A0662F', hair: '#3B2219', hs: 'long', bg: '#FFB4C6', shirt: '#FFB020' },
        { h: '@redhead.ade', meta: 'From Space · 0 mutual', skin: '#8D5524', hair: '#B7412E', hs: 'afro', bg: '#B8F2C8', shirt: '#E0453A' }
      ]
    };
  }
}
</script>
</body>
</html>
