<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Games drawer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 320px; padding-top: 54px; box-sizing: border-box" aria-hidden="true">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid {{c.line}}; background: {{c.bg2}}">
      <dc-import name="Avatar" size="46" skin="#8D5524" hair="#1C1714" hair-style="bun" bg="#FFC857" shirt="#E0453A" hint-size="46px,46px"></dc-import>
      <div style="font-size: 12px; font-weight: 600">Amaka</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 14px">
      <div style="align-self: flex-end; padding: 9px 14px; border-radius: 20px; border-bottom-right-radius: 6px; background: #C93E1C; color: #fff; font-size: 16px">dodging? I was warming up</div>
      <div style="align-self: flex-start; padding: 9px 14px; border-radius: 20px; border-bottom-left-radius: 6px; background: {{c.recv}}; font-size: 16px">bet. pick something</div>
    </div>
  </div>
  <a href="Thread.dc.html" aria-label="Close games" style="position: absolute; inset: 0; background: rgba(0,0,0,.32)"></a>

  <section aria-label="Games" style="position: absolute; left: 0; right: 0; bottom: 0; height: 620px; border-radius: 26px 26px 0 0; background: {{c.bg}}; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.18)">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: {{c.line}}; align-self: center; margin-top: 8px"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 0">
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.4px">Games</h2>
      <div style="display: flex; gap: 4px">
        <button aria-label="Search games" style="width: 40px; height: 40px; border-radius: 50%; border: none; background: {{c.field}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
      </div>
    </div>
    <div style="display: flex; gap: 8px; padding: 12px 16px 10px; overflow-x: auto; flex-shrink: 0">
      <sc-for list="{{cats}}" as="k" hint-placeholder-count="5">
        <button onClick="{{k.pick}}" style="height: 34px; padding: 0 14px; border-radius: 999px; border: none; flex-shrink: 0; font: 600 14px Figtree, sans-serif; background: {{k.bgc}}; color: {{k.fg}}">{{k.label}}</button>
      </sc-for>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 2px 16px 12px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{games}}" as="g" hint-placeholder-count="4">
          <button onClick="{{g.pick}}" style="border: 3px solid {{g.ring}}; border-radius: 20px; padding: 0; overflow: hidden; background: {{c.bg2}}; text-align: left; color: {{c.text}}; font-family: Figtree, sans-serif; box-sizing: border-box">
            <div style="height: 104px; position: relative; overflow: hidden; background: {{g.bg}}">
              <sc-for list="{{g.shapes}}" as="s" hint-placeholder-count="3">
                <span style="position: absolute; left: {{s.x}}; top: {{s.y}}; width: {{s.w}}; height: {{s.h}}; border-radius: {{s.r}}; background: {{s.c}}; transform: {{s.rot}}; color: {{s.tc}}; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: {{s.sh}}">{{s.t}}</span>
              </sc-for>
              <span style="position: absolute; right: 8px; bottom: 8px; height: 22px; padding: 0 8px 0 6px; border-radius: 11px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>{{g.dur}}
              </span>
              <sc-if value="{{g.space}}" hint-placeholder-val="{{false}}">
                <span style="position: absolute; left: 8px; top: 8px; height: 20px; padding: 0 8px; border-radius: 10px; background: #FFFFFF; color: #1B140F; font-size: 10px; font-weight: 800; display: flex; align-items: center; letter-spacing: 0.3px">SPACE</span>
              </sc-if>
            </div>
            <div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 700">{{g.name}}</span>
              <span style="font-size: 12px; color: {{c.sub}}">{{g.meta}}</span>
              <span style="display: flex; gap: 4px; margin-top: 4px">
                <span style="height: 18px; padding: 0 6px; border-radius: 5px; background: {{c.freeSoft}}; color: {{c.free}}; font-size: 10px; font-weight: 800; display: flex; align-items: center">FREE</span>
                <span style="height: 18px; padding: 0 6px; border-radius: 5px; background: {{c.brandSoft}}; color: {{c.brandText}}; font-size: 10px; font-weight: 800; display: flex; align-items: center">POOL {{g.from}}+</span>
              </span>
            </div>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="padding: 10px 16px 34px; border-top: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sel.name}}</div>
          <div style="font-size: 13px; font-weight: 600; color: {{sel.subColor}}">{{sel.sub}}</div>
        </div>
        <div style="padding: 3px; border-radius: 12px; background: {{c.field}}; display: flex; gap: 3px">
          <button onClick="{{toFree}}" style="height: 34px; padding: 0 14px; border-radius: 9px; border: none; font: 700 14px Figtree, sans-serif; background: {{sel.freeBg}}; color: {{sel.freeFg}}">Free</button>
          <button onClick="{{toPool}}" style="height: 34px; padding: 0 14px; border-radius: 9px; border: none; font: 700 14px Figtree, sans-serif; background: {{sel.poolBg}}; color: {{sel.poolFg}}">Pool</button>
        </div>
      </div>
      <a href="{{sel.href}}" style="height: 50px; border-radius: 14px; background: {{sel.ctaBg}}; color: #fff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">{{sel.cta}}</a>
    </div>
  </section>
</div>
</x-dc>

const CATS=[['all','All'],['party','Party'],['board','Board'],['sports','Sports'],['word','Word'],['cards','Cards'],['space','Spaces 3+'],['arcade','Arcade']];
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { cat: 'all', picked: '8 Ball', mode: 'pool' }; }
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const s = this.state;
    const list = GAMES.filter((g) => s.cat === 'all' || g.cats.indexOf(s.cat) >= 0);
    const g0 = GAMES.find((g) => g.name === s.picked) || GAMES[0];
    return {
      c,
      cats: CATS.map(([id, label]) => ({ label, bgc: s.cat === id ? c.ink : c.field, fg: s.cat === id ? c.inkText : c.text, pick: () => this.setState({ cat: id }) })),
      games: list.map((g) => Object.assign({}, g, { space: !!g.space, ring: g.name === s.picked ? '#C93E1C' : 'transparent', pick: () => this.setState({ picked: g.name }) })),
      toFree: () => this.setState({ mode: 'free' }), toPool: () => this.setState({ mode: 'pool' }),
      sel: (function(){
        const pool = s.mode === 'pool';
        return {
          name: g0.name,
          sub: pool ? (g0.space ? 'Pool · entry from ' + g0.from + ' a seat' : 'Pool · stakes from ' + g0.from) : 'Free · XP and streaks, no cash',
          subColor: pool ? c.brandText : c.free,
          freeBg: pool ? 'transparent' : c.bg, freeFg: pool ? c.sub : c.free,
          poolBg: pool ? c.bg : 'transparent', poolFg: pool ? c.brandText : c.sub,
          cta: g0.space ? (pool ? 'Set up pool space' : 'Set up free space') : (pool ? 'Choose stake' : 'Send free game'),
          ctaBg: pool ? '#C93E1C' : '#0E7C47',
          href: g0.space ? 'CreateRoom.dc.html' : (pool ? 'ModeSheet.dc.html' : g0.play)
        };
      })()
    };
  }
}
