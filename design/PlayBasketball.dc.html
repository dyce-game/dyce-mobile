<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Basketball in 3D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; color: #FFFFFF; background: linear-gradient(#0E1424 0%, #1C2440 45%, #0B0F1C 60%)">
  <span style="position: absolute; inset: 0; background: radial-gradient(ellipse 60% 35% at 50% 25%, rgba(255,230,180,.35), transparent 70%)" aria-hidden="true"></span>
  <span style="position: absolute; left: 0; right: 0; top: 160px; height: 40px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 6px, transparent 6px 14px)" aria-hidden="true"></span>
  <div role="img" aria-label="Basketball hoop ahead, ball in your hands, shot arc to the rim" style="position: absolute; inset: 0">
    <span style="position: absolute; inset: 0; clip-path: polygon(110px 500px, 280px 500px, 470px 844px, -80px 844px); background: repeating-linear-gradient(90deg, #C98A4E 0 18px, #B87A40 18px 19px, #D49658 19px 37px, #B87A40 37px 38px)"></span>
    <span style="position: absolute; inset: 0; clip-path: polygon(110px 500px, 280px 500px, 470px 844px, -80px 844px); background: linear-gradient(rgba(0,0,0,.35), transparent 40%, rgba(255,240,210,.12))"></span>
    <span style="position: absolute; inset: 0; clip-path: polygon(158px 500px, 232px 500px, 268px 640px, 122px 640px); background: rgba(201,62,28,.55)"></span>
    <span style="position: absolute; left: 70px; top: 560px; width: 250px; height: 70px; border-radius: 50%; border: 3px solid rgba(255,255,255,.75); border-top-color: transparent"></span>
    <span style="position: absolute; left: 189px; top: 330px; width: 12px; height: 175px; background: linear-gradient(90deg, #3A3A3A, #777, #2A2A2A)"></span>
    <span style="position: absolute; left: 105px; top: 200px; width: 180px; height: 116px; border-radius: 6px; background: rgba(255,255,255,.88); box-shadow: 0 0 0 5px #F6F2EA, 0 10px 20px rgba(0,0,0,.4), inset 0 0 30px rgba(180,220,255,.5)"></span>
    <span style="position: absolute; left: 163px; top: 252px; width: 64px; height: 46px; border: 4px solid #C93E1C; border-bottom: none; box-sizing: border-box"></span>
    <span style="position: absolute; left: 165px; top: 316px; width: 60px; height: 52px; clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%); background: repeating-linear-gradient(60deg, rgba(255,255,255,.9) 0 2px, transparent 2px 9px), repeating-linear-gradient(-60deg, rgba(255,255,255,.9) 0 2px, transparent 2px 9px)"></span>
    <span style="position: absolute; left: 158px; top: 306px; width: 74px; height: 18px; border-radius: 50%; border: 5px solid #E8701E; box-sizing: border-box; box-shadow: 0 3px 0 #9A3E08"></span>
    <sc-for list="{{arc}}" as="a" hint-placeholder-count="12">
      <span style="position: absolute; left: {{a.x}}; top: {{a.y}}; width: {{a.s}}; height: {{a.s}}; border-radius: 50%; background: rgba(255,255,255,{{a.o}})"></span>
    </sc-for>
    <span style="position: absolute; left: 120px; top: 760px; width: 150px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.35); filter: blur(5px)"></span>
    <div style="position: absolute; left: 130px; top: 610px; width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFB27A, #E8701E 45%, #9A3E08); box-shadow: inset -10px -14px 20px rgba(0,0,0,.25)">
      <svg viewBox="0 0 100 100" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><g fill="none" stroke="#2A1408" stroke-width="2.6"><path d="M50 0 V100"/><path d="M0 50 H100"/><path d="M15 12 C40 35 40 65 15 88"/><path d="M85 12 C60 35 60 65 85 88"/></g></svg>
    </div>
  </div>
  <div style="position: absolute; left: 50%; top: 162px; transform: translateX(-50%); display: flex; gap: 6px">
    <span style="height: 30px; padding: 0 12px; border-radius: 8px; background: #111; color: #FF5A3C; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800; display: flex; align-items: center; letter-spacing: 1px">12</span>
    <span style="height: 30px; padding: 0 12px; border-radius: 8px; background: #111; color: #FFD27A; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800; display: flex; align-items: center">0:24</span>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 54px; display: flex; align-items: center; justify-content: space-between">
    <a href="Thread.dc.html" aria-label="Back to chat" style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>Chat</a>
    <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{modeBg}}; box-shadow: 0 2px 0 rgba(0,0,0,.35); font-size: 12px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: center">{{modeLabel}}</span>
    <a href="GameMenu.dc.html" aria-label="Game menu" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </a>
  </div>
  <div style="position: absolute; left: 50%; top: 106px; transform: translateX(-50%); height: 46px; padding: 0 16px 0 12px; border-radius: 23px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; gap: 8px; white-space: nowrap"><div style="display: flex"><div style="margin-left: -8px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.4)"><dc-import name="Avatar" size="34" skin="#5C3A21" hair="#111111" hair-style="waves" bg="#8FD3FF" shirt="#1F2937" hint-size="34px,34px"></dc-import></div></div><span style="font-size: 13px; font-weight: 800">Tunde · scored 14</span></div>
  <div style="position: absolute; left: 14px; right: 14px; bottom: 30px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 30px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14)">
    <div style="position: relative; flex-shrink: 0"><dc-import name="Avatar" size="42" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#C9B8FF" shirt="#6E4BFF" hint-size="42px,42px"></dc-import><span style="position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #E3A93B; border-right-color: transparent"></span></div>
    <div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 800">12 in · 0:24 left · beat 14</div><div style="font-size: 12px; opacity: .82">Swipe up · moving hoop from 10</div></div>
    <button style="height: 50px; padding: 0 18px; border-radius: 25px; border: none; background: #E8701E; box-shadow: 0 4px 0 #9A3E08, inset 0 2px 0 rgba(255,255,255,.25); color: #FFFFFF; font: 900 15px Figtree, sans-serif; flex-shrink: 0">Shoot</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["pool","free"],"default":"pool"},"$preview":{"width":390,"height":844}}'>
const POT='₦2,000', MULTI=false;
function poly(pts){ return 'polygon(' + pts.map(function(p){ return p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px'; }).join(', ') + ')'; }
function rnd(seed){ var x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

function scene(){
  const arc=[], p0=[195,610], p1=[195,170], p2=[195,300];
  for(let i=1;i<=12;i++){ const t=i/13, x=(1-t)*(1-t)*p0[0]+2*(1-t)*t*p1[0]+t*t*p2[0], y=(1-t)*(1-t)*p0[1]+2*(1-t)*t*p1[1]+t*t*p2[1], s=10-t*6; arc.push({x:(x-s/2)+'px',y:(y-s/2)+'px',s:s+'px',o:(0.85-t*0.45).toFixed(2)}); }
  return {arc:arc};
}
class Component extends DCLogic {
  renderVals() {
    const pool = this.props.mode !== 'free';
    return Object.assign({ modeLabel: pool ? (MULTI ? 'SPACE POOL · ' : 'POOL · ') + POT + ' POT' : (MULTI ? 'FREE SPACE · XP' : 'FREE · +25 XP'), modeBg: pool ? '#C93E1C' : '#17834F' }, scene(this.props, this));
  }
}
</script>
</body>
</html>
