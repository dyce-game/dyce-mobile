<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg2}}; color: {{c.text}}; overflow: hidden">
  <div style="display: flex; align-items: center; height: 44px; padding: 0 12px">
    <a href="Profile.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; color: {{c.brandText}}; font-size: 17px; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Profile</a>
  </div>
  <h1 style="margin: 2px 16px 8px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.6px">Settings</h1>

  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 13px; font-weight: 600; color: {{c.sub}}; padding: 8px 4px 2px">Who can challenge me</div>
    <div style="padding: 3px; border-radius: 12px; background: {{c.field}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px">
      <sc-for list="{{who}}" as="w" hint-placeholder-count="3">
        <button onClick="{{w.pick}}" style="height: 36px; border-radius: 9px; border: none; font: 600 14px Figtree, sans-serif; background: {{w.bgc}}; color: {{c.text}}">{{w.label}}</button>
      </sc-for>
    </div>
    <div style="font-size: 12px; color: {{c.sub}}; padding: 0 4px">{{whoNote}}</div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="font-size: 13px; font-weight: 600; color: {{c.sub}}; padding: 12px 4px 2px">{{g.label}}</div>
      <div style="border-radius: 16px; background: {{c.card}}; overflow: hidden">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid {{c.line}}">
            <div style="flex: 1; padding: 7px 0">
              <div style="font-size: 15px; font-weight: 500">{{r.t}}</div>
              <sc-if value="{{r.sub}}" hint-placeholder-val="{{false}}"><div style="font-size: 12px; color: {{c.sub}}">{{r.sub}}</div></sc-if>
            </div>
            <sc-if value="{{r.isSwitch}}" hint-placeholder-val="{{true}}">
              <button onClick="{{r.toggle}}" role="switch" aria-checked="{{r.on}}" aria-label="{{r.t}}" style="width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; background: {{r.track}}; display: flex; justify-content: {{r.justify}}; flex-shrink: 0">
                <span style="width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25)"></span>
              </button>
            </sc-if>
            <sc-if value="{{r.isValue}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 15px; color: {{r.valColor}}; font-weight: 500">{{r.v}}</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 16px 34px; display: flex; flex-direction: column; gap: 4px; align-items: center">
    <div style="width: 100%; border-radius: 14px; background: {{c.card}}; overflow: hidden; margin-bottom: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <a href="EditProfile.dc.html" style="height: 46px; display: flex; align-items: center; justify-content: center; color: {{c.brandText}}; font-size: 14px; font-weight: 600; text-decoration: none">Account</a>
      <a href="BlockedList.dc.html" style="height: 46px; display: flex; align-items: center; justify-content: center; color: {{c.brandText}}; font-size: 14px; font-weight: 600; text-decoration: none; border-left: 1px solid {{c.line}}; border-right: 1px solid {{c.line}}">Blocked</a>
      <a href="Help.dc.html" style="height: 46px; display: flex; align-items: center; justify-content: center; color: {{c.brandText}}; font-size: 14px; font-weight: 600; text-decoration: none">Help &amp; legal</a>
    </div>
    <button style="width: 100%; height: 48px; border-radius: 14px; border: none; background: {{c.card}}; color: {{c.danger}}; font: 600 16px Figtree, sans-serif">Log out</button>
    <span style="font-size: 12px; color: {{c.sub}}">Dyce 1.0 · Dyce Cash is virtual and can't be withdrawn</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg2:'#F2ECE3',card:'#FFFFFF',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',field:'#E6DDD0',brandText:'#B33416',danger:'#C4314B',off:'#D8CEC1'},
dark:{bg2:'#0F0D0B',card:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',field:'#1D1916',brandText:'#FF8F6B',danger:'#FF6B81',off:'#4A423A'}};
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { who: 'everyone', space: true, online: true, strangerPools: true, freeOnly: false, turns: true, results: true }; }
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const s = this.state;
    const sw = (key, t, sub) => ({ t, sub: sub || false, isSwitch: true, isValue: false, on: s[key] ? 'true' : 'false', track: s[key] ? '#2BB673' : c.off, justify: s[key] ? 'flex-end' : 'flex-start', toggle: () => this.setState({ [key]: !s[key] }) });
    const val = (t, v, sub, color) => ({ t, v, sub: sub || false, isSwitch: false, isValue: true, valColor: color || c.sub });
    const notes = { everyone: 'Strangers’ invites land in Requests, never in Chats.', contacts: 'Only people in your contacts can send you games.', nobody: 'Nobody can challenge you. You can still send games.' };
    return {
      c,
      who: [['everyone','Everyone'],['contacts','Contacts'],['nobody','Nobody']].map(([id, label]) => ({ label, bgc: s.who === id ? c.card : 'transparent', pick: () => this.setState({ who: id }) })),
      whoNote: notes[s.who],
      groups: [
        { label: 'Privacy', rows: [sw('space', 'Show me in Space', 'Strangers can find @kemdi.plays'), sw('online', 'Show when I’m active')] },
        { label: 'Pools', rows: [val('Daily pool limit', '₦20,000', false, c.brandText), sw('strangerPools', 'Pool invites from strangers', 'Off sends them to Requests as free games'), sw('freeOnly', 'Free-only mode', 'Hide pools everywhere')] },
        { label: 'Notifications', rows: [sw('turns', 'Your turn'), sw('results', 'Pool results and refunds')] },
        { label: 'Appearance', rows: [val('Theme', 'Follows your phone', 'Light and dark switch with the device setting')] }
      ]
    };
  }
}
</script>
</body>
</html>
