<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Archery in 3D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; color: #FFFFFF; background: linear-gradient(#5AA7E0 0%, #A8D8F2 45%, #E8F4FA 52%)">
  <span style="position: absolute; left: 0; right: 0; top: 330px; height: 60px; background: radial-gradient(ellipse 30px 40px at 20px 60px, #1E4A2A 98%, transparent) 0 0 / 40px 60px repeat-x, linear-gradient(transparent 40%, #1E4A2A 40%)" aria-hidden="true"></span>
  <div role="img" aria-label="Archery field, target in the distance with two arrows in it, your bow drawn" style="position: absolute; inset: 0">
    <span style="position: absolute; inset: 0; clip-path: polygon(0 388px, 390px 388px, 390px 844px, 0 844px); background: linear-gradient(#5E9A44, #3E7A2E 50%, #2E5E22)"></span>
    <span style="position: absolute; inset: 0; clip-path: polygon(150px 388px, 240px 388px, 470px 844px, -80px 844px); background: repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 26px, transparent 26px 52px)"></span>
    <span style="position: absolute; left: 172px; top: 330px; width: 4px; height: 70px; background: #6B3E1C; transform: rotate(10deg)"></span>
    <span style="position: absolute; left: 214px; top: 330px; width: 4px; height: 70px; background: #6B3E1C; transform: rotate(-10deg)"></span>
    <span style="position: absolute; left: 152px; top: 262px; width: 86px; height: 86px; border-radius: 50%; transform: scaleX(.94); background: radial-gradient(circle, #F2C230 0 10%, #E0453A 10% 20%, #2F6BEA 20% 30%, #1B140F 30% 40%, #F6F2EA 40% 50%); box-shadow: 0 6px 10px rgba(0,0,0,.35)"></span>
    <span style="position: absolute; left: 192px; top: 300px; width: 2px; height: 16px; background: #222; transform: rotate(25deg)"></span>
    <span style="position: absolute; left: 204px; top: 286px; width: 2px; height: 14px; background: #222; transform: rotate(-20deg)"></span>
    <span style="position: absolute; left: 176px; top: 286px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); box-shadow: 0 0 0 2px rgba(0,0,0,.25)"></span>
    <span style="position: absolute; left: 330px; top: 280px; width: 3px; height: 110px; background: #DDD"></span>
    <span style="position: absolute; left: 333px; top: 282px; width: 34px; height: 22px; clip-path: polygon(0 0, 100% 50%, 0 100%); background: #E3A93B; transform: skewY(-8deg)"></span>
    <span style="position: absolute; left: 191px; top: 330px; width: 8px; height: 470px; clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); background: linear-gradient(#999 0 2%, #8A5A30 2%)"></span>
    <span style="position: absolute; left: 170px; top: 730px; width: 50px; height: 90px; clip-path: polygon(50% 0, 100% 80%, 50% 60%, 0 80%); background: linear-gradient(#FF8F6B, #C93E1C)"></span>
    <span style="position: absolute; left: 236px; top: 470px; width: 150px; height: 420px; border-radius: 50%; border-left: 14px solid #5A3418; box-sizing: border-box; box-shadow: inset 4px 0 0 #8A5A30"></span>
    <span style="position: absolute; left: 196px; top: 486px; width: 2px; height: 390px; background: rgba(255,255,255,.7); transform-origin: 0 0; transform: rotate(-6deg)"></span>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 168px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 800">
    <span style="display: flex; gap: 4px"><span style="height: 26px; padding: 0 9px; border-radius: 8px; background: #F2C230; color: #3A2400; display: flex; align-items: center">10</span><span style="height: 26px; padding: 0 9px; border-radius: 8px; background: #E0453A; display: flex; align-items: center">8</span><span style="height: 26px; width: 30px; border-radius: 8px; border: 2px dashed rgba(255,255,255,.6); box-sizing: border-box"></span></span>
    <span style="height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(0,0,0,.35); display: flex; align-items: center">Wind → 6 · 70m</span>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 54px; display: flex; align-items: center; justify-content: space-between">
    <a href="Thread.dc.html" aria-label="Back to chat" style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>Chat</a>
    <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{modeBg}}; box-shadow: 0 2px 0 rgba(0,0,0,.35); font-size: 12px; font-weight: 800; letter-spacing: 0.4px; display: flex; align-items: center">{{modeLabel}}</span>
    <a href="GameMenu.dc.html" aria-label="Game menu" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </a>
  </div>
  <div style="position: absolute; left: 50%; top: 106px; transform: translateX(-50%); height: 46px; padding: 0 16px 0 12px; border-radius: 23px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14); display: flex; align-items: center; gap: 8px; white-space: nowrap"><div style="display: flex"><div style="margin-left: -8px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.4)"><dc-import name="Avatar" size="34" skin="#A0662F" hair="#3B2219" hair-style="long" bg="#FFB4C6" shirt="#FFB020" hint-size="34px,34px"></dc-import></div></div><span style="font-size: 13px; font-weight: 800">Ngozi · 26 after 3</span></div>
  <div style="position: absolute; left: 14px; right: 14px; bottom: 30px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 30px; background: rgba(0,0,0,.38); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.14)">
    <div style="position: relative; flex-shrink: 0"><dc-import name="Avatar" size="42" skin="#8D5524" hair="#1C1714" hair-style="afro" bg="#C9B8FF" shirt="#6E4BFF" hint-size="42px,42px"></dc-import><span style="position: absolute; inset: -4px; border-radius: 50%; border: 3px solid #E3A93B; border-right-color: transparent"></span></div>
    <div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 800">Round 2 · 18 so far</div><div style="font-size: 12px; opacity: .82">Hold to steady · release to shoot</div></div>
    <button style="height: 50px; padding: 0 18px; border-radius: 25px; border: none; background: #C93E1C; box-shadow: 0 4px 0 #8A2410, inset 0 2px 0 rgba(255,255,255,.25); color: #FFFFFF; font: 900 15px Figtree, sans-serif; flex-shrink: 0">Release</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["pool","free"],"default":"free"},"$preview":{"width":390,"height":844}}'>
const POT='₦1,000', MULTI=false;
function poly(pts){ return 'polygon(' + pts.map(function(p){ return p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px'; }).join(', ') + ')'; }
function rnd(seed){ var x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }
function scene(){ return {}; }
class Component extends DCLogic {
  renderVals() {
    const pool = this.props.mode !== 'free';
    return Object.assign({ modeLabel: pool ? (MULTI ? 'SPACE POOL · ' : 'POOL · ') + POT + ' POT' : (MULTI ? 'FREE SPACE · XP' : 'FREE · +25 XP'), modeBg: pool ? '#C93E1C' : '#17834F' }, scene(this.props, this));
  }
}
</script>
</body>
</html>
