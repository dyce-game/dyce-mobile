<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Age check for pools</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Figtree, -apple-system, system-ui, sans-serif; color: {{c.text}}; background: {{c.bg}}">
  <div style="position: absolute; inset: 0" aria-hidden="true">
    <dc-import name="Games" hint-size="390px,844px"></dc-import>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.45)"></div>

  <section aria-label="Age check" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 26px 26px 0 0; background: {{c.bg}}; padding: 8px 20px 34px; display: flex; flex-direction: column">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: {{c.line}}; align-self: center"></div>
    <span style="margin-top: 18px; width: 56px; height: 56px; border-radius: 16px; background: #C93E1C; color: #fff; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center">18+</span>
    <h1 style="margin: 14px 0 6px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.4px">Pools are for adults</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: {{c.sub}}">Free games are open to everyone 13 and up. Staking Dyce Cash in pools is 18+. We ask once.</p>

    <div style="font-size: 13px; font-weight: 600; color: {{c.sub}}; margin: 18px 0 8px">Date of birth</div>
    <div style="display: grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap: 8px">
      <label for="dd" style="position: absolute; left: -9999px">Day</label>
      <input id="dd" placeholder="DD" style="height: 56px; border-radius: 14px; border: 2px solid #C93E1C; background: {{c.bg}}; color: {{c.text}}; text-align: center; font: 700 18px Figtree, sans-serif; box-sizing: border-box">
      <label for="mm" style="position: absolute; left: -9999px">Month</label>
      <input id="mm" placeholder="Month" style="height: 56px; border-radius: 14px; border: none; background: {{c.field}}; color: {{c.text}}; text-align: center; font: 600 17px Figtree, sans-serif">
      <label for="yy" style="position: absolute; left: -9999px">Year</label>
      <input id="yy" placeholder="YYYY" style="height: 56px; border-radius: 14px; border: none; background: {{c.field}}; color: {{c.text}}; text-align: center; font: 600 17px Figtree, sans-serif">
    </div>

    <div style="margin-top: 16px; border-radius: 16px; background: {{c.bg2}}; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.4">
      <div style="display: flex; gap: 10px"><b style="color: {{c.money}}; width: 48px; flex-shrink: 0">13–17</b><span>Free games, spaces, XP and badges. Pools hidden.</span></div>
      <div style="display: flex; gap: 10px"><b style="color: {{c.brandText}}; width: 48px; flex-shrink: 0">18+</b><span>Everything, with a daily pool limit you control.</span></div>
    </div>

    <button style="margin-top: 20px; height: 54px; border-radius: 16px; border: none; background: #C93E1C; color: #fff; font: 700 17px Figtree, sans-serif">Continue</button>
    <a href="Thread.dc.html" style="height: 46px; display: flex; align-items: center; justify-content: center; color: {{c.sub}}; font-size: 15px; font-weight: 600; text-decoration: none">Just play free</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F2ECE3',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',field:'#EEE7DC',brandText:'#B33416',money:'#0E7C47'},
dark:{bg:'#0F0D0B',bg2:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',field:'#1D1916',brandText:'#FF8F6B',money:'#3DDC84'}};
class Component extends DCLogic {
  renderVals() { return { c: T[this.props.theme === 'dark' ? 'dark' : 'light'] }; }
}
</script>
</body>
</html>
