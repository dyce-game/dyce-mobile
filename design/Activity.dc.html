<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px">
    <a href="Profile.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; color: {{c.brandText}}; font-size: 17px; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Profile</a>
    <button style="height: 44px; border: none; background: none; color: {{c.brandText}}; font: 600 15px Figtree, sans-serif; padding: 0">Mark all read</button>
  </div>
  <h1 style="margin: 2px 16px 10px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.6px">Notifications</h1>

  <div style="display: flex; gap: 8px; padding: 0 16px 6px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button onClick="{{f.pick}}" style="height: 34px; padding: 0 14px; border-radius: 999px; border: none; font: 600 14px Figtree, sans-serif; background: {{f.bgc}}; color: {{f.fg}}">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 16px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="font-size: 13px; font-weight: 700; color: {{c.sub}}; padding: 14px 0 4px">{{g.label}}</div>
      <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid {{c.line}}">
          <div style="position: relative; flex-shrink: 0">
            <dc-import name="Avatar" size="44" skin="{{i.skin}}" hair="{{i.hair}}" hair-style="{{i.hs}}" bg="{{i.bg}}" shirt="{{i.shirt}}" hint-size="44px,44px"></dc-import>
            <span style="position: absolute; right: -4px; bottom: -4px; height: 20px; min-width: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; border: 2px solid {{c.bg}}; background: {{i.tagBg}}; color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{i.tag}}</span>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 14px; line-height: 1.4"><b>{{i.who}}</b> {{i.text}}</div>
            <div style="font-size: 12px; color: {{c.sub}}; margin-top: 2px">{{i.time}}</div>
            <sc-if value="{{i.cta}}" hint-placeholder-val="{{false}}">
              <a href="{{i.href}}" style="display: inline-flex; margin-top: 8px; height: 32px; padding: 0 14px; border-radius: 999px; background: {{i.ctaBg}}; color: {{i.ctaFg}}; font-size: 13px; font-weight: 700; align-items: center; text-decoration: none">{{i.cta}}</a>
            </sc-if>
          </div>
          <sc-if value="{{i.unread}}" hint-placeholder-val="{{false}}">
            <span style="width: 9px; height: 9px; border-radius: 50%; background: #C93E1C; margin-top: 6px; flex-shrink: 0"></span>
          </sc-if>
        </div>
      </sc-for>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',field:'#EEE7DC',brandText:'#B33416',brandSoft:'#FBE7DF',free:'#0E7C47',freeSoft:'#E3F6EA',ink:'#1B140F',inkText:'#FFFFFF'},
dark:{bg:'#0F0D0B',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',field:'#1D1916',brandText:'#FF8F6B',brandSoft:'#3A170C',free:'#3DDC84',freeSoft:'#11301F',ink:'#F7F1E8',inkText:'#1B140F'}};
const P={
 amaka:{skin:'#8D5524',hair:'#1C1714',hs:'bun',bg:'#FFC857',shirt:'#E0453A'},
 tunde:{skin:'#5C3A21',hair:'#111111',hs:'waves',bg:'#8FD3FF',shirt:'#1F2937'},
 zee:{skin:'#C68642',hair:'#2A1A12',hs:'long',bg:'#B8F2C8',shirt:'#C93E1C'},
 ngozi:{skin:'#A0662F',hair:'#3B2219',hs:'long',bg:'#FFB4C6',shirt:'#FFB020'},
 me:{skin:'#8D5524',hair:'#1C1714',hs:'afro',bg:'#C9B8FF',shirt:'#C93E1C'},
 shark:{skin:'#5C3A21',hair:'#111111',hs:'short',bg:'#8FD3FF',shirt:'#0E9F6E'}
};
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { f: 'all' }; }
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const V = '#C93E1C', G = '#0E7C47', O = '#C2410C';
    const it = (p, kind, tag, tagBg, who, text, time, o) => Object.assign({ kind, tag, tagBg, who, text, time, cta: false, href: '#', ctaBg: c.field, ctaFg: c.text, unread: false }, P[p], o || {});
    const all = [
      { label: 'Today', items: [
        it('amaka', 'turn', '8', G, 'Amaka', 'played her shot in 8 Ball. Your move.', '2m · Free', { cta: 'Play', href: 'Play8Ball.dc.html', ctaBg: V, ctaFg: '#fff', unread: true }),
        it('tunde', 'pool', '₦', V, 'Tunde', 'matched your ₦1,000. Sea Battle pot is ₦2,000.', '18m · Pool', { cta: 'Open game', href: 'PoolInvite.dc.html', unread: true }),
        it('ngozi', 'space', '+', O, '@ngozi.k', 'invited you to a Doodle Guess space. 5 of 8 seated.', '40m · Pool ₦300 a seat', { cta: 'Join', href: 'DoodleRoom.dc.html' }),
        it('me', 'hill', '♛', '#B37A00', 'You', 'held the Cup Pong hill against 3 challengers.', '1h · +₦1,500 into your pot')
      ]},
      { label: 'Earlier', items: [
        it('zee', 'pool', '↩', G, 'Refund', '₦500 came back. Zainab didn’t answer your Word Hunt pool in 24h.', 'Yesterday'),
        it('shark', 'pool', '₦', V, '@lagos_shark', 'won the ₦2,000 Sea Battle pot.', 'Yesterday', { cta: 'Run it back', href: 'ModeSheet.dc.html' }),
        it('me', 'xp', '7', G, 'Level 7', 'reached. New avatar backdrop unlocked.', 'Tue')
      ]}
    ];
    const keep = (i) => this.state.f === 'all' || i.kind === this.state.f || (this.state.f === 'turn' && i.kind === 'space');
    return {
      c,
      filters: [['all','All'],['turn','Your turn'],['pool','Pools']].map(([id, label]) => ({ label, bgc: this.state.f === id ? c.ink : c.field, fg: this.state.f === id ? c.inkText : c.text, pick: () => this.setState({ f: id }) })),
      groups: all.map((g) => ({ label: g.label, items: g.items.filter(keep) })).filter((g) => g.items.length)
    };
  }
}
</script>
</body>
</html>
