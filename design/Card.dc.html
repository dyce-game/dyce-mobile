<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce playing card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}; height: {{h}}; font-size: {{em}}; position: relative; box-sizing: border-box; border-radius: 1.3em; background: {{paper}}; box-shadow: inset 0 0 0 0.1em rgba(0,0,0,.14), inset 0 -0.25em 0 rgba(0,0,0,.08); overflow: hidden; font-family: Figtree, sans-serif; color: #1B140F" role="img" aria-label="{{label}}">

  <sc-if value="{{isUno}}" hint-placeholder-val="{{true}}">
    <span style="position: absolute; inset: 0.55em; border-radius: 0.9em; background: {{face}}"></span>
    <span style="position: absolute; inset: 0.55em; border-radius: 0.9em; background: linear-gradient(118deg, rgba(255,255,255,.32) 0%, rgba(255,255,255,0) 36%), repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 0.15em, transparent 0.15em 0.5em)"></span>
    <span style="position: absolute; left: 50%; top: 50%; width: 5.4em; height: 5.4em; margin: -2.7em 0 0 -2.7em; border-radius: 1.2em; transform: rotate(45deg); background: {{diamond}}; box-shadow: inset 0 -0.25em 0 rgba(0,0,0,.14), 0 0.2em 0.4em rgba(0,0,0,.2)"></span>
    <span style="position: absolute; left: 0; right: 0; top: 50%; margin-top: -0.6em; height: 1.2em; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: {{bigSize}}; font-weight: 800; color: {{ink}}; letter-spacing: -0.04em; text-shadow: 0.06em 0.06em 0 rgba(0,0,0,.22)">{{big}}</span>
    <sc-if value="{{isSkip}}" hint-placeholder-val="{{false}}">
      <svg style="position: absolute; left: 50%; top: 50%; width: 3.6em; height: 3.6em; margin: -1.8em 0 0 -1.8em" viewBox="0 0 24 24" fill="none" stroke="{{ink}}" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 18.4L18.4 5.6"/></svg>
    </sc-if>
    <span style="position: absolute; left: 0.95em; top: 0.75em; font-family: 'Bricolage Grotesque', sans-serif; font-size: 2em; font-weight: 800; color: #FFFFFF; text-shadow: 0.05em 0.05em 0 rgba(0,0,0,.35); line-height: 1">{{corner}}</span>
    <span style="position: absolute; right: 0.95em; bottom: 0.75em; transform: rotate(180deg); font-family: 'Bricolage Grotesque', sans-serif; font-size: 2em; font-weight: 800; color: #FFFFFF; text-shadow: 0.05em 0.05em 0 rgba(0,0,0,.35); line-height: 1">{{corner}}</span>
  </sc-if>

  <sc-if value="{{isWhot}}" hint-placeholder-val="{{false}}">
    <span style="position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.55), transparent 50%), repeating-radial-gradient(circle at 70% 60%, rgba(106,20,36,.035) 0 0.08em, transparent 0.08em 0.3em)"></span>
    <span style="position: absolute; inset: 0.55em; border-radius: 0.8em; border: 0.1em solid rgba(106,20,36,.45)"></span>
    <div style="position: absolute; left: 0.95em; top: 0.8em; display: flex; flex-direction: column; align-items: center; gap: 0.2em">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 2.1em; font-weight: 800; color: #6A1424; line-height: 1">{{value}}</span>
      <svg style="width: 1.3em; height: 1.3em" viewBox="0 0 24 24" fill="#6A1424" aria-hidden="true">
        <circle cx="12" cy="12" r="10" style="display: {{s.circle}}"/><polygon points="12,2 22.5,21 1.5,21" style="display: {{s.triangle}}"/><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z" style="display: {{s.cross}}"/><rect x="3" y="3" width="18" height="18" style="display: {{s.square}}"/><polygon points="12,1.5 14.9,8.6 22.5,9.2 16.7,14.1 18.5,21.6 12,17.6 5.5,21.6 7.3,14.1 1.5,9.2 9.1,8.6" style="display: {{s.star}}"/>
      </svg>
    </div>
    <div style="position: absolute; right: 0.95em; bottom: 0.8em; display: flex; flex-direction: column; align-items: center; gap: 0.2em; transform: rotate(180deg)">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 2.1em; font-weight: 800; color: #6A1424; line-height: 1">{{value}}</span>
      <svg style="width: 1.3em; height: 1.3em" viewBox="0 0 24 24" fill="#6A1424" aria-hidden="true">
        <circle cx="12" cy="12" r="10" style="display: {{s.circle}}"/><polygon points="12,2 22.5,21 1.5,21" style="display: {{s.triangle}}"/><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z" style="display: {{s.cross}}"/><rect x="3" y="3" width="18" height="18" style="display: {{s.square}}"/><polygon points="12,1.5 14.9,8.6 22.5,9.2 16.7,14.1 18.5,21.6 12,17.6 5.5,21.6 7.3,14.1 1.5,9.2 9.1,8.6" style="display: {{s.star}}"/>
      </svg>
    </div>
    <svg style="position: absolute; left: 50%; top: 50%; width: {{shapeSize}}; height: {{shapeSize}}; transform: translate(-50%, -50%); filter: drop-shadow(0.06em 0.08em 0 rgba(106,20,36,.25))" viewBox="0 0 24 24" fill="#7A1E2E" aria-hidden="true">
      <circle cx="12" cy="12" r="10" style="display: {{s.circle}}"/><polygon points="12,2 22.5,21 1.5,21" style="display: {{s.triangle}}"/><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z" style="display: {{s.cross}}"/><rect x="3" y="3" width="18" height="18" style="display: {{s.square}}"/><polygon points="12,1.5 14.9,8.6 22.5,9.2 16.7,14.1 18.5,21.6 12,17.6 5.5,21.6 7.3,14.1 1.5,9.2 9.1,8.6" style="display: {{s.star}}"/>
    </svg>
    <sc-if value="{{isWhotCard}}" hint-placeholder-val="{{false}}">
      <span style="position: absolute; left: 0; right: 0; top: 66%; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.7em; font-weight: 800; letter-spacing: 0.08em; color: #6A1424">WHOT</span>
    </sc-if>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"game":{"editor":"enum","options":["uno","whot"],"default":"uno"},"kind":{"editor":"enum","options":["num","action","skip","wild","shape","whot"],"default":"num"},"color":{"editor":"enum","options":["red","blue","green","yellow","wild","none"],"default":"blue"},"value":{"editor":"text","default":"7"},"shape":{"editor":"enum","options":["circle","triangle","cross","square","star","none"],"default":"circle"},"size":{"editor":"int","min":30,"max":300,"default":120},"$preview":{"width":120,"height":180}}'>
const COL={red:['#F2545B','#D7262E','#8E1218'],blue:['#4D93F0','#1C6DD0','#0D3F84'],green:['#4CC27A','#1F9A4E','#0E5A2C'],yellow:['#FFD95A','#F2B90F','#A87A00'],wild:['#3A3330','#15120F','#000000'],none:['#3A3330','#15120F','#000000']};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const W = Number(p.size) || 120;
    const game = p.game === 'whot' ? 'whot' : 'uno';
    const kind = p.kind || (game === 'whot' ? 'shape' : 'num');
    const col = COL[p.color] || COL.blue;
    const shape = ['circle','triangle','cross','square','star'].indexOf(p.shape) >= 0 ? p.shape : 'circle';
    const s = {}; ['circle','triangle','cross','square','star'].forEach((k) => { s[k] = k === shape ? 'inline' : 'none'; });
    const v = p.value || '';
    const wild = kind === 'wild';
    const yellow = p.color === 'yellow';
    return {
      w: W + 'px', h: (W * 1.5) + 'px', em: (W / 10) + 'px',
      isUno: game === 'uno', isWhot: game === 'whot', isSkip: kind === 'skip', isWhotCard: kind === 'whot',
      paper: game === 'whot' ? '#F8F1E2' : '#FBFAF6',
      face: 'linear-gradient(150deg, ' + col[0] + ' 0%, ' + col[1] + ' 48%, ' + col[2] + ' 100%)',
      diamond: wild ? 'conic-gradient(from 45deg, #D7262E 0 25%, #1C6DD0 25% 50%, #1F9A4E 50% 75%, #F2B90F 75%)' : '#FBFAF6',
      ink: wild ? '#FFFFFF' : (yellow ? '#8A5E00' : col[1]),
      big: kind === 'skip' ? '' : (wild ? (v || '') : v),
      bigSize: kind === 'action' || (v && v.length > 1) ? '3.4em' : '4.6em',
      corner: kind === 'skip' ? '⊘' : (wild ? (v || 'W') : v),
      shapeSize: kind === 'whot' ? '3.2em' : '4.8em',
      s, value: v,
      label: game === 'whot' ? (kind === 'whot' ? 'Whot 20' : v + ' ' + shape) : (wild ? 'Wild card' : (kind === 'skip' ? 'Skip ' + p.color : v + ' ' + p.color))
    };
  }
}
</script>
</body>
</html>
