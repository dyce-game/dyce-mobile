<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dyce — Wallet history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Bricolage+Grotesque:wght@600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; font-family: Figtree, -apple-system, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px">
    <a href="Wallet.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; color: {{c.brandText}}; font-size: 17px; text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Wallet</a>
    <span style="font-size: 13px; color: {{c.sub}}; font-weight: 600">November</span>
  </div>
  <h1 style="margin: 2px 16px 10px; font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.6px">History</h1>

  <div style="margin: 0 16px; border-radius: 18px; background: {{c.bg2}}; padding: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 13px; color: {{c.sub}}; font-weight: 600">This week, net</span>
      <span style="font-size: 20px; font-weight: 800; color: {{c.money}}">+₦4,500</span>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 8px; height: 70px; margin-top: 10px" role="img" aria-label="Daily net for the week">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end">
          <span style="width: 100%; height: {{b.h}}; border-radius: 6px; background: {{b.c}}"></span>
          <span style="font-size: 10px; color: {{c.sub}}; font-weight: 700">{{b.d}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; gap: 6px; padding: 12px 16px 4px; overflow: hidden">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
      <button onClick="{{f.pick}}" style="height: 34px; padding: 0 12px; border-radius: 17px; border: none; font: 600 13px Figtree, sans-serif; background: {{f.bgc}}; color: {{f.fg}}; flex-shrink: 0">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 16px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="font-size: 12px; font-weight: 700; color: {{c.sub}}; padding: 12px 0 2px">{{g.label}}</div>
      <sc-for list="{{g.items}}" as="t" hint-placeholder-count="3">
        <a href="Receipt.dc.html" style="display: flex; align-items: center; gap: 12px; height: 58px; border-bottom: 1px solid {{c.line}}; text-decoration: none; color: {{c.text}}">
          <span style="width: 38px; height: 38px; border-radius: 11px; background: {{t.bg}}; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{t.m}}</span>
          <div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.t}}</div><div style="font-size: 12px; color: {{c.sub}}">{{t.d}}</div></div>
          <span style="font-size: 15px; font-weight: 700; color: {{t.color}}">{{t.amt}}</span>
        </a>
      </sc-for>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
const T={light:{bg:'#FBF8F3',bg2:'#F2ECE3',text:'#1B140F',sub:'#6F655B',line:'#E6DDD0',field:'#EEE7DC',brandText:'#B33416',money:'#0E7C47',ink:'#1B140F',inkText:'#FFFFFF',lossBar:'#F4A9B4'},
dark:{bg:'#0F0D0B',bg2:'#1D1916',text:'#F7F1E8',sub:'#ABA196',line:'#2E2823',field:'#1D1916',brandText:'#FF8F6B',money:'#3DDC84',ink:'#F7F1E8',inkText:'#1B140F',lossBar:'#7A2A36'}};
const TX=[
 ['Today',[['pool','WH','#C98500','Won Word Hunt pool','vs Tunde · 4:05 PM','+₦1,500',1],['pool','+4','#C2410C','Space entry · Crazy Cards','Sunday Game Night','−₦500',0],['transfer','₦','#C93E1C','From Zainab','"for the rematch"','+₦5,000',1],['transfer','→','#2457D6','To Amaka','Request paid','−₦2,000',0]]],
 ['Yesterday',[['pool','SB','#0B2A55','Lost Sea Battle pool','vs @lagos_shark · on hold, reported','−₦1,000',0],['bonus','↩','#0E7C47','Refund','Zainab didn’t answer in 24h','+₦500',1],['bonus','+','#0E7C47','Daily top-up','Balance was under ₦5,000','+₦1,000',1]]]
];
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { f: 'all' }; }
  renderVals() {
    const c = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const f = this.state.f;
    const D = [['M',30],['T',-10],['W',55],['T',20],['F',-25],['S',70],['S',40]];
    return {
      c,
      bars: D.map(([d, v]) => ({ d, h: Math.abs(v) + '%', c: v < 0 ? c.lossBar : '#2BB673' })),
      filters: [['all','All'],['pool','Pools'],['transfer','Transfers'],['bonus','Bonuses & refunds']].map(([id, label]) => ({ label, bgc: f === id ? c.ink : c.field, fg: f === id ? c.inkText : c.text, pick: () => this.setState({ f: id }) })),
      groups: TX.map(([label, rows]) => ({ label, items: rows.filter((r) => f === 'all' || r[0] === f).map(([k, m, bg, t, d, amt, plus]) => ({ m, bg, t, d, amt, color: plus ? c.money : c.text })) })).filter((g) => g.items.length)
    };
  }
}
</script>
</body>
</html>
