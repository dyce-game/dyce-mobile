packages:
  - packages/*

# Metro (React Native) needs a flat node_modules. See ADR-006.
nodeLinker: hoisted
strictPeerDependencies: false
# Don't silently run `pnpm install` before every script (it can hang on a flaky network).
verifyDepsBeforeRun: false

allowBuilds:
  '@swc/core': true
  # optional native speed-up for a messaging library; the pure JavaScript fallback is used without it
  msgpackr-extract: false
  # downloads the sentry-cli binary that uploads source maps and native symbols (only used when SENTRY_ORG is set)
  '@sentry/cli': true
