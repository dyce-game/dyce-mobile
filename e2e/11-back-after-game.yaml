# Navigation: after a game ends, "Back to chat" on the result screen shows the thread, and the thread's back arrow
# goes to the chat list (not back into the game screens). (This was BUG-2. Fixed 2026-11-24, see docs/qa/BUGS.md.)
# Run it with:
#   node scripts/e2e/web-runner.mjs e2e/11-back-after-game.yaml
appId: games.dyce.app
name: back after game
tags: [web, phase2]
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/login.yaml
    env:
      PHONE: '${ALICE_PHONE}'
- tapOn: 'Ben QA.*'
- tapOn: 'Open games'
- scrollUntilVisible:
    element: 'Pig, .*'
- tapOn: 'Pig, .*'
- tapOn: 'Send Pig'
- runScript:
    file: scripts/ben-game.js
    env:
      BEN_ACTION: accept
- tapOn: 'Play Pig'
- tapOn: 'Game menu'
- tapOn: 'Resign'
- extendedWaitUntil:
    visible: 'Resign this game.+'
    timeout: 5000
- tapOn:
    text: 'Resign'
    index: -1 # the confirm button (the menu row of the same name is behind it)
- extendedWaitUntil:
    visible: 'Back to chat'
    timeout: 15000
- tapOn: 'Back to chat'
- assertVisible: 'Ben QA, chat info'
- tapOn: 'Back to chats'
# the chat list, not the thread or a game screen
- extendedWaitUntil:
    visible: 'New in Chat'
    timeout: 5000
