# A Pool match end to end: Alice sends Pig (the reference game, in dev builds) for Ð500 each from the Games
# drawer, Ben accepts, the pot is locked, Alice resigns (a real, deliberate loss) and the server pays Ben the
# pot. Wallets are read from the API on both sides (scripts/balances.js) before, during and after.
appId: games.dyce.app
name: pool match
tags: [web, phase2, games, money]
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/login.yaml
    env:
      PHONE: '${ALICE_PHONE}'
- runScript: scripts/balances.js
- assertTrue: ${output.aliceKobo == 20000000 && output.benKobo == 20000000}
- evalScript: ${output.aliceBefore = output.aliceKobo; output.benBefore = output.benKobo}
- tapOn: 'Ben QA.*'
- tapOn: 'Open games'
- scrollUntilVisible:
    element: 'Pig, .*'
- tapOn: 'Pig, .*'
- tapOn: 'Pool'
- tapOn: 'Ð500 each'
- assertVisible: '.*Ð1,000.*Locked until the game ends.*'
- tapOn: 'Lock Ð500 & send'
- extendedWaitUntil:
    visible: '.*Pig.*'
    timeout: 10000
- takeScreenshot: pool-card-sent
# the stake is locked the moment it is sent
- runScript: scripts/balances.js
- assertTrue: ${output.aliceKobo == output.aliceBefore - 50000}
# Ben accepts: his Ð500 is locked too
- runScript:
    file: scripts/ben-game.js
    env:
      BEN_ACTION: accept
- runScript: scripts/balances.js
- assertTrue: ${output.benKobo == output.benBefore - 50000}
- tapOn: 'Play Pig'
- takeScreenshot: pool-host
- tapOn: 'Game menu'
- tapOn: 'Resign and lose Ð500'
- assertVisible: 'Resign this game\?'
- assertVisible: 'Ben QA wins and takes the Ð1,000 pot.*'
- takeScreenshot: pool-resign-confirm
- tapOn:
    text: 'Resign and lose Ð500'
    index: -1 # the confirm button (the menu row of the same name is behind it)
- extendedWaitUntil:
    visible: 'Ben QA took the pool'
    timeout: 15000
- assertVisible: '−Ð500' # (a real minus sign, U+2212)
- assertVisible: 'Dyce Cash is virtual.*'
- takeScreenshot: pool-result
# the server paid the pot: Alice down Ð500, Ben up Ð500, nothing left locked, same on both sides
- runScript: scripts/balances.js
- assertTrue: ${output.aliceKobo == output.aliceBefore - 50000}
- assertTrue: ${output.benKobo == output.benBefore + 50000}
- assertTrue: ${output.aliceLockedKobo == 0}
