# Request money with a QR code and get paid by a second person; then pay someone else's code.
# "Second phone": Maestro drives one device, so Ben is a script that calls the API as Ben (he pays the QR
# request exactly as his app would after scanning it). Needs the seeded users (scripts/seed/seed.mjs).
appId: games.dyce.app
name: qr-pay
tags: [web, phase1, money]
---
- launchApp:
    clearState: true
- runFlow:
    file: subflows/login.yaml
    env:
      PHONE: '${ALICE_PHONE}'
- tapOn: 'Wallet'
- assertVisible: 'Balance ₦200,000'
# --- Alice asks for ₦2,000 with a QR code
- tapOn: 'Request'
- assertVisible: 'Anyone can scan the QR'
- tapOn: 'Rematch stake'
- tapOn:
    text: 'Request ₦2,000'
    index: 1 # the amount chip has the same label; the big button is the last one
- extendedWaitUntil:
    visible: 'Waiting for payment.*'
    timeout: 10000
- takeScreenshot: qr-pay-request-shown
# --- Ben pays it (API, as Ben): find Alice's newest open request and pay it
- runScript:
    file: scripts/ben-pays-alice-request.js
- extendedWaitUntil:
    visible: 'Paid'
    timeout: 15000
- assertVisible: 'by Ben QA'
- takeScreenshot: qr-pay-paid
- tapOn: 'Done'
# The history is refetched on open, so it shows the payment (see BUG-1 about the balance on the Wallet tab).
- tapOn: 'History'
- assertVisible: '.*received ₦2,000.*'
- back
# --- Ben shows a QR request; Alice pays it by entering the code ("Pay a code")
- runScript:
    file: scripts/ben-requests-from-alice.js
- tapOn: 'Pay a code'
- tapOn: 'https://dyce.games/r/.*'
- inputText: '${output.requestCode}'
- tapOn: 'Continue'
- assertVisible: 'Ben QA'
- assertVisible: 'Balance after ₦200,500.*'
- tapOn: 'Pay ₦1,500'
- assertVisible: 'Paid ₦1,500'
- assertVisible: 'Balance ₦200,500'
- tapOn: 'View receipt'
- assertVisible: '.*Paid ₦1,500.*'
- back
- tapOn: 'Done'
- assertVisible: 'Balance ₦200,500'
